    <div style="background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:12px 15px;${full?'grid-column:1/-1':''}">
      <p style="${mono};font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:3px;color:${t.ink}">${label}</p>
      <p style="${serif};font-size:16.5px;color:${t.ink}">${esc(value)||'—'}</p>
    </div>`;

  const wpOn = !!l.wallpaper;
  const wpStyle = wpOn
    ? `background-image:linear-gradient(${hexA(t.bg,1-(l.wallpaperOpacity||18)/100)},${hexA(t.bg,1-(l.wallpaperOpacity||18)/100)}),url('${l.wallpaper}');background-size:auto,cover;background-position:center;background-attachment:scroll;background-color:${t.bg};`
    : `background:${t.bg};`;
  /* Accordéon du livret. `ouvert` est le défaut ; l'impression force l'ouverture. */
  const lvacc=(icon,titre,badge,corps,ouvert=false)=>`
    <details class="lvacc" style="background:${t.paper};border:1px solid ${t.line}" ${(deplie||ouvert)?'open':''}>
      <summary style="color:${t.ink}">
        <span style="width:32px;height:32px;flex:none;border-radius:10px;background:${t.accentSoft};color:${t.accent};display:flex;align-items:center;justify-content:center">${I(icon,15)}</span>
        <span style="flex:1;min-width:0;font-size:14px;font-weight:600">${esc(titre)}</span>
        ${badge?`<span style="${mono};font-size:9.5px;letter-spacing:.08em;opacity:.5;flex:none">${esc(badge)}</span>`:''}
        <span class="lvacc-chev">${I('chevron',16)}</span>
      </summary>
      <div class="lvacc-body">${corps}</div>
    </details>`;

  let out=LIVRET_CSS+`<div class="lv" style="${wpStyle}color:${t.ink};padding-bottom:46px;font-family:'Inter',-apple-system,sans-serif">`;

  /* ---- Couverture (3 styles) ---- */
  const coverLabel=guideLabelLang(g.id, lang);
  const kicker=`<p style="${mono};font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:${t.accent};margin-bottom:10px">${esc(coverLabel)}</p>`;
  const titleH=`<h1 style="${serif};font-size:34px;font-weight:500;line-height:1.1;margin-bottom:9px">${esc(l.nom||'Votre logement')}</h1>`;
  /* Adresse complète, cliquable vers l'application de cartes du téléphone.
     Chaque morceau est facultatif : un livret antérieur sans code postal
     n'affiche ni virgule orpheline ni espace parasite. */
  const adresseTxt=adresseComplete(l);
  const adresseP=adresseTxt?`<p style="margin-bottom:10px"><a href="${mapsUrl(adresseTxt)}" target="_blank" rel="noopener noreferrer"
      style="display:inline-flex;align-items:flex-start;gap:6px;font-size:13.5px;opacity:.7;color:inherit;text-decoration:none;border-bottom:1px solid ${t.line};padding-bottom:2px">
      <span style="line-height:0;flex:none;margin-top:1px">${I('pin',13)}</span>${esc(adresseTxt)}</a></p>`:'';
  /* Étage : texte libre (« RDC », « 3ème gauche »…), juste sous l'adresse.
     Entièrement masqué — libellé compris — si le champ est vide ou absent. */
  const etageTxt=String(l.etage||'').trim();
  const etageP=etageTxt?`<p style="display:flex;align-items:baseline;gap:7px;font-size:13px;opacity:.72;margin-bottom:10px">
      <span style="${mono};font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.62;flex:none">${esc(X.etage)}</span>${esc(etageTxt)}</p>`:'';
  const lieuP=adresseP+etageP;
  const accP=l.accroche?`<p style="${serif};font-style:italic;font-size:15.5px;opacity:.85;line-height:1.45">${esc(l.accroche)}</p>`:'';
  const perfo=`<div style="height:1px;background-image:radial-gradient(circle,${t.bg} 2px,transparent 2.5px);background-size:12px 12px"></div>`;

  if(has('cover')){
    if(l.coverStyle==='minimal'||(!cover&&l.coverStyle!=='photo')){
      out+=`<div style="max-width:600px;margin:0 auto;padding:52px 30px 6px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:26px">${logoSVG(22,t.accent)}<span style="flex:1;height:1px;background:${t.line}"></span></div>
        ${kicker}
        <h1 style="${serif};font-size:42px;font-weight:500;line-height:1.08;margin-bottom:12px;letter-spacing:-.01em">${esc(l.nom||'Votre logement')}</h1>
        ${lieuP}${accP}
        <div style="margin-top:24px">${perfo}</div>
        ${l.bienvenue?`<p style="font-size:14.5px;line-height:1.7;margin-top:22px;opacity:.92">${esc(l.bienvenue)}</p>`:''}
      </div>`;
    } else if(l.coverStyle==='cadre'&&cover){
      out+=`<div style="max-width:600px;margin:0 auto;padding:38px 30px 6px">
        <img src="${cover.dataUrl}" style="width:100%;height:250px;object-fit:cover;display:block;border-radius:14px;border:1px solid ${t.line};box-shadow:0 14px 40px rgba(0,0,0,.14)">
        <div style="padding:26px 4px 0">${kicker}${titleH}${lieuP}${accP}</div>
        <div style="margin-top:22px">${perfo}</div>
        ${l.bienvenue?`<p style="font-size:14.5px;line-height:1.7;margin-top:22px;opacity:.92">${esc(l.bienvenue)}</p>`:''}
      </div>`;
    } else {
      out+=`<div style="max-width:600px;margin:0 auto;padding:36px 26px 6px">
        <div style="background:${t.paper};border:1px solid ${t.line};border-radius:16px;overflow:hidden">
          ${cover?`<img src="${cover.dataUrl}" style="width:100%;height:235px;object-fit:cover;display:block">`
            :`<div style="height:150px;display:flex;align-items:center;justify-content:center;background:${t.accentSoft}">${logoSVG(38,t.accent)}</div>`}
          <div style="padding:27px 27px 24px">${kicker}${titleH}${lieuP}${accP}</div>
          ${perfo}
        </div>
        ${l.bienvenue?`<p style="font-size:14.5px;line-height:1.7;margin-top:21px;opacity:.92;padding:0 4px">${esc(l.bienvenue)}</p>`:''}
      </div>`;
    }
  }

  /* ---- Bandeau essentiels (livret complet) ----
     Horaires d'arrivée et de départ côte à côte, puis le wifi EN DESSOUS sur toute
     la largeur — et non plus en troisième colonne à côté des horaires. */
  if(has('essentials')&&(l.arrivee.heure||l.depart.heure||l.wifi.ssid)){
    const tuile=(label,valeur,taille=17)=>`
        <div style="background:${t.accentSoft};border-radius:10px;padding:11px 13px;text-align:center;overflow:hidden">
          <p style="${mono};font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:2px">${label}</p>
          <p style="${serif};font-size:${taille}px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden">${esc(valeur||'—')}</p>
        </div>`;
    out+=`<div style="max-width:600px;margin:0 auto;padding:20px 26px 0">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
        ${tuile(X.arrivee, l.arrivee.heure)}
        ${tuile(lang==='fr'?'Départ':X.avant.split(' ')[0], l.depart.heure)}
      </div>
      ${l.wifi.ssid?`<div style="margin-top:9px">${tuile(X.wifi, l.wifi.ssid)}</div>`:''}
    </div>`;
  }

  out+=`<div style="max-width:600px;margin:0 auto;padding:30px 26px 0;display:flex;flex-direction:column;gap:36px">`;

  if(has('arrivee')) out+=`<section>${secTitle('key',X.arrivee)}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      ${block(X.depuis, l.arrivee.heure)}
      ${block(X.avant, l.depart.heure)}
      ${l.arrivee.codeAcces?block(X.code, l.arrivee.codeAcces, true):''}
    </div>
    ${l.arrivee.instructions?`<p style="font-size:14px;line-height:1.7;opacity:.88">${esc(l.arrivee.instructions)}</p>`:''}
    ${l.arrivee.parking?`
    <div style="display:flex;align-items:center;gap:11px;margin-top:12px;background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:11px 14px">
      <span style="width:30px;height:30px;border-radius:8px;background:${t.accentSoft};color:${t.accent};display:flex;align-items:center;justify-content:center;flex:none">${I('parking',17)}</span>
      <div><p style="${mono};font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:1px">${X.parking}</p>
      <p style="font-size:13.5px;line-height:1.45">${esc(l.arrivee.parking)}</p></div>
    </div>`:''}
  </section>`;

  if(has('wifi')&&(l.wifi.ssid||l.wifi.mdp)) out+=`<section>${secTitle('wifi',X.wifi)}
    <div style="display:flex;gap:12px;align-items:stretch;flex-wrap:wrap">
      <div style="flex:1;min-width:200px;display:grid;grid-template-columns:1fr;gap:10px">
        ${block(X.reseau, l.wifi.ssid)}
        ${block(X.mdp, l.wifi.mdp)}
      </div>
      ${qr?`<div style="background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <img src="${qr}" style="width:106px;height:106px;display:block;border-radius:4px">
        <p style="${mono};font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.55">${X.scan}</p>
      </div>`:''}
    </div>
  </section>`;

  /* Un accordéon par catégorie. Une catégorie sans aucun équipement retenu
     n'apparaît pas du tout — grouperParCat ne renvoie que les non vides. */
  if(has('equipements')&&l.equipements.some(e=>e.nom)){
    const grp=grouperParCat(l.equipements.filter(e=>e.nom), EQUIP_CATS, equipCatConnue);
    out+=`<section>${secTitle('sofa',X.equip)}
    <div>
      ${grp.map(c=>lvacc(c.icon, catL10N(c.id,lang), String(c.entrees.length),
        c.entrees.map(({item:e})=>`
        <div>
          <p style="font-size:14px;font-weight:600;margin-bottom:2px">${esc(e.nom)}</p>
          ${e.instructions?`<p style="font-size:13px;opacity:.72;line-height:1.65">${esc(e.instructions)}</p>`:''}
        </div>`).join(''))).join('')}
    </div>
  </section>`;
  }

  if(has('reglement')&&l.reglement.some(Boolean)) out+=`<section>${secTitle('shield',X.regl)}
    <div style="background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:16px 18px">
    <ul style="list-style:none;display:flex;flex-direction:column;gap:8px;margin:0;padding:0">
      ${l.reglement.filter(Boolean).map(r=>`<li style="font-size:14px;opacity:.88;display:flex;gap:10px;line-height:1.55"><span style="color:${t.accent};flex:none">—</span>${esc(r)}</li>`).join('')}
    </ul></div>
  </section>`;

  if(has('quartier')&&l.recos.length) out+=`<section>${secTitle('compass',X.quartier)}
    <div style="display:flex;flex-direction:column;gap:9px">
      ${l.recos.filter(r=>r.nom).map(r=>{ const c=catOf(r.cat); return `
      <div style="display:flex;gap:13px;background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:13px 15px">
        <div style="width:34px;height:34px;border-radius:10px;background:${t.accentSoft};color:${t.accent};display:flex;align-items:center;justify-content:center;flex:none">${I(c.icon,15)}</div>
        <div style="flex:1;min-width:0">
          <p style="font-size:14px;font-weight:600">${esc(r.nom)} <span style="${mono};font-size:9px;letter-spacing:.07em;text-transform:uppercase;opacity:.45;margin-left:4px">${c.label}</span></p>
          ${r.desc?`<p style="font-size:13px;opacity:.72;line-height:1.6;margin-top:1px">${esc(r.desc)}</p>`:''}
          ${r.mapsUrl?`<a href="${esc(r.mapsUrl)}" target="_blank" style="font-size:12px;color:${t.accent};text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-weight:500"><span style="line-height:0">${I('pin',11)}</span>${X.itineraire}</a>`:''}
        </div>
      </div>`;}).join('')}
    </div>
  </section>`;

  if(has('galerie')&&gallery.length) out+=`<section>${secTitle('image',X.images)}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px">
      ${gallery.map(p=>`<img src="${p.dataUrl}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;border:1px solid ${t.line}">`).join('')}
    </div>
  </section>`;

  if(has('depart')&&l.depart.checklist.some(Boolean)) out+=`<section>${secTitle('logout',X.avantpartir)}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">${block(X.avant, l.depart.heure)}</div>
    <div style="background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:15px 17px">
      <p style="${mono};font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:10px">${X.checklist}</p>
      ${l.depart.checklist.filter(Boolean).map(c=>`
      <p style="font-size:13.5px;display:flex;gap:10px;align-items:baseline;line-height:1.5;padding:5px 0">
        <span style="display:inline-block;width:14px;height:14px;border:1.5px solid ${t.accent};border-radius:4px;flex:none;transform:translateY(2px)"></span>${esc(c)}</p>`).join('')}
    </div>
  </section>`;

  /* FAQ : un accordéon par question — c'est la forme naturelle d'une FAQ. */
  if(has('faq')&&l.faq.some(f=>f.q)) out+=`<section>${secTitle('book',X.faq)}
    <div>
      ${l.faq.filter(f=>f.q).map(f=>lvacc('book', f.q, '',
        f.r?`<p style="font-size:13px;opacity:.78;line-height:1.65">${esc(f.r)}</p>`
           :`<p style="font-size:13px;opacity:.5;line-height:1.65">—</p>`)).join('')}
    </div>
  </section>`;

  if(has('urgences')&&l.urgences.some(u=>u.label)){
    const grp=grouperParCat(l.urgences.filter(u=>u.label), URG_CATS, urgCatConnue);
    const ligneUrg=u=>`
      <div style="display:flex;align-items:center;gap:12px;background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:12px 15px">
        <div style="flex:1;min-width:0">
          <p style="font-size:13.5px;font-weight:600">${esc(u.label)}</p>
          ${u.note?`<p style="font-size:12.5px;opacity:.7;line-height:1.55;margin-top:1px">${esc(u.note)}</p>`:''}
        </div>
        ${u.valeur?`<span style="${serif};font-size:18px;color:${t.accent};white-space:nowrap;font-weight:500">${esc(u.valeur)}</span>`:''}
      </div>`;
    out+=`<section>${secTitle('shield',X.urgences)}
    <div style="display:flex;flex-direction:column;gap:9px">
      ${grp.map(c=>{
        const corps=c.entrees.map(({item:u})=>ligneUrg(u)).join('');
        /* Les numéros d'urgence ne sont JAMAIS repliables : un voyageur avec une
           fuite d'eau à 23h ne doit pas avoir à cliquer pour trouver un numéro.
           C'est le seul endroit du produit où l'uniformité serait une faute. */
        if(c.id===URG_NUMEROS) return `<div>
          <p style="${mono};font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:8px;display:flex;align-items:center;gap:7px">
            <span style="line-height:0;color:${t.accent}">${I(c.icon,13)}</span>${esc(catL10N(c.id,lang))}</p>
          <div style="display:flex;flex-direction:column;gap:8px">${corps}</div>
        </div>`;
        /* Les autres groupes sont dépliés par défaut, mais repliables. */
        return lvacc(c.icon, catL10N(c.id,lang), String(c.entrees.length), corps, true);
      }).join('')}
    </div>
  </section>`;
  }

  const ct=l.contacts;
  if(has('contacts')&&(ct.hote||ct.tel||ct.email||ct.urgence)) out+=`<section>${secTitle('phone',X.contact)}
    <div style="background:${t.accentSoft};border-radius:12px;padding:17px 19px;display:flex;flex-direction:column;gap:7px">
      ${ct.hote?`<p style="${serif};font-size:16px;font-weight:500">${esc(ct.hote)}</p>`:''}
      ${ct.tel?`<p style="display:flex;align-items:center;gap:8px;font-size:13.5px"><span style="line-height:0;color:${t.accent}">${I('phone',13)}</span>${esc(ct.tel)}</p>`:''}
      ${ct.email?`<p style="display:flex;align-items:center;gap:8px;font-size:13.5px"><span style="line-height:0;color:${t.accent}">${I('mail',13)}</span>${esc(ct.email)}</p>`:''}
      ${ct.urgence?`<p style="font-size:12.5px;opacity:.72;padding-top:3px">${X.urgence} : ${esc(ct.urgence)}</p>`:''}
    </div>
  </section>`;

  out+=`</div><div style="display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:42px">
    <span style="width:34px;height:1px;background:${t.line}"></span>
    ${S.settings.logo
      ? `<img src="${S.settings.logo}" style="max-height:38px;max-width:150px;object-fit:contain;opacity:.9">`
      : logoSVG(20,t.accent)}
    <p style="${mono};font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.42">${esc(S.settings.conciergerie||'Smart Guide')}</p>
  </div></div>`;
  return out;
}
/* ---------------- Audit IA du livret ---------------- */
const AUDIT_SECTIONS = { infos:'Le logement', arrivee:'Arrivée', depart:'Départ', wifi:'Wifi', equipements:'Équipements',
  reglement:'Règlement', quartier:'Dans le quartier', urgences:'Urgences & FAQ', contacts:'Contacts', photos:'Photos', style:'Habillage' };

/* Contrôles déterministes, sans IA — toujours disponibles */
function auditLocal(l){
  const miss=[];
  const add=(sec,titre,pourquoi,grave)=>miss.push({section:sec,titre,pourquoi,grave});
  if(!l.nom) add('infos','Le logement n\'a pas de nom','Il apparaît en couverture du livret.',true);
  if(!l.ville) add('infos','Ville non renseignée','Nécessaire pour la recherche des adresses du quartier.',false);
  if(!l.adresse) add('infos','Adresse non renseignée','Sans elle, impossible de proposer les commerces et transports alentour.',false);
  if(!l.accroche&&!l.bienvenue) add('infos','Aucun mot de bienvenue','C\'est la première impression du voyageur.',false);
  if(!l.arrivee.codeAcces&&!l.arrivee.instructions) add('arrivee','Aucune instruction d\'accès','C\'est la première cause d\'appel le jour de l\'arrivée.',true);
  if(!l.arrivee.parking) add('arrivee','Stationnement non précisé','Question posée par presque tous les voyageurs en voiture.',false);
  if(!l.wifi.ssid) add('wifi','Wifi non renseigné','Deuxième cause d\'appel après l\'accès.',true);
  if(!l.depart.checklist.some(Boolean)) add('depart','Check-list de départ vide','Sans elle, le ménage part souvent d\'un logement mal rendu.',true);
  if(!l.equipements.some(e=>e.nom)) add('equipements','Aucun équipement documenté','La bibliothèque permet d\'en ajouter en quelques clics.',false);
  if(!l.contacts.tel) add('contacts','Aucun téléphone de contact','Indispensable en cas de problème.',true);
  if(!l.contacts.urgence) add('contacts','Pas de contact hors horaires','Rassure fortement le voyageur.',false);
  if(!l.urgences.some(u=>u.label)) add('urgences','Aucun numéro d\'urgence','La bibliothèque contient les numéros officiels.',false);
  if(!l.faq.some(f=>f.q)) add('urgences','Aucune question fréquente','La FAQ réduit nettement les messages reçus.',false);
  if(!l.photos.length) add('photos','Aucune photo','La couverture reste vide et le livret paraît impersonnel.',true);
  else if(l.photos.length<3) add('photos','Peu de photos','Trois à six photos donnent un livret bien plus vivant.',false);
  if(!l.recos.length) add('quartier','Aucune adresse dans le quartier','C\'est la section la plus appréciée des voyageurs.',false);
  return miss;
}
function auditScore(l, miss){
  const graves=miss.filter(m=>m.grave).length, legers=miss.length-graves;
  return Math.max(0, Math.min(100, 100 - graves*11 - legers*4));
}
async function runAudit(){
  const l=cur();
  const miss=auditLocal(l);
  const score=auditScore(l,miss);
  drawAudit(l, {score, miss, ia:null, loading:!!S.settings.apiKey});
  if(!S.settings.apiKey) return;
  try{
    const ctx=JSON.stringify({
      nom:l.nom, ville:l.ville, accroche:l.accroche, bienvenue:l.bienvenue,
      arrivee:l.arrivee, depart:l.depart, wifi:{configure:!!l.wifi.ssid},
      equipements:l.equipements.map(e=>({nom:e.nom,instructions:e.instructions})),
      reglement:l.reglement.filter(Boolean), quartier:l.recos.map(r=>({nom:r.nom,desc:r.desc})),
      urgences:l.urgences.map(u=>u.label), faq:l.faq.map(f=>f.q),
      contacts:{hote:!!l.contacts.hote, tel:!!l.contacts.tel, urgence:!!l.contacts.urgence},
      nbPhotos:l.photos.length,
    });
    const raw=await callClaude(
`Tu es un voyageur exigeant qui arrive ce soir dans ce logement et ne peut joindre personne. Voici le livret d'accueil qu'on t'a remis :
${ctx}

Relis-le avec ce regard et identifie ce qui te bloquerait ou t'agacerait réellement. Concentre-toi sur les formulations ambiguës, les informations contradictoires, les étapes manquantes dans les instructions, le ton maladroit — pas sur les champs simplement vides.

Réponds UNIQUEMENT en JSON strict :
{"verdict":"une phrase de synthèse honnête, 20 mots max",
 "forts":["2 à 3 points réellement réussis"],
 "ameliorations":[{"section":"infos|arrivee|depart|wifi|equipements|reglement|quartier|urgences|contacts|photos","titre":"court","conseil":"une phrase actionnable"}]}
Maximum 5 améliorations, les plus utiles d'abord.`, 1500);
    const ia=parseJSONLoose(raw);
    l.audit={date:Date.now(), score}; touch(l);
    drawAudit(l, {score, miss, ia, loading:false});
  }catch(e){
    drawAudit(l, {score, miss, ia:null, loading:false, err:e.message==='NO_KEY'?'':('IA indisponible : '+e.message)});
  }
}
function drawAudit(l, st){
  const ring=(pc)=>{ const r=34,c=2*Math.PI*r; const col=pc>=80?'#66795A':pc>=55?'#B98D3F':'#B0523B';
    return `<div style="position:relative;width:84px;height:84px;flex:none">
      <svg width="84" height="84" viewBox="0 0 84 84" style="transform:rotate(-90deg)">
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="#E6E1D4" stroke-width="7"/>
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pc/100)}" style="transition:stroke-dashoffset .9s var(--ease)"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span style="font-family:var(--serif);font-size:24px;line-height:1;color:${col}">${pc}</span>
        <span style="font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;color:var(--muted)">/ 100</span>
      </div></div>`; };
  const verdictTxt = st.score>=85?'Livret prêt à être envoyé.' : st.score>=65?'Bon livret, quelques manques à combler.' : st.score>=40?'Les bases sont là, il reste du travail.' : 'Livret encore incomplet.';
  const graves=st.miss.filter(m=>m.grave), legers=st.miss.filter(m=>!m.grave);
  const missRow=m=>`<button class="audit-row ${m.grave?'grave':''}" onclick="gotoSection('${m.section}')">
      <span class="ar-dot"></span>
      <span class="ar-txt"><strong>${esc(m.titre)}</strong><span>${esc(m.pourquoi)}</span></span>
      <span class="ar-sec">${esc(AUDIT_SECTIONS[m.section]||'')} ${I('right',12)}</span>
    </button>`;
  document.getElementById('modal-root').innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal wide lib-modal" style="max-width:660px">
      <div class="lib-head">
        <div><h3>Audit du livret</h3><p class="sub" style="margin:0">Ce qu'un voyageur trouverait — ou ne trouverait pas.</p></div>
        <button class="icon-x" onclick="closeModal()">${I('x',18)}</button>
      </div>
      <div class="audit-hero">
        ${ring(st.score)}
        <div>
          <p class="audit-verdict">${st.ia?.verdict?esc(st.ia.verdict):verdictTxt}</p>
          <p class="ai-note">${graves.length?`${graves.length} point${graves.length>1?'s':''} bloquant${graves.length>1?'s':''}`:'Aucun point bloquant'}${legers.length?` · ${legers.length} amélioration${legers.length>1?'s':''} possible${legers.length>1?'s':''}`:''}</p>
        </div>
      </div>
      <div class="lib-body">
        ${st.ia?.forts?.length?`
        <div class="audit-block"><div class="lib-gtitle">${I('check',13)} Ce qui fonctionne</div>
          ${st.ia.forts.map(f=>`<p class="audit-plus">${I('check',12)} ${esc(f)}</p>`).join('')}
        </div>`:''}
        ${graves.length?`<div class="audit-block"><div class="lib-gtitle" style="color:var(--danger)">${I('shield',13)} À corriger en priorité</div>${graves.map(missRow).join('')}</div>`:''}
        ${st.ia?.ameliorations?.length?`
        <div class="audit-block"><div class="lib-gtitle">${I('sparkles',13)} Regard de l'IA sur vos textes</div>
          ${st.ia.ameliorations.map(a=>`<button class="audit-row ia" onclick="gotoSection('${esc(a.section)}')">
            <span class="ar-dot"></span>
            <span class="ar-txt"><strong>${esc(a.titre)}</strong><span>${esc(a.conseil)}</span></span>
            <span class="ar-sec">${esc(AUDIT_SECTIONS[a.section]||'')} ${I('right',12)}</span></button>`).join('')}
        </div>`:''}
        ${legers.length?`<div class="audit-block"><div class="lib-gtitle">${I('plus',13)} Pour aller plus loin</div>${legers.map(missRow).join('')}</div>`:''}
        ${st.loading?`<div class="audit-block"><p class="ai-note" style="display:flex;align-items:center;gap:9px"><span class="spin">${I('loader',14)}</span> L'IA relit vos textes en détail…</p></div>`:''}
        ${st.err?`<p class="err" style="margin-top:12px">${esc(st.err)}</p>`:''}
        ${(!S.settings.apiKey)?`<p class="ai-note" style="margin-top:14px">Ajoutez votre clé API dans les réglages pour que l'IA relise aussi la qualité de vos textes, pas seulement les champs manquants.</p>`:''}
      </div>
      <div class="modal-foot" style="border-top:1px solid var(--line-faint);padding-top:16px">
        <button class="btn btn-dark" onclick="closeModal()">Fermer</button>
      </div>
    </div>
  </div>`;
}
function gotoSection(sec){ closeModal(); route={...route, view:'edit', section:sec}; render(); scrollTop(); }

/* ---------------- Affichettes à poser dans le logement ---------------- */

      <img src="${qr}" style="width:52mm;height:52mm;display:block;margin:0 auto 9px;border:1px solid ${t.line};border-radius:10px;background:#fff;padding:7px">

          <p style="font-size:14px;font-weight:600">${esc(u.label)}</p>

      <p style="${serif};font-size:24px;color:${t.accent}">${esc(l.contacts.tel)}</p>
    </div>`:''}`);
  return '';
}
function posterAvailable(l, type){
  if(type==='wifi') return !!(l.wifi.ssid||l.wifi.mdp);
  if(type==='depart') return l.depart.checklist.some(Boolean);
  if(type==='urgences') return l.urgences.some(u=>u.label);
  return true;
}
let posterSel='essentiels';
function openPosters(){
  const l=cur();
  if(!posterAvailable(l,posterSel)) posterSel=POSTERS.find(p=>posterAvailable(l,p.id))?.id||'essentiels';
  drawPosters();
}
function drawPosters(){
  const l=cur();
  document.getElementById('modal-root').innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal wide lib-modal" style="max-width:840px">
      <div class="lib-head">
        <div><h3>Affichettes à poser dans le logement</h3>

/* Choix d'une affichette : on bascule la sélection et on remplace le seul aperçu.
   La colonne de gauche n'est pas reconstruite. */
function selectPoster(btn){
  posterSel=btn.dataset.poster;
  document.querySelectorAll('.poster-item').forEach(b=>b.classList.toggle('on', b.dataset.poster===posterSel));
  const stage=document.getElementById('poster-stage');
  if(stage) stage.innerHTML=`<div class="poster-scale">${posterHTML(cur(), posterSel, route.lang)}</div>`;
}
function printPoster(which){
  const l=cur();
  const list = which==='all' ? POSTERS.filter(p=>posterAvailable(l,p.id)).map(p=>p.id) : [which];
  const pz=document.getElementById('print-zone');
  pz.innerHTML=list.map((id,i)=>`<div class="${i<list.length-1?'pagebreak':''}" style="display:flex;justify-content:center">${posterHTML(l,id,route.lang)}</div>`).join('');
  pz.style.display='block';
  document.title=`Affichettes — ${l.nom||'Smart Guide'}`;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ pz.style.display='none'; pz.innerHTML=''; document.title='Smart Guide — Livrets d\'accueil'; },500); },90);
}

function deviceHTML(l){
  return (route.device==='phone'?'<div class="notch" style="background:'+(TEMPLATES.find(t=>t.id===l.templateId)||TEMPLATES[0]).bg+'"></div>':'')+livretHTML(l, route.guide, route.lang);

/* Aperçu : la barre d'outils et le livret sont rafraîchis séparément, sans démonter
   .preview-wrap qui porte le défilement de l'aperçu. */
function renderLivret(){
  const l=cur(); const dev=document.getElementById('livret-host');
  if(!l || !dev || route.view!=='preview'){ render(); return; }
  if(route.lang!=='fr'&&!l.translations[route.lang]) route.lang='fr';
  dev.className='device '+route.device;
  dev.innerHTML=deviceHTML(l);
  const bar=document.getElementById('pbar-host'); if(bar) bar.innerHTML=previewBarHTML(l);
  const hint=document.getElementById('share-hint');
  if(hint) hint.innerHTML=`${route.lang!=='fr'?'Version '+(LANGS.find(x=>x.id===route.lang)||{}).label+' — les exports utiliseront cette langue. ':''}Ce livret est aussi beau sur papier que sur téléphone.`;
}
function renderPreview(){
  const l=cur(); if(!l){ go('dash'); return; }
  if(route.lang!=='fr'&&!l.translations[route.lang]) route.lang='fr';
  app.innerHTML = topbar(`<button class="btn btn-ghost" onclick="go('edit')" title="Retour à l'atelier" aria-label="Retour à l'atelier">${I('back',14)} <span class="lbl">Retour à l'atelier</span></button>`) + `
  <div class="preview-bar no-print" id="pbar-host">${previewBarHTML(l)}</div>
  <div class="preview-wrap view">
    <div class="device ${route.device}" id="livret-host">${deviceHTML(l)}</div>
    <p class="share-hint" id="share-hint">${route.lang!=='fr'?'Version '+(LANGS.find(x=>x.id===route.lang)||{}).label+' — les exports utiliseront cette langue. ':''}Ce livret est aussi beau sur papier que sur téléphone.</p>
  </div>`;
}
function langMenu(ev){

    icon:l.translations[x.id]?'check':'lang',
    label:(l.translations[x.id]?'Retraduire en ':'Traduire en ')+x.label,

function exportPDF(){

}

function exportHTML(){
  const l=cur();
  const gl=guideLabelLang(route.guide, route.lang);
  const body=livretHTML(l, route.guide, route.lang);
  const doc=`<!DOCTYPE html><html lang="${route.lang}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(gl)} — ${esc(l.nom||'')}</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',-apple-system,sans-serif}.lv{min-height:100vh}section{break-inside:avoid}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>
</head><body>${body}</body></html>`;
  const blob=new Blob([doc],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const suffix=route.lang!=='fr'?' ('+route.lang.toUpperCase()+')':'';
  a.download=`${gl}${suffix} - ${(l.nom||'logement').replace(/[\/\\:*?"<>|]/g,'')}.html`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Fichier téléchargé — envoyez-le à vos voyageurs ou hébergez-le en ligne');
}

async function saveSettings(test){
  S.settings.apiKey=document.getElementById('set-key').value.trim();
  S.settings.model=document.getElementById('set-model').value;
  save();
  const st=document.getElementById('key-status');
  if(!S.settings.apiKey){ st.textContent='Clé effacée.'; return; }
  if(test){
    st.innerHTML=`<span class="spin">${I('loader',13)}</span> Test en cours…`; st.style.color='var(--muted)';
    try{ await callClaude('Réponds uniquement: OK', 10); st.textContent='✓ Clé valide — IA activée.'; st.style.color='var(--accent-dark)'; toast('Clé API validée'); }
    catch(e){ st.textContent='✗ '+e.message; st.style.color='var(--danger)'; }
  }
}
async function addLogo(file){
  if(!file||!file.type.startsWith('image/')){ toast('Choisissez un fichier image', true); return; }
  try{
    const isPng=/png|svg/.test(file.type);
    S.settings.logo=await compressImage(file, 600, 0.92, isPng);
    save(); render(); toast('Logo enregistré — visible en pied de livret');
  }catch(e){ toast('Image illisible', true); }
}
function backupData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`smart-guide-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Sauvegarde téléchargée');
}
function restoreData(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const d=JSON.parse(rd.result);
    if(!d.logements) throw new Error('format invalide');
    confirmModal('Restaurer cette sauvegarde ?','Elle remplacera les données actuelles de Smart Guide sur cet ordinateur.',()=>{ S=d; S.logements.forEach(migrateLogement); save(); render(); toast('Sauvegarde restaurée'); },'Restaurer');
  }catch(e){ toast('Fichier de sauvegarde invalide', true); } };
  rd.readAsText(file);
}

/* ---------------- Logement d'exemple ---------------- */
function artImage(w,h,c1,c2,c3){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,c1); g.addColorStop(1,c2);
  x.fillStyle=g; x.fillRect(0,0,w,h);
  x.globalAlpha=.3; x.fillStyle=c3;
  x.beginPath(); x.arc(w*.78,h*.28,h*.42,0,7); x.fill();
  x.globalAlpha=.18; x.beginPath(); x.arc(w*.2,h*.85,h*.55,0,7); x.fill();
  x.globalAlpha=.13; x.fillStyle='#FFFFFF';
  for(let i=0;i<5;i++){ x.fillRect(0, h*(.18+i*.16), w, 1.5); }
  x.globalAlpha=1;
  return c.toDataURL('image/jpeg',.85);
}

/* ---------------- PWA (version web uniquement) ---------------- */
(function pwa(){
  if(location.protocol!=='https:') return;
  try{
    const mf=document.createElement('link'); mf.rel='manifest'; mf.href='manifest.webmanifest'; document.head.appendChild(mf);
    const ai=document.createElement('link'); ai.rel='apple-touch-icon'; ai.href='apple-touch-icon.png'; document.head.appendChild(ai);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){}
})();

      if(migrationsAppliquees) save();

  if(location.hash==='#exemple'&&!S.logements.some(x=>x.nom==="L'Escale Havraise")){ createDemo(); return; }
  render();
})();
