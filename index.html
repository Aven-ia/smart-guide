/* ---------------- QR wifi ---------------- */
function wifiQR(l, size=170){
  if(window.__noQR || !window.QRCode || !l.wifi.ssid) return '';
  try{
    const holder=document.createElement('div');
    new QRCode(holder,{ text:`WIFI:T:WPA;S:${l.wifi.ssid};P:${l.wifi.mdp};;`, width:size, height:size, correctLevel:QRCode.CorrectLevel.M });
    const canvas=holder.querySelector('canvas');
    return canvas?canvas.toDataURL('image/png'):'';
  }catch(e){ return ''; }
}

/* Mélange deux couleurs hex (ratio = part de la seconde) */
function mixHex(a,b,ratio){
  const p=h=>{const s=String(h).replace('#','');const f=s.length===3?s.split('').map(c=>c+c).join(''):s;const n=parseInt(f,16);return [(n>>16)&255,(n>>8)&255,n&255];};
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  const m=(x,y)=>Math.round(x+(y-x)*ratio);
  return '#'+[m(r1,r2),m(g1,g2),m(b1,b2)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* Couleur hex → rgba (pour le voile du fond personnalisé) */
function hexA(hex, a){
  const h=String(hex).replace('#','');
  const f=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(f,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${Math.max(0,Math.min(1,a)).toFixed(3)})`;
}

/* ---------------- Livret voyageur ----------------
   Les accordéons du livret sont des <details> natifs, et non le composant JS de
   l'éditeur : le livret est aussi exporté en fichier HTML autonome, sans une
   ligne de script. <details> y reste dépliable, et le lecteur d'écran annonce
   l'état d'ouverture nativement. Pour l'impression / PDF on force `open`
   (opts.deplie), sinon le contenu replié serait absent du papier. */
/* Marque blanche assumée : le livret appartient visuellement à la conciergerie.
   Seule une mention discrète en pied rappelle l'outil. Passer à false la retire
   partout — destiné à devenir une option d'offre supérieure. */
const MENTION_SMART_GUIDE=true;

/* Jeton posé à la place du numéro de section pendant la construction des
   fragments, remplacé à l'assemblage par le rang réel dans la page. Une suite
   improbable dans un texte de gérant, et jamais rendue telle quelle. */
const JETON_NUM='@@N°@@';
const LIVRET_CSS=`<style>
.lv .lvacc{border-radius:10px;overflow:hidden}
.lv .lvacc+.lvacc{margin-top:8px}
.lv .lvacc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:12px 15px;-webkit-tap-highlight-color:transparent}
.lv .lvacc>summary::-webkit-details-marker{display:none}
.lv .lvacc>summary::marker{content:''}
.lv .lvacc-chev{flex:none;line-height:0;transition:transform .2s ease;opacity:.5}
.lv .lvacc[open]>summary .lvacc-chev{transform:rotate(180deg)}
.lv .lvacc-body{padding:0 15px 14px;display:flex;flex-direction:column;gap:8px}
@media(prefers-reduced-motion:reduce){.lv .lvacc-chev{transition:none}}
/* À l'impression, le fond de page revient au blanc : un fond saturé sur une
   page entière vide une cartouche sans rien apporter. Les pavés et les
   bordures gardent leur couleur — ce sont eux qui portent la structure. */
/* Image de fond des pavés : une seule règle, pilotée par deux variables posées
   sur .lv. Le voile est plafonné à 60 % d'image (40 % de réglage) — mesuré,
   une photo contrastée sous un voile plus faible tombe à 2,88:1, illisible. */
.lv .pave{background-image:var(--voile-bloc,none),var(--img-bloc,none);background-size:auto,cover;background-position:center,center}
@media print{ .lv:not(.garde-fond){background:#FFFFFF !important;background-image:none !important} }
/* Tout ce qui est replié s'imprime déplié.
   L'impression lancée depuis l'application force déjà \`open\` (opts.deplie),
   mais le FICHIER EXPORTÉ ne le peut pas : le même fichier se lit à l'écran,
   où les accordéons doivent rester repliés. D'où une règle purement CSS, qui
   ne touche jamais l'attribut \`open\` — l'état à l'écran ne bouge pas d'un
   pixel, seul le rendu papier change.
   Trois écritures pour trois générations de moteurs : la pseudo-classe
   ::details-content (Chrome récent), le passage en display explicite sur le
   corps (moteurs antérieurs), et overflow:visible pour que rien ne soit rogné
   par le rayon d'angle une fois le contenu déplié.
   Le chevron disparaît : sur papier il indique une action impossible. */
@media print{
  .lv .lvacc{overflow:visible !important}
  .lv .lvacc::details-content{content-visibility:visible !important;display:block !important;block-size:auto !important}
  .lv .lvacc:not([open])>.lvacc-body{display:flex !important}
  .lv .lvacc-chev{display:none !important}
}
</style>`;
function livretHTML(lRaw, guideId='complet', lang='fr', opts={}){
  const l=locView(lRaw, lang);
  const deplie=!!opts.deplie;
  const t=paletteLivret(l);
  const g=GUIDES.find(x=>x.id===guideId)||GUIDES[0];
  const X=L10N[lang]||L10N.fr;
  const has=id=>g.sections.includes(id);
  const cover=l.photos[0], gallery=l.photos.slice(1);
  const qr=has('wifi')?wifiQR(lRaw):'';
  const mono=`font-family:'IBM Plex Mono',monospace`;
  const serif=`font-family:'Fraunces',Georgia,serif`;
  /* Gabarit unique du titre : numéro (facultatif), libellé, filet, icône.
     Le numéro reste facultatif pour un futur bloc interne à une section — le
     stationnement, lui, est devenu une section et se numérote comme les autres.
     Le numéro n'est PAS calculé ici : les fragments sont construits dans l'ordre
     du code, mais assemblés dans l'ordre choisi par le gérant. Numéroter à la
     construction donnait « 01, 03, 04 … 11, 02 » dès qu'une section était
     déplacée. On pose donc un jeton, remplacé à l'assemblage. */
  const filetTitre=(icon,label,numero)=>`

  /* ---- Couverture (3 styles) ---- */
  const coverLabel=guideLabelLang(g.id, lang);
  /* Le kicker nomme le document. Sur le livret complet il n'apprend rien — le

  const kicker=g.id==='complet' ? ''
    : `<p style="${mono};font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:${t.accent};margin-bottom:10px">${esc(coverLabel)}</p>`;
  const titleH=`<h1 style="${serif};font-size:34px;font-weight:500;line-height:1.1;margin-bottom:7px">${esc(l.nom||'Votre logement')}</h1>`;
  /* Adresse complète, cliquable vers l'application de cartes du téléphone.

  const adresseTxt=adresseComplete(l);
  const adresseP=adresseTxt?`<p style="margin-bottom:10px"><a href="${mapsUrl(adresseTxt)}" target="_blank" rel="noopener noreferrer"

  /* Étage : texte libre (« RDC », « 3ème gauche »…), juste sous l'adresse.

  const hLogo=hauteurLogo(l);

  const ligneIdentite=(libelle,valeur)=>`<p style="display:flex;align-items:baseline;gap:7px;font-size:13px;opacity:.72;margin-bottom:8px">

  const bandeauLogo = logoP
    ? `<div style="max-width:600px;margin:0 auto;padding:20px 26px 0">${logoP}</div>`

    } else {
      frag.cover=bandeauLogo+`<div style="max-width:600px;margin:0 auto;padding:${logoP?'10px':'18px'} 26px 6px">
        <div class="pave" style="background:${t.paper};color:${t.inkSurBloc};border:1px solid ${t.line};border-radius:16px;overflow:hidden">
          ${cover?`<img src="${cover.dataUrl}" style="width:100%;height:${HAUTEUR_PHOTO.photo};object-fit:cover;display:block">`

  /* ---- Mot de bienvenue ----

  /* Le libellé « Bienvenue » au-dessus du message a disparu : il coûtait 20 px
     à l'endroit exact où ils manquent, et il annonçait un mot d'accueil que le

  if(has('bienvenue') && String(l.bienvenue||'').trim()){

  /* Le stationnement est une section à part entière : il se déplace comme les

  if(has('stationnement')&&String(l.arrivee.parking||'').trim()) frag.stationnement=`<section>${secTitle('parking',X.parking)}
    <div class="pave" style="background:${t.paper};color:${t.inkSurBloc};border:1px solid ${t.line};border-radius:9px;padding:13px 15px">

  if(has('wifi')&&(l.wifi.ssid||l.wifi.mdp)) frag.wifi=`<section>${secTitle('wifi',X.wifi)}
    <div style="display:flex;gap:12px;align-items:stretch;flex-wrap:wrap">
      <div style="flex:1;min-width:200px;display:grid;grid-template-columns:1fr;gap:10px">
        ${block(X.reseau, l.wifi.ssid)}
        ${block(X.mdp, l.wifi.mdp)}
      </div>
      ${qr?`<div class="pave" style="background:${t.paper};color:${t.inkSurBloc};border:1px solid ${t.line};border-radius:9px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">

      </div>`:''}

  </section>`;

  /* Un accordéon par catégorie. Une catégorie sans aucun équipement retenu

  if(has('equipements')&&l.equipements.some(e=>e.nom)){
    const grp=grouperParCat(l.equipements.filter(e=>e.nom), EQUIP_CATS, equipCatConnue);
    frag.equipements=`<section>${secTitle('sofa',X.equip)}

      ${grp.map(c=>lvacc(c.icon, catL10N(c.id,lang), String(c.entrees.length),

     l'information, il n'est plus répété sur chaque ligne. */
  if(has('quartier')&&l.recos.some(r=>r.nom)){
    const ligneReco=r=>`
      <div style="display:flex;gap:13px">
        <div style="flex:1;min-width:0">
          <p style="font-size:14px;font-weight:600">${esc(r.nom)}</p>
          ${r.desc?`<p style="font-size:13px;opacity:.72;line-height:1.6;margin-top:1px">${esc(r.desc)}</p>`:''}
          ${r.mapsUrl?`<a href="${esc(r.mapsUrl)}" target="_blank" rel="noopener" style="font-size:12px;color:${t.accent};text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-weight:500"><span style="line-height:0">${I('pin',11)}</span>${X.itineraire}</a>`:''}
        </div>
      </div>`;
    frag.quartier=`<section>${secTitle('compass',X.quartier)}
    <div>
      ${grouperParCat(l.recos.filter(r=>r.nom), CATS, recoCatConnue).map(c=>
        lvacc(c.icon, catL10N(c.label,lang), String(c.entrees.length),
              c.entrees.map(({item:r})=>ligneReco(r)).join(''))).join('')}
    </div>
  </section>`;
  }

  /* Les liens doivent survivre à l'export : ce sont de vraies balises <a>, sans
     script. Le domaine est aussi imprimé en clair — sur papier, un lien ne se
     clique pas, et le voyageur doit pouvoir le recopier. */
  if(has('services')&&(l.services||[]).some(s=>s.titre)) frag.services=`<section>${secTitle('bag',X.services)}
    <div style="display:flex;flex-direction:column;gap:9px">
      ${(l.services||[]).filter(s=>s.titre).map(s=>{
        const lien=urlPropre(s.url);
        return `<div style="display:flex;gap:13px;background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:13px 15px">
        ${s.image?`<img src="${s.image}" alt="" style="width:62px;height:62px;flex:none;border-radius:9px;object-fit:cover;border:1px solid ${t.line}">`:''}
        <div style="flex:1;min-width:0">
          <p style="font-size:14px;font-weight:600">${esc(s.titre)}</p>
          ${s.desc?`<p style="font-size:13px;opacity:.72;line-height:1.6;margin-top:1px">${esc(s.desc)}</p>`:''}
          ${lien?`<a href="${esc(lien)}" target="_blank" rel="noopener noreferrer"
              style="font-size:12.5px;color:${t.accentLien};font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-weight:550">
              <span style="line-height:0">${I('share',11)}</span>${esc(domaineLisible(lien))}</a>`:''}
        </div>
      </div>`;}).join('')}
    </div>
  </section>`;

  if(has('galerie')&&gallery.length) frag.galerie=`<section>${secTitle('image',X.images)}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px">
      ${gallery.map(p=>`<img src="${p.dataUrl}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;border:1px solid ${t.line}">`).join('')}
    </div>
  </section>`;

  /* L'heure de départ vit dans « Horaires ». On ne la répète ici QUE si cette
     section est absente du guide — c'est le cas du « Guide de départ », qui est
     remis seul au voyageur et perdrait sinon son information principale. */
  if(has('depart')&&l.depart.checklist.some(Boolean)) frag.depart=`<section>${secTitle('logout',X.avantpartir)}
    ${(!has('arrivee') && l.depart.heure)?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">${block(X.avant, l.depart.heure)}</div>`:''}
    <div class="pave" style="background:${t.paper};color:${t.inkSurBloc};border:1px solid ${t.line};border-radius:9px;padding:15px 17px">
      <p style="${mono};font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:10px">${X.checklist}</p>
      ${l.depart.checklist.filter(Boolean).map(c=>`
      <p style="font-size:13.5px;display:flex;gap:10px;align-items:baseline;line-height:1.5;padding:5px 0">
        <span style="display:inline-block;width:14px;height:14px;border:1.5px solid ${t.accent};border-radius:4px;flex:none;transform:translateY(2px)"></span>${esc(c)}</p>`).join('')}
    </div>
  </section>`;

  /* FAQ : un accordéon par question — c'est la forme naturelle d'une FAQ. */
  if(has('faq')&&l.faq.some(f=>f.q)) frag.faq=`<section>${secTitle('book',X.faq)}
    <div>
      ${l.faq.filter(f=>f.q).map(f=>lvacc('book', f.q, '',
        f.r?`<p style="font-size:13px;opacity:.78;line-height:1.65">${esc(f.r)}</p>`
           :`<p style="font-size:13px;opacity:.5;line-height:1.65">—</p>`)).join('')}
    </div>
  </section>`;

  if(has('urgences')&&l.urgences.some(u=>u.label)){
    const grp=grouperParCat(l.urgences.filter(u=>u.label), URG_CATS, urgCatConnue);
    const ligneUrg=u=>`
      <div style="display:flex;align-items:center;gap:12px;background:${t.paper};border:1px solid ${t.line};border-radius:9px;padding:12px 15px">
        <div style="flex:1;min-width:0">
          <p style="font-size:13.5px;font-weight:600">${esc(u.label)}</p>
          ${u.note?`<p style="font-size:12.5px;opacity:.7;line-height:1.55;margin-top:1px">${esc(u.note)}</p>`:''}
        </div>
        ${u.valeur?`<span style="${serif};font-size:18px;color:${t.accent};white-space:nowrap;font-weight:500">${esc(u.valeur)}</span>`:''}
      </div>`;
    frag.urgences=`<section>${secTitle('shield',X.urgences)}
    <div style="display:flex;flex-direction:column;gap:9px">
      ${grp.map(c=>{
        const corps=c.entrees.map(({item:u})=>ligneUrg(u)).join('');
        /* Les numéros d'urgence ne sont JAMAIS repliables : un voyageur avec une
           fuite d'eau à 23h ne doit pas avoir à cliquer pour trouver un numéro.
           C'est le seul endroit du produit où l'uniformité serait une faute. */
        if(c.id===URG_NUMEROS) return `<div>
          <p style="${mono};font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:8px;display:flex;align-items:center;gap:7px">
            <span style="line-height:0;color:${t.accent}">${I(c.icon,13)}</span>${esc(catL10N(c.id,lang))}</p>
          <div style="display:flex;flex-direction:column;gap:8px">${corps}</div>
        </div>`;
        /* Les autres groupes sont dépliés par défaut, mais repliables. */
        return lvacc(c.icon, catL10N(c.id,lang), String(c.entrees.length), corps, true);
      }).join('')}
    </div>
  </section>`;
  }

  const ct=l.contacts;
  if(has('contacts')&&(ct.hote||ct.tel||ct.email||ct.urgence)) frag.contacts=`<section>${secTitle('phone',X.contact)}
    <div style="background:${t.accentSoft};color:${t.inkSurSoft};border-radius:12px;padding:17px 19px;display:flex;flex-direction:column;gap:7px">
      ${ct.hote?`<p style="${serif};font-size:16px;font-weight:500">${esc(ct.hote)}</p>`:''}
      ${ct.tel?`<p style="display:flex;align-items:center;gap:8px;font-size:13.5px"><span style="line-height:0;color:${t.accent}">${I('phone',13)}</span>${esc(ct.tel)}</p>`:''}
      ${ct.email?`<p style="display:flex;align-items:center;gap:8px;font-size:13.5px"><span style="line-height:0;color:${t.accent}">${I('mail',13)}</span>${esc(ct.email)}</p>`:''}
      ${ct.urgence?`<p style="font-size:12.5px;opacity:.72;padding-top:3px">${X.urgence} : ${esc(ct.urgence)}</p>`:''}
    </div>
  </section>`;

  /* Assemblage : les blocs fixes d'abord, puis les sections dans l'ordre
     choisi pour CE livret. Aucune section n'est nommee ici — ajouter une
     section au registre suffit a la rendre ordonnable. */
  if(opts.fragments) return frag;
  /* Les numéros sont attribués ICI, dans l'ordre où les sections sont réellement
     posées sur la page — jamais dans l'ordre où le code les a construites. */
  let secNum=0;
  const numeroter = html => html.split(JETON_NUM).join('') === html
    ? html : html.replace(JETON_NUM, String(++secNum).padStart(2,'0'));
  for(const s of SECTIONS_LIVRET) if(s.fixe && frag[s.id]) out+=numeroter(frag[s.id]);
  out+=`<div style="max-width:600px;margin:0 auto;padding:30px 26px 0;display:flex;flex-direction:column;gap:36px">`;
  for(const id of ordreSections(l)) if(frag[id]) out+=numeroter(frag[id]);

  out+=`</div><div style="display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:42px">
    <span style="width:34px;height:1px;background:${t.line}"></span>
    ${(S.settings.logo && !logoP)
      ? `<img src="${S.settings.logo}" style="max-height:38px;max-width:150px;object-fit:contain;opacity:.9">`
      : logoSVG(20,t.accent)}
    <p style="${mono};font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.42">${esc(S.settings.conciergerie||'Smart Guide')}</p>
    ${MENTION_SMART_GUIDE?`<p style="${mono};font-size:7.5px;letter-spacing:.1em;opacity:.28;margin-top:2px">Créé avec Smart Guide</p>`:''}
  </div></div>`;
  return out;
}
/* ---------------- Audit IA du livret ---------------- */
const AUDIT_SECTIONS = { infos:'Le logement', arrivee:'Arrivée', depart:'Départ', wifi:'Wifi', equipements:'Équipements',
  reglement:'Règlement', quartier:'Dans le quartier', urgences:'Urgences & FAQ', contacts:'Contacts', services:'Nos services', photos:'Photos', style:'Habillage' };

/* Contrôles déterministes, sans IA — toujours disponibles */
function auditLocal(l){
  const miss=[];
  const add=(sec,titre,pourquoi,grave)=>miss.push({section:sec,titre,pourquoi,grave});
  if(!l.nom) add('infos','Le logement n\'a pas de nom','Il apparaît en couverture du livret.',true);
  if(!l.ville) add('infos','Ville non renseignée','Nécessaire pour la recherche des adresses du quartier.',false);
  if(!l.adresse) add('infos','Adresse non renseignée','Sans elle, impossible de proposer les commerces et transports alentour.',false);
  if(!l.accroche&&!l.bienvenue) add('infos','Aucun mot de bienvenue','C\'est la première impression du voyageur.',false);
  if(!l.arrivee.codeAcces&&!l.arrivee.instructions) add('arrivee','Aucune instruction d\'accès','C\'est la première cause d\'appel le jour de l\'arrivée.',true);
  if(!l.arrivee.parking) add('arrivee','Stationnement non précisé','Question posée par presque tous les voyageurs en voiture.',false);
  if(!l.wifi.ssid) add('wifi','Wifi non renseigné','Deuxième cause d\'appel après l\'accès.',true);
  if(!l.depart.checklist.some(Boolean)) add('depart','Check-list de départ vide','Sans elle, le ménage part souvent d\'un logement mal rendu.',true);
  if(!l.equipements.some(e=>e.nom)) add('equipements','Aucun équipement documenté','La bibliothèque permet d\'en ajouter en quelques clics.',false);
  if(!l.contacts.tel) add('contacts','Aucun téléphone de contact','Indispensable en cas de problème.',true);
  if(!l.contacts.urgence) add('contacts','Pas de contact hors horaires','Rassure fortement le voyageur.',false);
  if(!l.urgences.some(u=>u.label)) add('urgences','Aucun numéro d\'urgence','La bibliothèque contient les numéros officiels.',false);
  if(!l.faq.some(f=>f.q)) add('urgences','Aucune question fréquente','La FAQ réduit nettement les messages reçus.',false);
  if(!l.photos.length) add('photos','Aucune photo','La couverture reste vide et le livret paraît impersonnel.',true);
  else if(l.photos.length<3) add('photos','Peu de photos','Trois à six photos donnent un livret bien plus vivant.',false);
  if(!l.recos.length) add('quartier','Aucune adresse dans le quartier','C\'est la section la plus appréciée des voyageurs.',false);
  return miss;
}
function auditScore(l, miss){
  const graves=miss.filter(m=>m.grave).length, legers=miss.length-graves;
  return Math.max(0, Math.min(100, 100 - graves*11 - legers*4));
}
async function runAudit(){
  const l=cur();
  const miss=auditLocal(l);
  const score=auditScore(l,miss);
  drawAudit(l, {score, miss, ia:null, loading:!!S.settings.apiKey});
  if(!S.settings.apiKey) return;
  try{
    const ctx=JSON.stringify({
      nom:l.nom, ville:l.ville, accroche:l.accroche, bienvenue:l.bienvenue,
      arrivee:l.arrivee, depart:l.depart, wifi:{configure:!!l.wifi.ssid},
      equipements:l.equipements.map(e=>({nom:e.nom,instructions:e.instructions})),
      reglement:l.reglement.filter(Boolean), quartier:l.recos.map(r=>({nom:r.nom,desc:r.desc})),
      urgences:l.urgences.map(u=>u.label), faq:l.faq.map(f=>f.q),
      contacts:{hote:!!l.contacts.hote, tel:!!l.contacts.tel, urgence:!!l.contacts.urgence},
      nbPhotos:l.photos.length,
    });
    const raw=await callClaude(
`Tu es un voyageur exigeant qui arrive ce soir dans ce logement et ne peut joindre personne. Voici le livret d'accueil qu'on t'a remis :
${ctx}

Relis-le avec ce regard et identifie ce qui te bloquerait ou t'agacerait réellement. Concentre-toi sur les formulations ambiguës, les informations contradictoires, les étapes manquantes dans les instructions, le ton maladroit — pas sur les champs simplement vides.

Réponds UNIQUEMENT en JSON strict :
{"verdict":"une phrase de synthèse honnête, 20 mots max",
 "forts":["2 à 3 points réellement réussis"],
 "ameliorations":[{"section":"infos|arrivee|depart|wifi|equipements|reglement|quartier|urgences|contacts|photos","titre":"court","conseil":"une phrase actionnable"}]}
Maximum 5 améliorations, les plus utiles d'abord.`, 1500);
    const ia=parseJSONLoose(raw);
    l.audit={date:Date.now(), score}; touch(l);
    drawAudit(l, {score, miss, ia, loading:false});
  }catch(e){
    drawAudit(l, {score, miss, ia:null, loading:false, err:e.message==='NO_KEY'?'':('IA indisponible : '+e.message)});
  }
}
function drawAudit(l, st){
  const ring=(pc)=>{ const r=34,c=2*Math.PI*r; const col=pc>=80?'#66795A':pc>=55?'#B98D3F':'#B0523B';
    return `<div style="position:relative;width:84px;height:84px;flex:none">
      <svg width="84" height="84" viewBox="0 0 84 84" style="transform:rotate(-90deg)">
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="#E6E1D4" stroke-width="7"/>
        <circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pc/100)}" style="transition:stroke-dashoffset .9s var(--ease)"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span style="font-family:var(--serif);font-size:24px;line-height:1;color:${col}">${pc}</span>
        <span style="font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;color:var(--muted)">/ 100</span>
      </div></div>`; };
  const verdictTxt = st.score>=85?'Livret prêt à être envoyé.' : st.score>=65?'Bon livret, quelques manques à combler.' : st.score>=40?'Les bases sont là, il reste du travail.' : 'Livret encore incomplet.';
  const graves=st.miss.filter(m=>m.grave), legers=st.miss.filter(m=>!m.grave);
  const missRow=m=>`<button class="audit-row ${m.grave?'grave':''}" onclick="gotoSection('${m.section}')">
      <span class="ar-dot"></span>
      <span class="ar-txt"><strong>${esc(m.titre)}</strong><span>${esc(m.pourquoi)}</span></span>
      <span class="ar-sec">${esc(AUDIT_SECTIONS[m.section]||'')} ${I('right',12)}</span>
    </button>`;
  document.getElementById('modal-root').innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal wide lib-modal" style="max-width:660px">
      <div class="lib-head">
        <div><h3>Audit du livret</h3><p class="sub" style="margin:0">Ce qu'un voyageur trouverait — ou ne trouverait pas.</p></div>
        <button class="icon-x" onclick="closeModal()">${I('x',18)}</button>
      </div>
      <div class="audit-hero">
        ${ring(st.score)}
        <div>
          <p class="audit-verdict">${st.ia?.verdict?esc(st.ia.verdict):verdictTxt}</p>
          <p class="ai-note">${graves.length?`${graves.length} point${graves.length>1?'s':''} bloquant${graves.length>1?'s':''}`:'Aucun point bloquant'}${legers.length?` · ${legers.length} amélioration${legers.length>1?'s':''} possible${legers.length>1?'s':''}`:''}</p>
        </div>
      </div>
      <div class="lib-body">
        ${st.ia?.forts?.length?`
        <div class="audit-block"><div class="lib-gtitle">${I('check',13)} Ce qui fonctionne</div>
          ${st.ia.forts.map(f=>`<p class="audit-plus">${I('check',12)} ${esc(f)}</p>`).join('')}
        </div>`:''}
        ${graves.length?`<div class="audit-block"><div class="lib-gtitle" style="color:var(--danger)">${I('shield',13)} À corriger en priorité</div>${graves.map(missRow).join('')}</div>`:''}
        ${st.ia?.ameliorations?.length?`
        <div class="audit-block"><div class="lib-gtitle">${I('sparkles',13)} Regard de l'IA sur vos textes</div>
          ${st.ia.ameliorations.map(a=>`<button class="audit-row ia" onclick="gotoSection('${esc(a.section)}')">
            <span class="ar-dot"></span>
            <span class="ar-txt"><strong>${esc(a.titre)}</strong><span>${esc(a.conseil)}</span></span>
            <span class="ar-sec">${esc(AUDIT_SECTIONS[a.section]||'')} ${I('right',12)}</span></button>`).join('')}
        </div>`:''}
        ${legers.length?`<div class="audit-block"><div class="lib-gtitle">${I('plus',13)} Pour aller plus loin</div>${legers.map(missRow).join('')}</div>`:''}
        ${st.loading?`<div class="audit-block"><p class="ai-note" style="display:flex;align-items:center;gap:9px"><span class="spin">${I('loader',14)}</span> L'IA relit vos textes en détail…</p></div>`:''}
        ${st.err?`<p class="err" style="margin-top:12px">${esc(st.err)}</p>`:''}
        ${(!S.settings.apiKey)?`<p class="ai-note" style="margin-top:14px">Ajoutez votre clé API dans les réglages pour que l'IA relise aussi la qualité de vos textes, pas seulement les champs manquants.</p>`:''}
      </div>
      <div class="modal-foot" style="border-top:1px solid var(--line-faint);padding-top:16px">
        <button class="btn btn-dark" onclick="closeModal()">Fermer</button>
      </div>
    </div>
  </div>`;
}
function gotoSection(sec){ closeModal(); route={...route, view:'edit', section:sec}; render(); scrollTop(); }

function posterAvailable(l, type){

/* Choix d'une affichette : on bascule la sélection et on remplace le seul aperçu.
   La colonne de gauche n'est pas reconstruite. */
function selectPoster(btn){
  posterSel=btn.dataset.poster;
  document.querySelectorAll('.poster-item').forEach(b=>b.classList.toggle('on', b.dataset.poster===posterSel));
  const stage=document.getElementById('poster-stage');
  if(stage) stage.innerHTML=`<div class="poster-scale">${posterHTML(cur(), posterSel, route.lang)}</div>`;
}
function printPoster(which){
  const l=cur();
  const list = which==='all' ? POSTERS.filter(p=>posterAvailable(l,p.id)).map(p=>p.id) : [which];
  const pz=document.getElementById('print-zone');
  pz.innerHTML=list.map((id,i)=>`<div class="${i<list.length-1?'pagebreak':''}" style="display:flex;justify-content:center">${posterHTML(l,id,route.lang)}</div>`).join('');
  pz.style.display='block';
  document.title=`Affichettes — ${l.nom||'Smart Guide'}`;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ pz.style.display='none'; pz.innerHTML=''; document.title='Smart Guide — Livrets d\'accueil'; },500); },90);
}

function deviceHTML(l){
  return (route.device==='phone'?'<div class="notch" style="background:'+(TEMPLATES.find(t=>t.id===l.templateId)||TEMPLATES[0]).bg+'"></div>':'')+livretHTML(l, route.guide, route.lang);

/* Aperçu : la barre d'outils et le livret sont rafraîchis séparément, sans démonter
   .preview-wrap qui porte le défilement de l'aperçu. */
function renderLivret(){
  const l=cur(); const dev=document.getElementById('livret-host');
  if(!l || !dev || route.view!=='preview'){ render(); return; }
  if(route.lang!=='fr'&&!l.translations[route.lang]) route.lang='fr';
  dev.className='device '+route.device;
  dev.innerHTML=deviceHTML(l);
  const bar=document.getElementById('pbar-host'); if(bar) bar.innerHTML=previewBarHTML(l);
  const hint=document.getElementById('share-hint');
  if(hint) hint.innerHTML=texteAidePartage();
}
/* Lève le malentendu : le gérant a partagé le SIGNET de son navigateur, donc
   l'adresse de l'application — chez le destinataire elle s'ouvre vide, puisque
   les livrets vivent sur l'appareil de chacun. */
function texteAidePartage(){
  const lang=route.lang!=='fr'?`Version ${(LANGS.find(x=>x.id===route.lang)||{}).label} — les exports utiliseront cette langue. `:'';
  return `${lang}<strong>« Partager » envoie le livret lui-même</strong>, en un fichier qui s'ouvre
    sans internet et sans Smart Guide. Ne transmettez pas l'adresse de l'application :
    votre voyageur y trouverait sa propre page, vide.`;
}
function renderPreview(){
  const l=cur(); if(!l){ go('dash'); return; }
  if(route.lang!=='fr'&&!l.translations[route.lang]) route.lang='fr';
  app.innerHTML = topbar(`<button class="btn btn-ghost" onclick="go('edit')" title="Retour à l'atelier" aria-label="Retour à l'atelier">${I('back',14)} <span class="lbl">Retour à l'atelier</span></button>`) + `
  <div class="preview-bar no-print" id="pbar-host">${previewBarHTML(l)}</div>
  <div class="preview-wrap view">
    <div class="device ${route.device}" id="livret-host">${deviceHTML(l)}</div>
    <p class="share-hint" id="share-hint">${texteAidePartage()}</p>
  </div>`;
}
function langMenu(ev){
  const l=cur();
  openCtxMenu(ev, LANGS.filter(x=>x.id!=='fr').map(x=>({
    icon:l.translations[x.id]?'check':'lang',
    label:(l.translations[x.id]?'Retraduire en ':'Traduire en ')+x.label,
    fn:()=>translateLivret(x.id),
  })));
}

/* Deux sorties, une seule mécanique d'impression.
   Le navigateur ne dit pas si l'utilisateur va choisir une imprimante ou
   « Enregistrer en PDF » — mais NOUS savons ce qu'il a demandé, et c'est la
   seule information qui compte. Le PDF part par WhatsApp et se lit à l'écran :
   il garde le fond de la marque. Le papier le perd — mesuré, un fond coloré
   fait passer la couverture d'encre de 2,2 % à 15,3 % sur quatre pages. */
function exportPDF(){
  confirmModal('Pour l\'écran ou pour le papier ?',
    'Le PDF envoyé au voyageur garde le fond coloré du livret. L\'impression le met en blanc : un fond plein consomme sept fois plus d\'encre et ne sert à rien sur papier.',
    ()=>lancerImpression(true), 'Pour envoyer');
  const pied=document.querySelector('.modal-foot');
  if(pied){
    const b=document.createElement('button');
    b.className='btn btn-plain'; b.textContent='Pour imprimer';
    b.onclick=()=>{ closeModal(); lancerImpression(false); };
    pied.insertBefore(b, pied.lastElementChild);
  }
}
function lancerImpression(fondColore){
  const l=cur();
  const pz=document.getElementById('print-zone');
  // Sur papier, tout doit être visible : un accordéon replié serait du contenu perdu.
  pz.innerHTML=livretHTML(l, route.guide, route.lang, {deplie:true, fondColore});
  pz.style.display='block';
  const gl=guideLabelLang(route.guide, route.lang);
  document.title=`${gl} — ${l.nom||'Smart Guide'}`;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ pz.style.display='none'; pz.innerHTML=''; document.title='Smart Guide — Livrets d\'accueil'; },500); },90);
}

/* Le livret autonome : un fichier HTML complet, photos comprises, qui s'ouvre
   sans internet et sans Smart Guide. C'est CE fichier qu'on donne au voyageur. */
function documentLivretAutonome(l){
  const gl=guideLabelLang(route.guide, route.lang);
  const body=livretHTML(l, route.guide, route.lang);
  return `<!DOCTYPE html><html lang="${route.lang}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(gl)} — ${esc(l.nom||'')}</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',-apple-system,sans-serif}.lv{min-height:100vh}section{break-inside:avoid}
/* Le fond était porté par .lv seul, qui s'arrête au contenu : sur un fond
   foncé, une bande claire restait en bas de page. html et body le portent
   aussi — uniquement ici, pour ne pas repeindre l'éditeur. */
html,body{background:${paletteLivret(l).bg}}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#FFFFFF !important}}</style>
</head><body>${body}</body></html>`;
}
function nomFichierLivret(l){
  const gl=guideLabelLang(route.guide, route.lang);
  const suffix=route.lang!=='fr'?' ('+route.lang.toUpperCase()+')':'';
  return `${gl}${suffix} - ${(l.nom||'logement').replace(/[\/\\:*?"<>|]/g,'')}.html`;
}
function telechargerFichier(doc, nom){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));
  a.download=nom; a.click(); URL.revokeObjectURL(a.href);
}
function exportHTML(){
  const l=cur();
  telechargerFichier(documentLivretAutonome(l), nomFichierLivret(l));
  toast('Fichier téléchargé — envoyez-le à vos voyageurs');
}
/* Partage du livret lui-même. Sur téléphone et tablette, la feuille de partage
   du système reçoit le FICHIER : le voyageur reçoit son livret, pas un lien vers
   l'application. Partout ailleurs, repli sur le téléchargement. */
async function partagerLivret(){
  const l=cur(); if(!l) return;
  const nom=nomFichierLivret(l);
  const doc=documentLivretAutonome(l);
  const gl=guideLabelLang(route.guide, route.lang);
  try{
    const fichier=new File([doc], nom, {type:'text/html'});
    if(navigator.canShare && navigator.canShare({files:[fichier]})){
      await navigator.share({ files:[fichier], title:`${gl} — ${l.nom||''}`,
        text:`Voici votre livret d'accueil pour ${l.nom||'votre séjour'}.` });
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;      // partage annulé par le gérant
  }
  telechargerFichier(doc, nom);
  toast('Le livret a été téléchargé — envoyez ce fichier par mail ou WhatsApp');
}

      <p class="ai-note">Pensez à une sauvegarde régulière : vos livrets n'existent nulle part ailleurs que sur ce Mac. La sauvegarde permet aussi de transférer vos livrets vers un autre ordinateur.</p>
    `)}

}
async function saveSettings(test){
  S.settings.apiKey=document.getElementById('set-key').value.trim();
  S.settings.model=document.getElementById('set-model').value;
  save();
  const st=document.getElementById('key-status');
  if(!S.settings.apiKey){ st.textContent='Clé effacée.'; return; }
  if(test){
    st.innerHTML=`<span class="spin">${I('loader',13)}</span> Test en cours…`; st.style.color='var(--muted)';
    try{ await callClaude('Réponds uniquement: OK', 10); st.textContent='✓ Clé valide — IA activée.'; st.style.color='var(--accent-dark)'; toast('Clé API validée'); }
    catch(e){ st.textContent='✗ '+e.message; st.style.color='var(--danger)'; }
  }
}
async function addLogo(file){
  if(!file||!file.type.startsWith('image/')){ toast('Choisissez un fichier image', true); return; }
  try{
    const isPng=/png|svg/.test(file.type);
    S.settings.logo=await compressImage(file, 600, 0.92, isPng);
    save(); render(); toast('Logo enregistré — visible en pied de livret');
  }catch(e){ toast('Image illisible', true); }
}
function backupData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`smart-guide-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  S.settings.derniereExport=Date.now(); save();
  toast('Sauvegarde téléchargée — conservez ce fichier');
}
function restoreData(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const d=JSON.parse(rd.result);
    if(!d.logements) throw new Error('format invalide');
    confirmModal('Restaurer cette sauvegarde ?','Elle remplacera les données actuelles de Smart Guide sur cet ordinateur.',()=>{ S=d; S.logements.forEach(migrateLogement); save(); render(); toast('Sauvegarde restaurée'); },'Restaurer');
  }catch(e){ toast('Fichier de sauvegarde invalide', true); } };
  rd.readAsText(file);
}

/* ---------------- Logement d'exemple ---------------- */
function artImage(w,h,c1,c2,c3){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,c1); g.addColorStop(1,c2);
  x.fillStyle=g; x.fillRect(0,0,w,h);
  x.globalAlpha=.3; x.fillStyle=c3;
  x.beginPath(); x.arc(w*.78,h*.28,h*.42,0,7); x.fill();
  x.globalAlpha=.18; x.beginPath(); x.arc(w*.2,h*.85,h*.55,0,7); x.fill();
  x.globalAlpha=.13; x.fillStyle='#FFFFFF';
  for(let i=0;i<5;i++){ x.fillRect(0, h*(.18+i*.16), w, 1.5); }
  x.globalAlpha=1;
  return c.toDataURL('image/jpeg',.85);
}

/* ---------------- PWA (version web uniquement) ---------------- */
(function pwa(){
  if(location.protocol!=='https:') return;
  try{
    const mf=document.createElement('link'); mf.rel='manifest'; mf.href='manifest.webmanifest'; document.head.appendChild(mf);
    const ai=document.createElement('link'); ai.rel='apple-touch-icon'; ai.href='apple-touch-icon.png'; document.head.appendChild(ai);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){}
})();

/* ---------------- Démarrage ---------------- */
(async function init(){
  demanderStockagePersistant();   // exempte l'app de la purge automatique de Safari
  initAuth();                     // aucune donnée n'est lue ni envoyée à ce stade

  let saved=null, secours=null;
  try{
    saved=await dbGet(CLE_PRINCIPALE);
    chargementOK=true;            // la lecture a abouti, avec ou sans données
  }catch(e){
    console.warn('Lecture IndexedDB impossible', e);
    chargementOK=false;
  }
  if(chargementOK){ try{ secours=await dbGet(CLE_SECOURS); }catch(e){} }

  if(chargementOK && saved && saved.logements){
    try{
      S=saved;
      S.settings=Object.assign({apiKey:'',model:'claude-haiku-4-5',conciergerie:'',derniereExport:0,derniereSynchro:0,rappelReporte:0},S.settings);
      S.logements.forEach(migrateLogement);
      // Les catégories devinées à la lecture sont réécrites une bonne fois en base.
      if(migrationsAppliquees) save();
    }catch(e){
      // Une donnée inattendue ne doit jamais faire repartir l'app à vide :
      // on garde ce qui a été lu et on interdit l'écriture.
      console.error('Migration interrompue', e);
      chargementOK=false;
    }
  }
  if(!chargementOK) bloquerEcriture();

  if(location.hash==='#exemple'&&!S.logements.some(x=>x.nom==="L'Escale Havraise")){ createDemo(); return; }
  render();
  // Le rappel de sauvegarde attend de savoir si le gérant est connecté :
  // son message n'est pas le même, et l'annoncer à tort serait faux.
  chargerSession().then(()=>{
    majBoutonCompte();
    if(chargementOK && S.logements.length) verifierRappelExport();
  });
  surveillerVersion();                      // prévient quand un nouveau build est publié
  if(!chargementOK) return;

  /* Récupération : la clé principale est vide alors que la copie de secours
     contient des livrets — on ne restaure jamais en douce, on propose. */
  if(!S.logements.length && secours && secours.etat && (secours.etat.logements||[]).length){
    proposerRecuperation(secours);
  } else if(S.logements.length){
    // On fige l'état sain de ce démarrage, AVANT toute modification de la session.
    ecrireSecours(S);
  }
})();
