<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smart Guide — Livrets d'accueil</title>
<meta name="theme-color" content="#F5F2EB">
<meta name="description" content="Créez des livrets d'accueil premium et multilingues pour vos locations — remplissage par IA, QR wifi, recommandations de quartier, exports PDF.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smart Guide">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;450;500;600;650&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="window.__noQR=true"></script>
<style>
/* =====================================================
   SMART GUIDE V2 — Système visuel
   ===================================================== */
:root{
  --bg:#F5F2EB; --bg-deep:#EFEBE1; --paper:#FFFFFF; --paper-warm:#FDFCF9;
  --ink:#22251E; --ink-soft:#484C3F; --ink-faint:#6E7263;
  --accent:#66795A; --accent-dark:#525F3F; --accent-deep:#3E4A31;
  --accent-soft:#E5EADC; --accent-mist:#F0F3E9;
  --line:#E6E1D4; --line-soft:#DBD5C5; --line-faint:#EEEAE0;
  --muted:#8D897C; --muted-2:#ABA698;
  --danger:#B0523B; --danger-soft:#F8EAE5;
  --gold:#B98D3F;
  --serif:'Fraunces',Georgia,serif; --mono:'IBM Plex Mono',monospace; --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --sh-xs:0 1px 2px rgba(34,37,30,.05);
  --sh-sm:0 1px 2px rgba(34,37,30,.04),0 3px 10px rgba(34,37,30,.05);
  --sh-md:0 2px 4px rgba(34,37,30,.04),0 8px 24px rgba(34,37,30,.07);
  --sh-lg:0 4px 10px rgba(34,37,30,.06),0 24px 60px rgba(34,37,30,.13);
  --sh-glow:0 0 0 3.5px rgba(102,121,90,.15);
  --ease:cubic-bezier(.22,.9,.35,1);
  /* Hauteur de la barre du haut : sert d'ancrage aux éléments collants. */
  --tb:59px;
  /* Encoche et barre d'accueil iOS en mode app installée (viewport-fit=cover). */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{
  font-family:var(--sans);color:var(--ink);font-size:14.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    radial-gradient(1200px 500px at 85% -8%, rgba(102,121,90,.075), transparent 60%),
    radial-gradient(900px 480px at -10% 4%, rgba(185,141,63,.055), transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14.5px;color:var(--ink)}
::placeholder{color:#B8B3A4}
::selection{background:rgba(102,121,90,.22)}
h1,h2,h3{font-weight:500}
a{color:var(--accent-dark)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}

/* ---------- Structure ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.view{animation:viewIn .38s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:calc(13px + var(--safe-t)) calc(26px + var(--safe-r)) 13px calc(26px + var(--safe-l));
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:80;
  background:rgba(245,242,235,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.brand:hover .brand-name{color:var(--accent-dark)}
.brand-name{font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1;transition:color .2s}
.brand-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--muted);margin-top:3.5px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.savebadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:var(--muted);padding:5px 10px;border-radius:99px;border:1px solid transparent;transition:all .3s}
.savebadge.saving{color:var(--gold)}
.savebadge.saved{color:var(--accent-dark)}
.savebadge .pulse{width:6px;height:6px;border-radius:99px;background:currentColor}
.savebadge.saving .pulse{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:550;
  padding:8.5px 15px;border-radius:9px;transition:all .16s var(--ease);white-space:nowrap;letter-spacing:.005em}
.btn:active{transform:scale(.97)}
.btn svg{flex:none}
.btn-dark{background:var(--ink);color:#F5F2EB;box-shadow:var(--sh-xs), inset 0 1px 0 rgba(255,255,255,.07)}
.btn-dark:hover{background:#343830;box-shadow:var(--sh-sm)}
.btn-accent{background:linear-gradient(180deg,#70845F,var(--accent-dark));color:#fff;box-shadow:var(--sh-xs), inset 0 1px 0 rgba(255,255,255,.14)}
.btn-accent:hover{background:linear-gradient(180deg,#78906B,var(--accent-dark));box-shadow:var(--sh-sm)}
.btn-ghost{color:var(--accent-dark);border:1px solid #C6CFB8;background:rgba(255,255,255,.5)}
.btn-ghost:hover{background:var(--accent-mist);border-color:#AFBC9D}
.btn-plain{color:var(--ink-soft)}
.btn-plain:hover{background:var(--bg-deep)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn-lg{padding:12px 22px;font-size:14px;border-radius:11px}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px}
.icon-x{color:var(--muted-2);padding:6px;border-radius:7px;line-height:0;transition:all .14s}
.icon-x:hover{color:var(--danger);background:var(--danger-soft)}

/* ---------- Dashboard ---------- */
.dash{max-width:1080px;width:100%;margin:0 auto;padding:46px 30px 90px}
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:20px;flex-wrap:wrap}
.dash-title{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.1;letter-spacing:-.01em}
.dash-sub{color:var(--ink-faint);margin-top:8px;font-size:14px;max-width:540px;line-height:1.55}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.kicker::before{content:'';display:block;width:22px;height:1px;background:var(--accent)}
.statrow{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 26px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px 18px;min-width:130px;box-shadow:var(--sh-xs)}
.stat .n{font-family:var(--serif);font-size:23px;font-weight:500;line-height:1.1}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:11px;
  padding:9px 14px;max-width:330px;box-shadow:var(--sh-xs);transition:all .18s;margin-bottom:22px}
.searchbar:focus-within{border-color:var(--accent);box-shadow:var(--sh-glow)}
.searchbar input{border:none;outline:none;background:none;flex:1;font-size:13.5px}
.searchbar svg{color:var(--muted-2)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:20px}
.prop-card{background:var(--paper);border:1px solid var(--line);border-radius:17px;overflow:hidden;cursor:pointer;
  transition:all .22s var(--ease);box-shadow:var(--sh-sm);text-align:left;display:flex;flex-direction:column;position:relative}
.prop-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:#CBD3BD}
.prop-cover{height:158px;background:linear-gradient(150deg,var(--accent-mist),var(--accent-soft));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.prop-cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.prop-card:hover .prop-cover img{transform:scale(1.045)}
.prop-chip{position:absolute;top:11px;left:11px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  background:rgba(28,30,24,.78);backdrop-filter:blur(6px);color:#F2EFE7;padding:4.5px 9px;border-radius:6px;text-transform:uppercase}
.prop-menu-btn{position:absolute;top:9px;right:9px;width:29px;height:29px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.88);backdrop-filter:blur(6px);color:var(--ink-soft);opacity:0;transition:all .18s;box-shadow:var(--sh-xs)}
.prop-card:hover .prop-menu-btn{opacity:1}
.prop-menu-btn:hover{background:#fff;color:var(--ink)}
.prop-body{padding:17px 19px 18px;flex:1;display:flex;flex-direction:column}
.prop-name{font-family:var(--serif);font-size:19px;margin-bottom:4px;line-height:1.2}
.prop-city{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
.prop-foot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;gap:10px}
.prop-date{font-size:11.5px;color:var(--muted-2)}
.pbar{height:4px;border-radius:99px;background:var(--line-faint);overflow:hidden;flex:1;max-width:90px}
.pbar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#8CA07A);transition:width .5s var(--ease)}
.pct{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.new-card{border:1.5px dashed var(--line-soft);border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:11px;min-height:255px;color:var(--muted);cursor:pointer;transition:all .2s;background:rgba(255,255,255,.35)}
.new-card:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-mist);transform:translateY(-2px)}
.new-card .plus-ring{width:44px;height:44px;border-radius:99px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;transition:all .2s}
.new-card:hover .plus-ring{background:var(--accent);border-color:var(--accent);color:#fff}

/* Empty hero */
.empty-hero{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:64px 44px;text-align:center;box-shadow:var(--sh-md);position:relative;overflow:hidden}
.empty-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 220px at 50% -60px, rgba(102,121,90,.09), transparent)}
.empty-hero>*{position:relative}
.empty-hero h2{font-family:var(--serif);font-size:27px;margin:18px 0 10px;font-weight:500}
.empty-hero p{color:var(--ink-faint);max-width:470px;margin:0 auto 26px;line-height:1.6}
.empty-steps{display:flex;justify-content:center;gap:26px;margin:26px 0 30px;flex-wrap:wrap}
.estep{display:flex;flex-direction:column;align-items:center;gap:8px;width:130px}
.estep .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-mist);color:var(--accent-dark);display:flex;align-items:center;justify-content:center}
.estep p{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.4}
.estep .num{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--muted-2)}

/* Menu contextuel */
.ctx-menu{position:fixed;z-index:300;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);
  padding:5px;min-width:180px;animation:menuIn .16s var(--ease)}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-3px)}to{opacity:1;transform:none}}
.ctx-menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-size:13px;padding:8.5px 11px;border-radius:8px;color:var(--ink-soft)}
.ctx-menu button:hover{background:var(--bg-deep);color:var(--ink)}
.ctx-menu button.danger{color:var(--danger)}
.ctx-menu button.danger:hover{background:var(--danger-soft)}
.ctx-sep{height:1px;background:var(--line-faint);margin:4px 8px}

/* ---------- Éditeur ---------- */
.editor{display:flex;flex:1;min-height:0}
.sidebar{width:242px;flex:none;border-right:1px solid var(--line);padding:20px 13px 26px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:calc(var(--tb) + var(--safe-t));height:calc(100vh - var(--tb) - var(--safe-t));overflow-y:auto;background:rgba(245,242,235,.6)}
.side-progress{display:flex;align-items:center;gap:11px;padding:4px 11px 16px}
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pcttxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8.5px;color:var(--accent-dark)}
.side-progress .t1{font-size:12.5px;font-weight:550;line-height:1.25}
.side-progress .t2{font-size:11px;color:var(--muted)}
.side-item{display:flex;align-items:center;gap:10px;width:100%;padding:8.5px 11px;border-radius:9px;font-size:13.5px;color:var(--ink-soft);transition:all .14s;text-align:left;position:relative}
.side-item:hover{background:var(--bg-deep)}
.side-item.active{background:var(--ink);color:#F2EFE7;box-shadow:var(--sh-xs)}
.side-num{font-family:var(--mono);font-size:9.5px;width:16px;opacity:.45;flex:none}
.side-item.active .side-num{opacity:.65}
.side-item svg{flex:none;opacity:.85}
.side-item .dot{margin-left:auto;width:6px;height:6px;border-radius:99px;background:var(--accent);flex:none;transition:all .2s}
.side-item.active .dot{background:#A9BC96}
.editor-main{flex:1;min-width:0;padding:32px 40px 100px;display:flex;justify-content:center}
.editor-inner{width:100%;max-width:680px}

/* ---------- Cartes & champs ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);overflow:hidden}
.card+.card{margin-top:18px}
.card-head{display:flex;align-items:baseline;gap:13px;padding:22px 25px 4px}
.card-num{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted-2)}
.card-title{font-family:var(--serif);font-size:20.5px;font-weight:500}
.card-sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.card-body{padding:19px 25px 24px;display:flex;flex-direction:column;gap:17px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8271;margin-bottom:7px}
.field .hint{font-family:var(--sans);font-size:12px;color:var(--muted-2);text-transform:none;letter-spacing:0;display:block;margin-top:2.5px;font-weight:400}
.input,.textarea,select.input{width:100%;background:var(--paper-warm);border:1px solid var(--line-soft);border-radius:9px;padding:10px 13px;transition:all .16s}
.input:hover,.textarea:hover{border-color:#CCC6B4}
.input:focus,.textarea:focus,select.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--sh-glow);background:#fff}
.textarea{resize:vertical;min-height:76px;line-height:1.6}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.subcard{border:1px solid var(--line);background:var(--paper-warm);border-radius:11px;padding:13px;display:flex;flex-direction:column;gap:10px;transition:border-color .18s}
.subcard:hover{border-color:var(--line-soft)}
.inline-row{display:flex;align-items:center;gap:9px}
.cat-select{width:158px;flex:none}
.nav-btns{display:flex;justify-content:space-between;margin-top:20px}
.ai-note{font-size:12.5px;color:var(--muted);line-height:1.5}
.err{font-size:12.5px;color:var(--danger)}
.ai-box{background:linear-gradient(180deg,var(--accent-mist),#F7F8F2);border:1px solid #DCE3D0;border-radius:11px;padding:13px 15px}
.ai-box .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pill-group{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:500;padding:7px 14px;border-radius:99px;border:1px solid var(--line-soft);background:var(--paper-warm);color:var(--ink-soft);transition:all .15s}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#F2EFE7;box-shadow:var(--sh-xs)}

/* ---------- Import magique ---------- */
.magic{border:1px solid #D3DCC5;border-radius:16px;padding:22px 25px;margin-bottom:20px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#EEF2E5 0%,#F9FAF5 55%,#F4EFE3 100%);box-shadow:var(--sh-sm)}
.magic::after{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:99px;
  background:radial-gradient(circle,rgba(102,121,90,.13),transparent 65%)}
.magic h3{font-family:var(--serif);font-size:18.5px;display:flex;align-items:center;gap:10px;font-weight:500}
.magic h3 .wico{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#E9EDDF;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-xs)}
.magic p{font-size:13px;color:var(--ink-soft);margin:9px 0 13px;line-height:1.55;max-width:520px}
.magic .textarea{background:rgba(255,255,255,.85)}

/* ---------- Bibliothèque d'équipements ---------- */
.lib-open{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid #D3DCC5;border-radius:13px;padding:15px 17px;
  background:linear-gradient(160deg,#EEF2E5,#FBFCF8);transition:all .17s var(--ease);box-shadow:var(--sh-xs)}
.lib-open:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--sh-sm)}
.lib-ico{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#E9EDDF;display:flex;align-items:center;justify-content:center;flex:none}
.lib-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.lib-txt strong{font-size:14.5px;font-weight:600}
.lib-txt span{font-size:12.5px;color:var(--ink-faint)}
.lib-arrow{width:30px;height:30px;border-radius:99px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.lib-modal{display:flex;flex-direction:column;max-height:86vh}
.lib-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.lib-body{flex:1;overflow-y:auto;margin:12px -6px 0;padding:0 6px}
.lib-group+.lib-group{margin-top:18px}
.lib-gtitle{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:10px}
.lib-items{display:flex;flex-wrap:wrap;gap:8px}
.lib-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:99px;
  border:1px solid var(--line-soft);background:var(--paper);color:var(--ink-soft);transition:all .14s}
.lib-chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.lib-chip.on{background:var(--ink);border-color:var(--ink);color:#F2EFE7;box-shadow:var(--sh-xs)}
.lib-chip.used{opacity:.42;cursor:default;background:var(--accent-mist);border-color:#CFD9C2;color:var(--accent-dark)}
.lib-chip.used:hover{border-color:#CFD9C2}

/* ---------- Accordéons (rythme repris de CollapsibleSection — Smart Host) ---------- */
.acc{border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden;transition:box-shadow .18s var(--ease)}
.acc:hover{box-shadow:var(--sh-xs)}
.acc+.acc{margin-top:9px}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:13px 15px;text-align:left;transition:background .16s}
.acc-head:hover{background:var(--bg-deep)}
.acc-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.acc-ico{width:36px;height:36px;flex:none;border-radius:11px;background:var(--accent-mist);color:var(--accent-dark);display:flex;align-items:center;justify-content:center}
.acc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-title{font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-sub{font-size:12px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-badge{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);background:var(--bg-deep);
  border:1px solid var(--line-faint);border-radius:99px;padding:3px 9px;white-space:nowrap}
.acc-chev{flex:none;color:var(--muted-2);line-height:0;transition:transform .2s var(--ease)}
.acc[data-open="true"] .acc-chev{transform:rotate(180deg)}
.acc-panel{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .25s var(--ease),opacity .25s var(--ease)}
.acc[data-open="true"] .acc-panel{grid-template-rows:1fr;opacity:1}
.acc-inner{overflow:hidden;min-height:0}
.acc-body{padding:3px 15px 15px;border-top:1px solid var(--line-faint)}
@media(prefers-reduced-motion:reduce){ .acc-panel,.acc-chev,.acc{transition:none} }

/* ---------- Photos ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.photo-item{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--bg-deep)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item .tag{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;background:rgba(28,30,24,.82);backdrop-filter:blur(4px);color:#F2EFE7;padding:3.5px 8px;border-radius:5px}
.photo-item .ovl{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,22,17,.45),transparent 40%,transparent 62%,rgba(20,22,17,.5));opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:space-between;padding:7px}
.photo-item:hover .ovl{opacity:1}
.photo-item .ovl-top{display:flex;justify-content:flex-end}
.photo-item .ovl-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:5px}
.pbtn{background:rgba(255,255,255,.93);color:var(--ink-soft);border-radius:7px;padding:5px;line-height:0;transition:all .13s;box-shadow:var(--sh-xs)}
.pbtn:hover{background:#fff;color:var(--ink)}
.pbtn.danger:hover{color:var(--danger)}
.pbtn.txt{font-size:10.5px;padding:5px 9px;line-height:1.2;font-weight:550}
.drop{border:1.5px dashed var(--line-soft);border-radius:13px;padding:32px;text-align:center;color:var(--muted);cursor:pointer;transition:all .18s;font-size:13.5px;background:rgba(255,255,255,.4)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-mist);color:var(--accent-dark)}
.drop .dico{width:42px;height:42px;border-radius:12px;background:var(--accent-mist);color:var(--accent-dark);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;transition:all .18s}
.drop:hover .dico{background:var(--accent);color:#fff}

/* ---------- Audit ---------- */
.audit-hero{display:flex;align-items:center;gap:20px;margin:18px 0 4px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:14px}
.audit-verdict{font-family:var(--serif);font-size:17.5px;line-height:1.3;margin-bottom:4px}
.audit-block{margin-top:18px}
.audit-plus{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--ink-soft);padding:5px 2px;line-height:1.5}
.audit-plus svg{color:var(--accent);flex:none;margin-top:2px}
.audit-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin-bottom:7px;transition:all .15s}
.audit-row:hover{border-color:var(--accent);transform:translateX(2px)}
.audit-row .ar-dot{width:7px;height:7px;border-radius:99px;background:var(--muted-2);flex:none}
.audit-row.grave .ar-dot{background:var(--danger)}
.audit-row.ia .ar-dot{background:var(--gold)}
.audit-row .ar-txt{flex:1;min-width:0}
.audit-row .ar-txt strong{display:block;font-size:13.5px;font-weight:600}
.audit-row .ar-txt span{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:1px}
.audit-row .ar-sec{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted-2);flex:none;white-space:nowrap}

/* ---------- Affichettes ---------- */
.poster-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:16px;flex:1;min-height:0}
.poster-list{display:flex;flex-direction:column;gap:8px}
.poster-item{display:flex;align-items:center;gap:11px;text-align:left;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;transition:all .15s;background:var(--paper)}
.poster-item:hover{border-color:#C6CFB8}
.poster-item.on{border-color:var(--accent);background:var(--accent-mist);box-shadow:var(--sh-glow)}
.poster-item.off{opacity:.42;cursor:default}
.poster-item .pi-ico{width:32px;height:32px;border-radius:9px;background:var(--accent-mist);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;flex:none}
.poster-item.on .pi-ico{background:var(--accent);color:#fff}
.poster-item strong{display:block;font-size:13.5px;font-weight:600}
.poster-item span span{font-size:11.5px;color:var(--muted);line-height:1.35;display:block;margin-top:1px}
.poster-stage{background:var(--bg-deep);border-radius:14px;padding:18px;display:flex;align-items:flex-start;justify-content:center;overflow:auto;max-height:52vh}
.poster-scale{transform:scale(.62);transform-origin:top center}
.poster{box-shadow:var(--sh-lg);border-radius:3px}
.logo-panel{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-prev{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px 18px;display:flex;align-items:center;justify-content:center;min-width:150px;min-height:70px}
.logo-prev img{max-height:46px;max-width:170px;object-fit:contain;display:block}
.color-pick{width:52px;height:38px;padding:2px;border:1px solid var(--line-soft);border-radius:9px;background:var(--paper);cursor:pointer}

/* ---------- Fond personnalisé ---------- */
.wp-panel{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.wp-prev{flex:1;min-width:170px;min-height:118px;border-radius:11px;border:1px solid var(--line);background-size:cover;background-position:center;position:relative;overflow:hidden}
.wp-veil{position:absolute;inset:0;transition:opacity .18s}
.wp-ctrl{flex:1;min-width:200px;display:flex;flex-direction:column;justify-content:center}
.wp-range{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:var(--line);outline:none}
.wp-range::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:99px;background:var(--accent);border:3px solid #fff;box-shadow:var(--sh-sm);cursor:pointer}
.wp-range::-moz-range-thumb{width:15px;height:15px;border-radius:99px;background:var(--accent);border:3px solid #fff;cursor:pointer}
.ck-box{width:22px;height:22px;border-radius:6px;border:1.5px solid #C6CFB8;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;background:var(--accent-mist)}

/* ---------- Habillage ---------- */
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tpl-card{text-align:left;border-radius:14px;border:2px solid var(--line);padding:0;transition:all .18s var(--ease);cursor:pointer;overflow:hidden;position:relative}
.tpl-card:hover{border-color:#C0C9B0;transform:translateY(-2px);box-shadow:var(--sh-md)}
.tpl-card.sel{border-color:var(--accent);box-shadow:var(--sh-glow)}
.tpl-mini{padding:16px 16px 13px}
.tpl-mini .mini-cover{border-radius:8px;height:56px;margin-bottom:10px;display:flex;align-items:flex-end;padding:9px 11px;position:relative;overflow:hidden}
.tpl-mini .mini-title{font-family:var(--serif);font-size:12px;font-weight:500}
.tpl-meta{padding:0 16px 14px;display:flex;align-items:center;justify-content:space-between}
.tpl-name{font-family:var(--serif);font-size:15.5px;font-weight:500}
.tpl-desc{font-size:11.5px;opacity:.6;margin-top:1px}
.tpl-sel-badge{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:99px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-xs);animation:menuIn .2s}
.cover-styles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.cs-card{border:2px solid var(--line);border-radius:11px;padding:11px;cursor:pointer;transition:all .16s;text-align:center;background:var(--paper-warm)}
.cs-card:hover{border-color:#C0C9B0}
.cs-card.sel{border-color:var(--accent);box-shadow:var(--sh-glow)}
.cs-card .cs-pre{height:52px;border-radius:6px;background:var(--bg-deep);margin-bottom:8px;position:relative;overflow:hidden}
.cs-card p{font-size:11.5px;font-weight:550;color:var(--ink-soft)}

/* ---------- Quartier ---------- */
.osm-res{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding-right:4px}
.osm-row{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10.5px 13px;transition:border-color .15s;animation:viewIn .3s var(--ease)}
.osm-row:hover{border-color:var(--line-soft)}
.osm-row .nm{font-size:13.5px;font-weight:550}
.osm-row .ds{font-size:12px;color:var(--muted);margin-top:1px}
.osm-row .add{margin-left:auto;flex:none}
.osm-ico{width:32px;height:32px;border-radius:10px;background:var(--accent-mist);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;flex:none}
.skel{height:52px;border-radius:10px;background:linear-gradient(90deg,var(--line-faint) 25%,#F6F3EC 50%,var(--line-faint) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- Modales ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,32,26,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(3px);animation:ovIn .22s}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg);border-radius:19px;box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:30px;animation:modIn .28s var(--ease)}
@keyframes modIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal h3{font-family:var(--serif);font-size:22px;margin-bottom:7px;font-weight:500}
.modal .sub{color:var(--ink-faint);font-size:13.5px;margin-bottom:18px;line-height:1.55}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

/* ---------- Aperçu ---------- */
.preview-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 26px;border-bottom:1px solid var(--line);
  background:rgba(245,242,235,.86);backdrop-filter:blur(14px);position:sticky;top:calc(var(--tb) + var(--safe-t));z-index:70;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg-deep);border-radius:10px;padding:3px;gap:2px}
.seg button{font-size:12.5px;padding:6.5px 13px;border-radius:8px;color:var(--ink-soft);font-weight:500;transition:all .16s;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-xs)}
.preview-wrap{flex:1;overflow-y:auto;background:
  radial-gradient(800px 400px at 70% -5%, rgba(102,121,90,.08), transparent 60%), var(--bg-deep);padding-bottom:80px}
.device{margin:36px auto 30px;border-radius:20px;overflow:hidden;box-shadow:var(--sh-lg);transition:max-width .35s var(--ease);border:1px solid rgba(34,37,30,.09)}
.device.paper{max-width:680px}
.device.phone{max-width:400px;border-radius:38px;border:9px solid #23251E;box-shadow:0 30px 80px rgba(20,22,17,.3)}
.device.phone .notch{height:24px;background:inherit;display:flex;justify-content:center;align-items:center}
.share-hint{max-width:680px;margin:0 auto;text-align:center;font-size:12.5px;color:var(--muted)}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{background:var(--ink);color:#F2EFE7;font-size:13.5px;padding:12px 19px;border-radius:12px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:10px;animation:toastIn .3s var(--ease);max-width:90vw}
.toast .tico{color:#A9BC96;line-height:0;flex:none}
.toast.error{background:#7E3A28}.toast.error .tico{color:#F0B9A8}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.spin{animation:spin 1s linear infinite;display:inline-flex;line-height:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Réglages ---------- */
.settings{max-width:660px;margin:0 auto;padding:46px 30px 90px;display:flex;flex-direction:column;gap:0}

/* Noms de guides : version longue par défaut, version courte sur téléphone. */
.guide-court{display:none}

/* ---------- Tablette : la sidebar garde ses libellés, seules les grilles se resserrent ---------- */
@media(max-width:880px){
  .sidebar{width:196px;padding:18px 10px 26px}
  .side-item{padding:8px 9px;font-size:13px;gap:8px}
  .editor-main{padding:26px 20px 90px}
  .row-2,.tpl-grid{grid-template-columns:1fr}
  .photo-grid,.cover-styles{grid-template-columns:repeat(2,1fr)}
  .dash{padding:34px 22px 80px}
}

/* ---------- Téléphone ----------
   La sidebar verticale devient une barre d'onglets horizontale défilable :
   sur 375px une colonne d'icônes muettes ne dit pas au gérant où il se trouve.
   Les libellés des boutons cèdent la place aux icônes seules, titrées. */
@media(max-width:700px){
  :root{ --tb:56px }

  .topbar{padding:calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));gap:8px;min-height:calc(56px + var(--safe-t))}
  .brand-name,.brand-sub{display:none}
  .savebadge{padding:6px;gap:0}
  .savebadge .txt{display:none}
  .topbar-actions{gap:5px}
  .topbar-actions .btn{padding:9px 10px}
  .btn .lbl{display:none}

  .editor{flex-direction:column}
  .sidebar{width:100%;height:auto;flex-direction:row;align-items:center;gap:6px;
    padding:8px calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
    border-right:none;border-bottom:1px solid var(--line);
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    background:rgba(245,242,235,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .sidebar::-webkit-scrollbar{display:none}
  .side-progress{display:none}
  .side-num{display:none}
  .side-item{flex:none;width:auto;padding:0 14px;min-height:38px;border-radius:99px;gap:7px;font-size:12.5px;white-space:nowrap}
  .side-item .dot{margin-left:1px;width:5px;height:5px}
  .editor-main{padding:20px 14px calc(80px + var(--safe-b))}

  .preview-bar{padding:9px calc(12px + var(--safe-r)) 9px calc(12px + var(--safe-l));gap:8px}
  .preview-bar>div{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .preview-bar>div::-webkit-scrollbar{display:none}
  /* Cibles tactiles : 44px de haut minimum, recommandation Apple comme Google. */
  .preview-bar .btn{padding:0 13px;min-height:44px}
  .seg button{padding:0 11px;min-height:38px;font-size:12px}
  .topbar-actions .btn{padding:0 11px;min-height:44px}
  .guide-long{display:none}
  .guide-court{display:inline}

  .dash{padding:26px calc(16px + var(--safe-l)) calc(70px + var(--safe-b))}
  .preview-wrap{padding-bottom:calc(60px + var(--safe-b))}
  .modal{padding:22px 18px}
  .lib-modal{max-height:90vh}

  /* Zone de tap confortable au pouce : l'en-tête reste à ~56px de haut. */
  .acc-head{gap:10px;padding:12px 12px}
  .acc-ico{width:32px;height:32px;border-radius:10px}
  .acc-body{padding:3px 12px 13px}

  /* Sur 375px, un sélecteur et une zone de texte côte à côte s'écrasent
     mutuellement : les lignes de saisie passent en colonne. */
  .inline-row{flex-wrap:wrap}
  .cat-select{width:100%}
  .subcard .inline-row>.input:not(.cat-select){min-width:0;flex:1 1 140px}
  .subcard .textarea{flex:1 1 100%}
}

/* ---------- Impression ---------- */
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #print-zone,#print-zone *{visibility:visible}
  #print-zone{position:absolute;inset:0;width:100%;display:block!important}
  #print-zone .lv{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-zone section{break-inside:avoid}
  #print-zone .pagebreak{break-after:page}
  .no-print{display:none!important}
}
@page{margin:14mm 0}
</style>
</head>

<div id="ctx-root"></div>

<input type="file" id="photo-input" accept="image/*" multiple style="display:none">
<script>

   SMART GUIDE V2 — Livrets d'accueil & guides pour conciergeries

    image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 19 5.5-5.5 3 3L17 13l4 4"/>',

    loader:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',

  if(d<3600000) return `il y a ${Math.floor(d/60000)} min`;
  if(d<86400000) return `il y a ${Math.floor(d/3600000)} h`;
  const j=Math.floor(d/86400000);

};

/* Adresse postale d'un logement, assemblée à partir des morceaux réellement saisis.
   Tout est facultatif : on ne produit jamais de virgule orpheline ni d'espace parasite,
   y compris pour un livret enregistré avant l'ajout de ces champs. */
function adresseComplete(l){
  const rue=String(l.adresse||'').trim();
  const cp=String(l.codePostal||'').trim();
  const ville=String(l.ville||'').trim();
  const localite=[cp, ville].filter(Boolean).join(' ');   // « 75011 Paris », « Paris », « 75011 »
  return [rue, localite].filter(Boolean).join(', ');      // « 12 rue Machin, 75011 Paris »
}
/* Le code postal français fait 5 chiffres, mais l'international ne doit jamais être
   bloqué : on se contente de signaler un format inhabituel, la saisie est conservée. */
const cpInhabituel = v => { const s=String(v||'').trim(); return !!s && !/^\d{5}$/.test(s); };
function hintCP(v){
  const el=document.getElementById('cp-hint');
  if(el) el.textContent = cpInhabituel(v) ? 'Format inhabituel — 5 chiffres en France. La saisie est conservée telle quelle.' : '';
}
/* Lien de cartes universel : ouvre l'app Plans/Maps sur iOS comme sur Android,
   et retombe sur le navigateur ailleurs. */
function mapsUrl(adresse){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(adresse)}`;
}

const DB_NAME='smart-guide', DB_STORE='state';
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });}
async function dbGet(k){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction(DB_STORE).objectStore(DB_STORE).get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); });}
async function dbSet(k,v){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).put(v,k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); });}

  arrivee:{ heure:'16:00', codeAcces:'', instructions:'', parking:'' },

let migrationsAppliquees=0;
function migrateLogement(l){
  const d=defaultLogement();
  for(const k of Object.keys(d)) if(l[k]===undefined) l[k]=d[k];
  // v3 : la catégorie devient une donnée portée par l'élément. On la devine ici
  // UNE SEULE FOIS depuis le nom, puis elle est persistée — un renommage
  // ultérieur ne peut donc plus rendre l'élément orphelin.
  if(Array.isArray(l.equipements)) l.equipements.forEach(e=>{
    const c=e.cat?equipCatConnue(e.cat):equipCatDuNom(e.nom);
    if(e.cat!==c){ e.cat=c; migrationsAppliquees++; }
  });
  if(Array.isArray(l.urgences)) l.urgences.forEach(u=>{
    const c=u.cat?urgCatConnue(u.cat):urgCatDuLabel(u.label);
    if(u.cat!==c){ u.cat=c; migrationsAppliquees++; }
  });
  // v2.1 : les instructions de départ faisaient doublon avec la check-list → fusion
  if(l.depart && l.depart.instructions){
    const txt=String(l.depart.instructions).trim();
    if(txt){
      const points=txt.split(/\n+|(?<=[.!?])\s+(?=[A-ZÀ-Ý])/).map(s=>s.trim().replace(/\.$/,'')).filter(s=>s.length>2);
      const exist=l.depart.checklist.map(c=>c.toLowerCase());
      points.forEach(p=>{ if(!exist.includes(p.toLowerCase())) l.depart.checklist.push(p); });
    }
    delete l.depart.instructions;
  }
  return l;
}

/* ---------------- Accordéons de l'éditeur ----------------
   Transposition de CollapsibleSection (Smart Host) : en-tête bouton accessible,
   pastille d'icône, badge compteur, chevron pivotant, panneau animé.
   Deux écarts assumés faute de framer-motion : l'ouverture passe par
   grid-template-rows 0fr→1fr, et l'état vit en mémoire plutôt qu'en localStorage
   — ce qui suffit à lui faire survivre à tous les re-rendus de la session. */
const accOuverts={};
const accEstOuvert=(cle,parDefaut=false)=> accOuverts[cle]===undefined ? parDefaut : !!accOuverts[cle];
const accSet=(cle,ouvert)=>{ accOuverts[cle]=!!ouvert; };
/* Bascule chirurgicale : on ne touche qu'aux attributs du bloc cliqué.
   Aucun nœud n'est reconstruit, donc aucun défilement ne peut bouger. */
function toggleAcc(btn){
  const acc=btn.closest('.acc'); if(!acc) return;
  const ouvert = acc.dataset.open!=='true';
  acc.dataset.open = ouvert?'true':'false';
  btn.setAttribute('aria-expanded', ouvert?'true':'false');
  accSet(acc.dataset.cle, ouvert);
}
function accordeon({cle, icon, titre, badge='', sousTitre='', corps, ouvertParDefaut=false, forceOuvert=false}){
  const ouvert = forceOuvert || accEstOuvert(cle, ouvertParDefaut);
  const pid = 'acc-'+cle.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  return `<div class="acc" data-open="${ouvert}" data-cle="${esc(cle)}">
    <button type="button" class="acc-head" aria-expanded="${ouvert}" aria-controls="${pid}" onclick="toggleAcc(this)">
      <span class="acc-ico">${I(icon,17)}</span>
      <span class="acc-txt"><span class="acc-title">${esc(titre)}</span>${sousTitre?`<span class="acc-sub">${esc(sousTitre)}</span>`:''}</span>
      ${badge?`<span class="acc-badge">${esc(badge)}</span>`:''}
      <span class="acc-chev">${I('chevron',18)}</span>
    </button>
    <div class="acc-panel" id="${pid}" role="region" aria-label="${esc(titre)}">
      <div class="acc-inner"><div class="acc-body">${corps}</div></div>
    </div>
  </div>`;
}

/* ---------- Helpers fiches ---------- */
function card(num,title,sub,body){

const F = (path,label,val,ph='',hint='') => `
  <div class="field"><label>${label}${hint?`<span class="hint">${hint}</span>`:''}</label>
  <input class="input" value="${esc(val)}" placeholder="${esc(ph)}" oninput="setPath('${path}',this.value)"></div>`;
const FT = (path,label,val,ph='',rows=3,hint='') => `
  <div class="field"><label>${label}${hint?`<span class="hint">${hint}</span>`:''}</label>
  <textarea class="textarea" rows="${rows}" placeholder="${esc(ph)}" oninput="setPath('${path}',this.value)">${esc(val)}</textarea></div>`;
const aiPolishBtn = (section,label='Améliorer la rédaction') =>

function setPath(path,val){
  const l=cur(); if(!l) return;
  const parts=path.split('.'); let o=l;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  o[parts[parts.length-1]]=val; touch(l);
  if(path==='adresse'||path==='ville'||path==='codePostal') l.geo=null;
  if(path!=='templateId'&&path!=='coverStyle'&&path!=='tone') l.translations={};
}
function setArr(arrPath,i,key,val){
  const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l);
  if(key===null) arr[i]=val; else arr[i][key]=val;
  l.translations={}; touch(l);
}
function rmArr(arrPath,i){ const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l); arr.splice(i,1); l.translations={}; touch(l); renderCard(); }
function moveArr(arrPath,i,dir){ const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l); const j=i+dir;
  if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; l.translations={}; touch(l); renderCard(); }

function toggleChip(btn, key){

  btn.classList.toggle('on', on);
  const ico=btn.querySelector('.chip-ico'); if(ico) ico.innerHTML=I(on?'check':'plus',12);

async function genFAQ(){
  const l=cur();
  if(!S.settings.apiKey){ needKey(); return; }
  const done=btnLoading('faq-btn','Rédaction de la FAQ…');
  try{
    const ctx=JSON.stringify({
      logement:{nom:l.nom, ville:l.ville},
      arrivee:{heure:l.arrivee.heure, code:!!l.arrivee.codeAcces, instructions:l.arrivee.instructions, parking:l.arrivee.parking},
      depart:{heure:l.depart.heure, checklist:l.depart.checklist.filter(Boolean)},
      wifi:!!l.wifi.ssid, equipements:l.equipements.map(e=>e.nom).filter(Boolean),
      reglement:l.reglement.filter(Boolean), quartier:l.recos.map(r=>r.nom).filter(Boolean),
    });
    const raw=await callClaude(
`Tu es l'assistant d'une conciergerie de location courte durée. Voici le contenu d'un livret d'accueil :\n${ctx}\n
Rédige 5 à 7 questions que les voyageurs posent réellement le plus souvent, avec leur réponse. ${toneText(l)}
Règles strictes : appuie-toi UNIQUEMENT sur les informations ci-dessus. Si une information manque (ex. animaux, fumeurs, ménage, bagages), formule une réponse générale et prudente qui invite à contacter l'hôte, sans jamais inventer d'horaire, de code, de prix ou de règle.
Réponds UNIQUEMENT en JSON strict : {"faq":[{"q":"...","r":"..."}]}`, 1800);
    const p=parseJSONLoose(raw);
    if(Array.isArray(p.faq)&&p.faq.length){
      l.faq=p.faq.filter(f=>f&&f.q).map(f=>({id:nid(), q:f.q, r:f.r||''}));
      l.translations={}; touch(l); renderCard(); toast(l.faq.length+' questions rédigées — relisez-les');
    } else { done(); toast('Aucune question générée, réessayez.', true); }
  }catch(e){ done(); toast(e.message==='NO_KEY'?'Clé API manquante':'IA : '+e.message, true); }
}

const PREFIXE_ACC={ equipements:'eq:', urgences:'urg:' };
function pushArr(arrPath,item){
  const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l); arr.push(item);
  // Ajout manuel dans une section groupée : on déplie la catégorie d'arrivée.
  if(item&&item.cat&&PREFIXE_ACC[arrPath]) accSet(PREFIXE_ACC[arrPath]+item.cat, true);

}

/* ---------- Regroupement par catégorie dans l'éditeur ----------
   On groupe sur le champ `cat` persisté, jamais sur le nom : renommer un
   équipement ne le déplace donc pas. Toute catégorie inconnue retombe sur
   « Autres », si bien qu'aucun élément ne peut disparaître de l'écran. */
function grouperParCat(liste, cats, normaliser){
  const par=new Map();
  liste.forEach((item,i)=>{
    const c=normaliser(item.cat);
    if(!par.has(c)) par.set(c,[]);
    par.get(c).push({item,i});
  });
  return cats.filter(c=>par.has(c.id)).map(c=>({...c, entrees:par.get(c.id)}));
}
/* « Monter » doit déplacer l'élément au sein de SA catégorie. Sur le tableau
   global, le bouton paraîtrait sans effet dès que le voisin appartient à un
   autre groupe. */
function moveDansCat(arrPath,i,dir,normaliser){
  const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l);
  const cat=normaliser(arr[i].cat);
  const memeCat=arr.map((x,j)=>normaliser(x.cat)===cat?j:-1).filter(j=>j>=0);
  const cible=memeCat[memeCat.indexOf(i)+dir];
  if(cible===undefined) return;
  [arr[i],arr[cible]]=[arr[cible],arr[i]];
  l.translations={}; touch(l); renderCard();
}
/* Changement de catégorie : on déplie la destination pour que le gérant voie
   où son élément est parti. */

  accSet(cle+valeur, true);

/* ---------- Photos ---------- */
function compressImage(file, MAXW, Q, keepAlpha){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=MAXW||1600; let w=img.width,h=img.height;
      if(Math.max(w,h)>MAX){ const r=MAX/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',Q||0.82));
    };
    img.onerror=rej;
    const rd=new FileReader(); rd.onload=()=>img.src=rd.result; rd.onerror=rej; rd.readAsDataURL(file);
  });
}
async function addPhotos(files){
  const l=cur(); if(!l) return;
  let n=0;
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    try{ l.photos.push({id:nid(), dataUrl:await compressImage(f), caption:''}); n++; }
    catch(e){ toast('Photo illisible : '+f.name, true); }
  }
  if(n) toast(n+' photo'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''));
  touch(l); renderCard();
}
async function addWallpaper(file){
  if(!file||!file.type.startsWith('image/')){ toast('Choisissez un fichier image', true); return; }
  const l=cur();
  try{
    l.wallpaper=await compressImage(file, 1800, 0.78);
    if(!l.wallpaperOpacity) l.wallpaperOpacity=18;
    touch(l); renderCard(); toast('Fond appliqué — ajustez l\'intensité puis vérifiez l\'aperçu');
  }catch(e){ toast('Image illisible', true); }
}
function renderAccentPreview(v){ const el=document.getElementById('accent-lbl'); if(el) el.textContent='Accent personnalisé '+v; }
function liveWallpaper(v){
  const veil=document.querySelector('.wp-veil'); if(veil) veil.style.opacity=(1-v/100);
  const lb=document.querySelector('.wp-ctrl label'); if(lb) lb.textContent='Intensité — '+v+'%';
}
function rmPhoto(i){ const l=cur(); l.photos.splice(i,1); touch(l); renderCard(); }
function makeCover(i){ const l=cur(); const p=l.photos.splice(i,1)[0]; l.photos.unshift(p); touch(l); renderCard(); }
function movePhoto(i,dir){ const l=cur(); const j=i+dir; if(j<0||j>=l.photos.length) return;
  [l.photos[i],l.photos[j]]=[l.photos[j],l.photos[i]]; touch(l); renderCard(); }

/* Sélection d'une catégorie : simple bascule de classe sur la puce cliquée.
   Rien n'est reconstruit, donc rien ne bouge. */
function toggleCat(btn){
  const id=btn.dataset.cat, on=!osmState.cats.includes(id);
  osmState.cats = on ? [...osmState.cats,id] : osmState.cats.filter(c=>c!==id);
  btn.classList.toggle('on', on);
}

async function geocode(l){
  if(l.geo) return l.geo;
  const q=encodeURIComponent([l.adresse,l.codePostal,l.ville,'France'].filter(Boolean).join(', '));
  const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`,{headers:{'Accept':'application/json'}});
  const data=await res.json();
  if(!data.length){
    const res2=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(l.ville+', France')}&format=json&limit=1`);
    const d2=await res2.json();
    if(!d2.length) throw new Error('Adresse introuvable — vérifiez la fiche 01.');
    l.geo={lat:+d2[0].lat, lon:+d2[0].lon, approx:true};
  } else l.geo={lat:+data[0].lat, lon:+data[0].lon, approx:false};
  touch(l); return l.geo;
}
const OSM_FILTERS = {
  restaurant:['["amenity"~"restaurant|fast_food"]'],
  cafe:['["amenity"~"cafe|bar|pub"]'],
  commerce:['["shop"~"supermarket|bakery|convenience|greengrocer|butcher"]'],
  transport:['["highway"="bus_stop"]','["railway"~"station|tram_stop|subway_entrance"]'],
  sante:['["amenity"~"pharmacy|doctors|hospital"]'],
  activite:['["tourism"~"attraction|museum|viewpoint"]','["leisure"~"park|beach_resort"]'],
};
function haversine(a,b,c,d){ const R=6371e3,p=Math.PI/180; const x=(c-a)*p/2,y=(d-b)*p/2;
  const h=Math.sin(x)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y)**2; return Math.round(2*R*Math.asin(Math.sqrt(h))); }
async function searchOSM(){
  const l=cur();
  if(!osmState.cats.length){ toast('Choisissez au moins une catégorie', true); return; }
  osmState.loading=true; osmState.error=''; osmState.results=[]; renderCard();
  try{
    const g=await geocode(l);
    const RAD=osmState.radius;
    const parts=osmState.cats.flatMap(c=>OSM_FILTERS[c]).map(sel=>`node(around:${RAD},${g.lat},${g.lon})${sel}`).join(';');
    const q=`[out:json][timeout:20];( ${parts}; );out tags center 90;`;
    const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)});
    if(!res.ok) throw new Error('Service cartographique saturé, réessayez dans une minute.');
    const data=await res.json();
    const seen=new Set();
    const rows=(data.elements||[]).map(e=>{
      const t=e.tags||{}; const name=t.name; if(!name||seen.has(name)) return null; seen.add(name);
      let cat='activite';
      if(/restaurant|fast_food/.test(t.amenity||'')) cat='restaurant';
      else if(/cafe|bar|pub/.test(t.amenity||'')) cat='cafe';
      else if(t.shop) cat='commerce';
      else if(t.highway==='bus_stop'||t.railway) cat='transport';
      else if(/pharmacy|doctors|hospital/.test(t.amenity||'')) cat='sante';
      const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon;
      const dist=haversine(g.lat,g.lon,lat,lon);
      let detail=t.cuisine?t.cuisine.split(';')[0].replace(/_/g,' '):(t.railway?'gare / arrêt':(t.shop||''));
      return { osmId:e.id, nom:name, cat, dist, detail,
        mapsUrl:`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}` };
    }).filter(Boolean).filter(r=>osmState.cats.includes(r.cat));
    rows.sort((a,b)=>a.dist-b.dist);
    osmState.results=rows.slice(0,30);
    if(!rows.length) osmState.error='Rien trouvé dans ce rayon. Essayez plus large ou d\'autres catégories.';
  }catch(e){ osmState.error=e.message; }
  osmState.loading=false; renderCard();
}
function osmReco(r){
  return { id:nid(), osmId:r.osmId, cat:r.cat, nom:r.nom,
    desc:`À ${r.dist<100?'moins de 2 min':'environ '+Math.max(1,Math.round(r.dist/80))+' min'} à pied${r.detail?' — '+r.detail:''}.`,
    dist:r.dist, mapsUrl:r.mapsUrl };
}

/* ---------------- IA — API Anthropic ---------------- */
async function callClaude(prompt, maxTokens=1500){
  if(!S.settings.apiKey) throw new Error('NO_KEY');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':S.settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify({ model:S.settings.model||'claude-haiku-4-5', max_tokens:maxTokens,
      messages:[{role:'user',content:prompt}] }),
  });
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    if(res.status===401) throw new Error('Clé API invalide — vérifiez-la dans les réglages.');
    if(res.status===429) throw new Error('Trop de requêtes — patientez quelques secondes.');
    throw new Error(err?.error?.message||('Erreur API ('+res.status+')'));
  }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
}
function parseJSONLoose(raw){

}

function wifiQR(l, size=170){
  if(window.__noQR || !window.QRCode || !l.wifi.ssid) return '';
  try{
    const holder=document.createElement('div');
    new QRCode(holder,{ text:`WIFI:T:WPA;S:${l.wifi.ssid};P:${l.wifi.mdp};;`, width:size, height:size, correctLevel:QRCode.CorrectLevel.M });
    const canvas=holder.querySelector('canvas');
    return canvas?canvas.toDataURL('image/png'):'';
  }catch(e){ return ''; }
}

/* Mélange deux couleurs hex (ratio = part de la seconde) */
function mixHex(a,b,ratio){
  const p=h=>{const s=String(h).replace('#','');const f=s.length===3?s.split('').map(c=>c+c).join(''):s;const n=parseInt(f,16);return [(n>>16)&255,(n>>8)&255,n&255];};
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  const m=(x,y)=>Math.round(x+(y-x)*ratio);
  return '#'+[m(r1,r2),m(g1,g2),m(b1,b2)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* Couleur hex → rgba (pour le voile du fond personnalisé) */
function hexA(hex, a){
  const h=String(hex).replace('#','');
  const f=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(f,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${Math.max(0,Math.min(1,a)).toFixed(3)})`;
}
