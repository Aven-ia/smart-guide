/* ---------------- Synchronisation (étapes 2 à 4) ----------------
   PRINCIPE DE CONCEPTION, pas une vérification ajoutée après coup :
   la synchronisation ne SUPPRIME jamais une ligne distante. Elle ajoute et elle
   met à jour, rien d'autre. Une suppression est toujours un geste explicite du
   gérant, jamais la conséquence d'un état local jugé « à jour ».
   Conséquence : un appareil dont le navigateur a purgé IndexedDB ne peut pas
   détruire la copie en ligne — il la re-télécharge. La panne ne se propage pas.

   Deux garde-fous complètent ce principe :
   • local vide + cloud garni  → on ne remonte RIEN, on descend seulement ;
   • livret local nettement plus pauvre que sa version en ligne → on s'arrête et
     on demande, après avoir mis la version en ligne à l'abri dans livret_backups. */
let syncEnCours=false, syncTimer=null, syncEtat='inactif';
const dernierSnapshot=new Map();
/* Livrets dont l'appauvrissement est VOULU et déjà confirmé à l'écran
   (restauration, ou arbitrage tranché). Le garde-fou les laisse passer sans
   reposer la question, et sans refaire une sauvegarde déjà faite. */
const restaurationsVoulues=new Set();          // livret distant → dernier instantané (ms)
const SEUIL_APPAUVRI=0.7;                 // sous 70 % du poids distant : appauvrissement
const DELAI_SNAPSHOT=10*60*1000;          // au plus un instantané toutes les 10 min par livret
const GRACE_SAISIE=6000;                  // on ne touche à rien pendant 6 s après la dernière frappe

const poidsLivret = o => { try{ return JSON.stringify(o).length; }catch(e){ return 0; } };

/* --- Détection de saisie ---------------------------------------------------
   Une donnée qu'on est en train d'écrire n'est jamais périmée. Tant que le
   gérant a le curseur dans un champ, ou qu'il vient de frapper, aucune
   modification descendante n'est appliquée : elle est REPORTÉE. */
let derniereFrappe=0;
function champEditable(el){
  return !!el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);
}
function saisieEnCours(){
  return champEditable(document.activeElement) || (Date.now()-derniereFrappe < GRACE_SAISIE);
}
document.addEventListener('input', ()=>{ derniereFrappe=Date.now(); }, true);
document.addEventListener('focusin', e=>{ if(champEditable(e.target)) derniereFrappe=Date.now(); }, true);

/* --- Référence de comparaison ----------------------------------------------
   On ne compare JAMAIS une heure serveur à une heure client. Le serveur
   horodate le moment de l'ÉCRITURE, forcément postérieur à la frappe qui l'a
   déclenchée — le distant paraîtrait donc toujours plus récent, et le contenu
   qu'on vient de pousser redescendrait en écrasant la saisie en cours.
   On mémorise à la place, pour chaque livret : l'updated_at renvoyé par le
   serveur après NOTRE écriture, et l'updatedAt local qui a été poussé. */
function metaSync(){ S.sync=S.sync||{}; return S.sync; }
function noterMeta(localId, updatedAtDistant, updatedAtLocal){
  metaSync()[localId]={ distant:updatedAtDistant||null, pousse:updatedAtLocal||0 };
}

/* --- Décision pure : ne touche à rien, donc entièrement testable isolément --- */
function planSynchro(locaux, distants, meta, voulues){
  meta=meta||{}; voulues=voulues||new Set();
  const parLocal=new Map(distants.filter(d=>d.local_id).map(d=>[d.local_id,d]));
  const idsLocaux=new Set(locaux.map(l=>l.id));
  const plan={ descendre:[], monter:[], majDistant:[], majLocal:[], appauvris:[], motifBlocage:null };

  /* Règle absolue : un appareil vide ne remonte jamais rien. */
  if(locaux.length===0 && distants.length>0){
    plan.descendre=distants.slice();
    plan.motifBlocage='local-vide';
    return plan;
  }
  for(const d of distants) if(!idsLocaux.has(d.local_id)) plan.descendre.push(d);
  for(const l of locaux){
    const d=parLocal.get(l.id);
    if(!d){ plan.monter.push(l); continue; }
    const m=meta[l.id]||{distant:null,pousse:0};
    const localModifie   = (l.updatedAt||0) > (m.pousse||0);
    const distantModifie = d.updated_at !== m.distant;
    if(localModifie){
      /* Le gérant est prioritaire sur sa propre saisie, même si le distant a
         bougé : on pousse, après avoir mis la version distante à l'abri. */
      const pl=poidsLivret(l), pd=poidsLivret(d.data);
      /* Un appauvrissement SUBI se questionne. Un appauvrissement VOULU — le
         gérant vient de cliquer Restaurer et de confirmer — ne se requestionne
         pas : l'intention est déjà connue. */
      if(pd>0 && pl < pd*SEUIL_APPAUVRI && !voulues.has(l.id)) plan.appauvris.push({l,d,pl,pd});
      else plan.majDistant.push({l,d});
    } else if(distantModifie){
      plan.majLocal.push(d);
    }
  }
  return plan;
}

/* --- Accès distant --- */
async function cloudLire(){
  const {data,error}=await sb.from('livrets').select('id,local_id,nom,data,updated_at').is('deleted_at',null);
  if(error) throw error;
  return data||[];
}
async function cloudSnapshot(distant){
  try{ await sb.from('livret_backups').insert({livret_id:distant.id, owner_id:compte.id, data:distant.data}); }catch(e){}
}
async function cloudInserer(l){
  const {data,error}=await sb.from('livrets')
    .insert({owner_id:compte.id, local_id:l.id, nom:l.nom||'', data:l})
    .select('updated_at').single();
  if(error) throw error;
  noterMeta(l.id, data.updated_at, l.updatedAt||0);
}
async function cloudMettreAJour(distant,l){
  // Une copie de la version en ligne part avant de l'écraser, au plus une fois
  // par tranche de 10 minutes pour ne pas saturer l'historique.
  // Exception : une restauration a DÉJÀ sauvegardé l'état précédent — en
  // refaire une ici créerait un doublon et grignoterait le quota de 30.
  const voulue=restaurationsVoulues.has(l.id);
  const vu=dernierSnapshot.get(distant.id)||0;
  if(!voulue && Date.now()-vu > DELAI_SNAPSHOT){ await cloudSnapshot(distant); dernierSnapshot.set(distant.id, Date.now()); }
  const {data,error}=await sb.from('livrets')
    .update({nom:l.nom||'', data:l}).eq('id',distant.id)
    .select('updated_at').single();
  if(error) throw error;
  noterMeta(l.id, data.updated_at, l.updatedAt||0);
  restaurationsVoulues.delete(l.id);   // l'intention est consommée, une seule fois
}
async function cloudSupprimer(localId){
  if(!sb||!compte) return;
  try{ await sb.from('livrets').update({deleted_at:new Date().toISOString()}).eq('local_id',localId).eq('owner_id',compte.id); }catch(e){}
}

/* --- Application du plan --- */
function integrerLivretDistant(d){
  const l=d.data||{};
  l.id=d.local_id||l.id||nid();
  migrateLogement(l);
  const i=S.logements.findIndex(x=>x.id===l.id);
  if(i>=0) S.logements[i]=l; else S.logements.unshift(l);
  noterMeta(l.id, d.updated_at, l.updatedAt||0);   // évite de le repousser aussitôt
  return l.id;
}
/* Écriture locale qui ne relance PAS la synchro : sans ça, save() replanifie une
   synchro qui rappelle save(), et l'app boucle toutes les 4 secondes. */
function persisterSansSync(){ try{ dbSet(CLE_PRINCIPALE,S); }catch(e){} }

/* Rendu ciblé après une descente. Jamais render() : c'est le rendu global qui
   réécrit app.innerHTML, détruit le champ en cours d'édition et fait perdre le
   focus — exactement le défaut corrigé au lot 1. */
function rafraichirApresSync(idsTouches){
  avecFocusPreserve(()=>{
    if(route.view==='dash'){ renderDash(); return; }
    if(route.view==='edit'){
      if(idsTouches.has(route.id)) renderCard(); else refreshSidebar();
      return;
    }
    if(route.view==='preview' && idsTouches.has(route.id)) renderLivret();
  });
}
function avecFocusPreserve(fn){
  const a=document.activeElement;
  const marque=champEditable(a) ? (a.id || a.getAttribute('oninput') || a.getAttribute('placeholder') || null) : null;
  const deb=marque?a.selectionStart:null, fin=marque?a.selectionEnd:null;
  fn();
  if(!marque) return;
  const n=document.getElementById(marque)
      || [...document.querySelectorAll('input,textarea,select')]
           .find(x=>x.getAttribute('oninput')===marque||x.getAttribute('placeholder')===marque);
  if(!n) return;
  try{ n.focus({preventScroll:true}); if(deb!=null&&n.setSelectionRange) n.setSelectionRange(deb,fin); }catch(e){}
}

async function synchroniser({silencieux=false}={}){
  if(!sb||!compte||syncEnCours||!chargementOK) return;
  syncEnCours=true; syncEtat='en-cours'; majEtatSync();
  try{
    const distants=await cloudLire();
    const plan=planSynchro(S.logements, distants, metaSync(), restaurationsVoulues);

    /* MONTANT — n'écrit rien à l'écran, donc jamais bloqué par la saisie. */
    if(plan.motifBlocage!=='local-vide'){
      for(const l of plan.monter)         await cloudInserer(l);
      for(const {l,d} of plan.majDistant) await cloudMettreAJour(d,l);
    }

    /* DESCENDANT — jamais pendant que le gérant écrit : on reporte. */
    const aAppliquer=plan.descendre.concat(plan.majLocal);
    if(aAppliquer.length){
      if(saisieEnCours()){
        syncEtat='ok'; majEtatSync();
        clearTimeout(syncTimer);
        syncTimer=setTimeout(()=>synchroniser({silencieux:true}), GRACE_SAISIE);
        return;                                   // rien n'est appliqué, rien n'est perdu
      }
      const touches=new Set(aAppliquer.map(integrerLivretDistant));
      persisterSansSync();
      rafraichirApresSync(touches);
      if(plan.motifBlocage==='local-vide' && !silencieux)
        toast(plan.descendre.length+' livret'+(plan.descendre.length>1?'s':'')+' récupéré'+(plan.descendre.length>1?'s':'')+' depuis votre compte');
    }

    S.settings.derniereSynchro=Date.now();
    persisterSansSync();
    syncEtat='ok'; majEtatSync();
    if(plan.appauvris.length) demanderArbitrage(plan.appauvris);
  }catch(e){
    syncEtat='erreur'; majEtatSync();
    if(!silencieux) toast('Synchronisation impossible : '+messageAuth(e), true);
  }finally{ syncEnCours=false; }
}
/* Un livret devenu nettement plus pauvre que sa version en ligne n'écrase rien
   sans un accord explicite. Deux issues franches, pour que la question ne se
   repose pas toutes les 4 secondes — et UNE seule sauvegarde, posée à
   l'ouverture : la reposer à chaque passage de synchro polluait l'historique. */
let arbitrageEnCours=null;
function demanderArbitrage(appauvris){
  const x=appauvris[0];
  if(arbitrageEnCours) return;               // la question est déjà posée
  arbitrageEnCours={l:x.l, d:x.d};
  cloudSnapshot(x.d);
  document.getElementById('modal-root').innerHTML=`
  <div class="overlay">
    <div class="modal">
      <h3>Ce livret a beaucoup diminué</h3>
      <p class="sub">« ${esc(x.l.nom||'Sans nom')} » est nettement plus court sur cet appareil
        (${koLisible(x.pl)}) que dans votre compte (${koLisible(x.pd)}).
        Quelle version faut-il garder ? La version en ligne est déjà mise de côté dans les deux cas.</p>
      <div class="modal-foot" style="flex-wrap:wrap">
        <button class="btn btn-plain" onclick="arbitrer('en-ligne')">Reprendre celle de mon compte</button>
        <button class="btn btn-dark" onclick="arbitrer('appareil')">Garder celle de cet appareil</button>
      </div>
    </div>
  </div>`;
}
async function arbitrer(choix){
  const a=arbitrageEnCours; if(!a) return;
  arbitrageEnCours=null; closeModal();
  try{
    if(choix==='appareil'){
      restaurationsVoulues.add(a.l.id);       // décision prise : on ne la repose pas
      await cloudMettreAJour(a.d, a.l);
      toast('Version de cet appareil envoyée');
    }else{
      integrerLivretDistant(a.d);
      save(); rafraichirApresSync(new Set([a.d.local_id]));
      toast('Version de votre compte reprise');
    }
  }catch(e){ toast('Impossible d\'appliquer ce choix : '+messageAuth(e), true); }
}
function planifierSync(){
  if(!sb||!compte) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>synchroniser({silencieux:true}), 4000);
}
function metaOublier(localId){ const m=metaSync(); delete m[localId]; }
function majEtatSync(){
  const el=document.getElementById('sync-etat');
  if(!el) return;
  const t={'inactif':'', 'en-cours':'Synchronisation…', 'ok':'Sauvegardé en ligne', 'erreur':'Synchronisation impossible'}[syncEtat]||'';
  el.textContent=t; el.className='auth-msg'+(syncEtat==='erreur'?' err':' ok');
}

/* ---------------- Versions précédentes (étape 5) ----------------
   Les sauvegardes étaient écrites mais jamais relues : un coffre sans porte.
   Restaurer n'est jamais une opération qui perd quelque chose — l'état actuel
   part d'abord dans le coffre, ENSUITE seulement il est remplacé. */
let versions={ chargement:false, liste:[], erreur:null, uuid:null };

const compteurs = d => ({
  equipements:(d&&d.equipements||[]).filter(e=>e&&e.nom).length,
  adresses:(d&&d.recos||[]).filter(r=>r&&r.nom).length,
  photos:(d&&d.photos||[]).length,
  octets:poidsLivret(d||{}),
});
const koLisible = o => o>=1048576 ? (o/1048576).toFixed(1)+' Mo' : Math.max(1,Math.round(o/1024))+' Ko';
const dateLisible = iso => { const d=new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };

async function chargerVersions(){
  const l=cur();
  if(!sb||!compte||!l){ versions={chargement:false,liste:[],erreur:'hors-ligne',uuid:null}; majVersions(); return; }
  versions={chargement:true,liste:[],erreur:null,uuid:null}; majVersions();
  try{
    const {data:liv,error:e1}=await sb.from('livrets').select('id').eq('local_id',l.id).is('deleted_at',null).maybeSingle();
    if(e1) throw e1;
    if(!liv){ versions={chargement:false,liste:[],erreur:'pas-en-ligne',uuid:null}; majVersions(); return; }
    const {data,error}=await sb.from('livret_backups')
      .select('id,created_at,data').eq('livret_id',liv.id).order('created_at',{ascending:false});
    if(error) throw error;
    versions={chargement:false, liste:data||[], erreur:null, uuid:liv.id};
  }catch(e){ versions={chargement:false,liste:[],erreur:messageAuth(e),uuid:null}; }
  majVersions();
}
function majVersions(){ if(route.view==='versions') renderVersions(); }

/* Aperçu AVANT restauration : le gérant voit ce qu'il récupérerait. */
function apercuVersion(i){
  const v=versions.liste[i]; if(!v) return;
  const d=v.data||{};
  document.getElementById('modal-root').innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal wide lib-modal" style="max-width:760px">
      <div class="lib-head">
        <div><h3>Aperçu de la version</h3><p class="sub" style="margin:0">${esc(dateLisible(v.created_at))} — rien n'est modifié tant que vous ne restaurez pas.</p></div>
        <button class="icon-x" onclick="closeModal()">${I('x',18)}</button>
      </div>
      <div class="lib-body" style="background:var(--bg-deep);border-radius:12px;padding:10px">
        ${livretHTML(d,'complet','fr',{deplie:true})}
      </div>
      <div class="modal-foot" style="border-top:1px solid var(--line-faint);padding-top:16px">
        <button class="btn btn-plain" onclick="closeModal()">Fermer</button>
        <button class="btn btn-dark" onclick="closeModal();restaurerVersion(${i})">${I('back',14)} Restaurer cette version</button>
      </div>
    </div>
  </div>`;
}
async function restaurerVersion(i){
  const v=versions.liste[i], l=cur(); if(!v||!l) return;
  const c=compteurs(v.data), a=compteurs(l);
  confirmModal('Restaurer cette version ?',
    `Le livret reviendra à son état du ${esc(dateLisible(v.created_at))} `
    +`(${c.equipements} équipements, ${c.adresses} adresses). `
    +`L'état actuel (${a.equipements} équipements, ${a.adresses} adresses) sera d'abord `
    +`enregistré comme nouvelle version : vous pourrez y revenir.`,
    async ()=>{
      try{
        // 1. l'état actuel part dans le coffre AVANT toute modification
        await sb.from('livret_backups').insert({livret_id:versions.uuid, owner_id:compte.id, data:l});
        // 2. seulement ensuite, on remplace — en conservant l'identifiant local
        const restaure=JSON.parse(JSON.stringify(v.data||{}));
        restaure.id=l.id;
        migrateLogement(restaure);
        const idx=S.logements.findIndex(x=>x.id===l.id);
        S.logements[idx]=restaure;
        /* L'intention est posée AVANT la synchro déclenchée par touch() :
           le garde-fou anti-appauvrissement ne repose pas la question, et
           aucune seconde sauvegarde n'est créée. */
        restaurationsVoulues.add(l.id);
        touch(restaure);
        toast('Version du '+dateLisible(v.created_at)+' restaurée');
        chargerVersions();
        go('edit');
      }catch(e){ toast('Restauration impossible : '+messageAuth(e), true); }
    },'Restaurer');
}
function renderVersions(){
  const l=cur(); if(!l){ go('dash'); return; }
  const retour=`<button class="btn btn-ghost" onclick="go('edit')" title="Retour" aria-label="Retour">${I('back',14)} <span class="lbl">Retour au livret</span></button>`;
  let corps;
  if(versions.chargement){
    corps=`<p class="ai-note" style="display:flex;align-items:center;gap:9px"><span class="spin">${I('loader',14)}</span> Lecture des versions…</p>`;
  } else if(versions.erreur==='hors-ligne'){
    corps=`<p class="ai-note">Les versions précédentes sont conservées dans votre compte.
      <a href="#" onclick="go('compte');return false" style="color:var(--accent-dark)">Connectez-vous</a> pour y accéder.</p>`;
  } else if(versions.erreur==='pas-en-ligne'){
    corps=`<p class="ai-note">Ce livret n'a pas encore été envoyé dans votre compte — il n'a donc pas d'historique.
      Il partira à la prochaine synchronisation.</p>`;
  } else if(versions.erreur){
    corps=`<p class="auth-msg err">${esc(versions.erreur)}</p>`;
  } else if(!versions.liste.length){
    corps=`<p class="ai-note">Aucune version antérieure pour l'instant. Une copie est mise de côté
      automatiquement avant chaque modification importante envoyée en ligne.</p>`;
  } else {
    const actuel=compteurs(l);
    corps=`
      <p class="ai-note" style="margin-bottom:14px">${versions.liste.length} version${versions.liste.length>1?'s':''} conservée${versions.liste.length>1?'s':''},
        la plus récente en premier. État actuel : ${actuel.equipements} équipements, ${actuel.adresses} adresses, ${koLisible(actuel.octets)}.</p>
      <div style="display:flex;flex-direction:column;gap:9px">
      ${versions.liste.map((v,i)=>{ const c=compteurs(v.data); return `
        <div class="subcard">
          <div class="inline-row" style="flex-wrap:wrap;gap:10px">
            <div style="flex:1;min-width:170px">
              <p style="font-size:13.5px;font-weight:600">${esc(dateLisible(v.created_at))}</p>
              <p class="ai-note" style="margin:2px 0 0">${c.equipements} équipement${c.equipements>1?'s':''} ·
                ${c.adresses} adresse${c.adresses>1?'s':''} · ${c.photos} photo${c.photos>1?'s':''} · ${koLisible(c.octets)}</p>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="apercuVersion(${i})">${I('eye',13)} Aperçu</button>
            <button class="btn btn-plain btn-sm" onclick="restaurerVersion(${i})">${I('back',13)} Restaurer</button>
          </div>
        </div>`;}).join('')}
      </div>`;
  }
  app.innerHTML = topbar(retour) + `
  <div class="view settings">
    <div style="margin-bottom:26px">
      <div class="kicker">Historique</div>
      <h1 class="dash-title">Versions précédentes</h1>
    </div>
    ${card('01', esc(l.nom||'Ce livret'),'Restaurer ne perd rien : l\'état actuel est enregistré avant d\'être remplacé',corps)}
  </div>`;
}

/* ---------------- Toast & menus ---------------- */
function toast(msg, isErr=false){
  const el=document.createElement('div');
  el.className='toast'+(isErr?' error':'');
  el.innerHTML=`<span class="tico">${isErr?I('x',15):I('check',15)}</span>${esc(msg)}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .35s';setTimeout(()=>el.remove(),380);}, 3400);
}
function openCtxMenu(ev, items){
  ev.stopPropagation();
  const root=document.getElementById('ctx-root');
  root.innerHTML=`<div class="ctx-menu" id="ctx">${items.map((it,i)=>it==='sep'?'<div class="ctx-sep"></div>':`<button class="${it.danger?'danger':''}" data-i="${i}">${I(it.icon,14)}${it.label}</button>`).join('')}</div>`;
  const m=document.getElementById('ctx');
  const r=ev.currentTarget.getBoundingClientRect();
  let x=r.right-180, y=r.bottom+6;
  if(y+m.offsetHeight>innerHeight-10) y=r.top-m.offsetHeight-6;
  m.style.left=Math.max(8,x)+'px'; m.style.top=y+'px';
  m.querySelectorAll('button').forEach(b=>b.onclick=e=>{ e.stopPropagation(); closeCtx(); items[+b.dataset.i].fn(); });
  setTimeout(()=>document.addEventListener('click', closeCtx, {once:true}),0);
}
function closeCtx(){ document.getElementById('ctx-root').innerHTML=''; }

/* ---------------- Rendu global ---------------- */
const app = document.getElementById('app');
/* Règle : render() ne touche JAMAIS au scroll. Seule la navigation (go / goSection)
   remet la page en haut. Une modification de contenu conserve la position du gérant. */
function render(){
  closeCtx();
  if(route.view==='dash') renderDash();
  else if(route.view==='edit') renderEditor();
  else if(route.view==='preview') renderPreview();
  else if(route.view==='settings') renderSettings();
  else if(route.view==='compte') renderCompte();
  else if(route.view==='versions') renderVersions();
  // La réserve de place suit le contenu affiché : recalculée à chaque écran,
  // sans dépendre d'un observateur qui peut ne pas se déclencher.
  if(document.querySelector('.alerte-donnees')) requestAnimationFrame(ajusterPlaceAlerte);
}
function scrollTop(){ window.scrollTo(0,0); }
function go(view, extra={}){ route={...route, view, ...extra}; render(); scrollTop(); }
function goSection(sec){ route={...route, section:sec}; render(); scrollTop(); }

/* Re-rendus ciblés — on ne reconstruit que le sous-arbre réellement modifié.
   Le reste de la page (topbar, sidebar, hauteur au-dessus de la fiche) est intact,
   donc ni le scroll de la page ni celui des listes internes ne bougent. */
function renderCard(){
  const l=cur(); const host=document.getElementById('section-host');
  if(!l || !host || route.view!=='edit'){ render(); return; }
  host.innerHTML = renderSection(l);
  refreshSidebar();
}
function refreshSidebar(){
  const l=cur(); const side=document.getElementById('side-host');

}

  const checks=[!!l.nom, !!(l.arrivee.codeAcces||l.arrivee.instructions), !!l.wifi.ssid, l.photos.length>0,
    l.equipements.some(e=>e.nom), l.recos.length>0, !!(l.contacts.hote||l.contacts.tel), !!l.accroche];
  return Math.round(checks.filter(Boolean).length/checks.length*100);
}

  openCtxMenu(ev,[

function newLogement(){ const l=defaultLogement(); S.logements.unshift(l); save(); route={...route, view:'edit', id:l.id, section:'infos'}; render(); scrollTop(); }
function openLogement(id){ route={...route, view:'edit', id, section:'infos'}; render(); scrollTop(); }
function duplicateLogement(id){
  const src=S.logements.find(x=>x.id===id); if(!src) return;
  const copy=JSON.parse(JSON.stringify(src));
  copy.id=nid(); copy.nom=(src.nom||'Logement')+' (copie)'; copy.createdAt=Date.now(); copy.updatedAt=Date.now();
  S.logements.unshift(copy); save(); render(); toast('Logement dupliqué');
}
function deleteLogement(id){
  const l=S.logements.find(x=>x.id===id);
  confirmModal(`Supprimer « ${esc(l?.nom||'ce logement')} » ?`,'Le logement, ses photos et ses traductions seront définitivement supprimés de cet ordinateur.',()=>{
    // Suppression = geste explicite du gérant. C'est le SEUL chemin qui retire
    // un livret du compte en ligne, et il pose un deleted_at, sans effacer la ligne.
    cloudSupprimer(id); metaOublier(id);
    S.logements=S.logements.filter(x=>x.id!==id); save(); go('dash'); toast('Logement supprimé');
  });
}
/* ---------------- Éditeur ---------------- */
function sectionDone(l,id){
  switch(id){
    case 'infos': return !!(l.nom&&l.ville);
    case 'arrivee': return !!(l.arrivee.codeAcces||l.arrivee.instructions);
    case 'depart': return l.depart.checklist.some(Boolean);
    case 'wifi': return !!l.wifi.ssid;
    case 'equipements': return l.equipements.some(e=>e.nom);
    case 'reglement': return l.reglement.some(Boolean);
    case 'quartier': return l.recos.length>0;
    case 'urgences': return l.urgences.length>0||l.faq.length>0;
    case 'contacts': return !!(l.contacts.hote||l.contacts.tel);
    case 'services': return (l.services||[]).some(s=>s.titre);
    case 'photos': return l.photos.length>0;
    case 'style': return true;
  }
}
function progressRing(pc){
  const r=15.5, c=2*Math.PI*r;
  return `<div class="ring">
    <svg width="38" height="38" viewBox="0 0 38 38">
      <circle cx="19" cy="19" r="${r}" fill="none" stroke="#E6E1D4" stroke-width="3.5"/>
      <circle cx="19" cy="19" r="${r}" fill="none" stroke="#66795A" stroke-width="3.5" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pc/100)}" style="transition:stroke-dashoffset .6s var(--ease)"/>
    </svg>
    <span class="pcttxt">${pc}</span>
  </div>`;
}

/* ---------- Import magique ---------- */
/* Le bloc est un outil de démarrage : il doit se voir, pas occuper le premier
   écran. Déplié il coûtait 413 px en tête de la fiche 01 et repoussait le mot
   de bienvenue à 773 px sur un téléphone de 660 px de haut — hors de vue.
   Il est donc replié, et sa clé porte l'identifiant du livret : ouvert sur un
   logement, il ne reste pas ouvert sur les dix-neuf autres.
   Sans clé API, pas d'accordéon du tout : on n'ouvre pas un outil qui ne peut
   pas tourner. La ligne dit alors ce qu'il fait AVANT de dire ce qu'il exige —
   personne ne va chercher une clé pour une fonction dont il ignore l'usage. */
function magicBox(l){
  if(!S.settings.apiKey) return `
  <div class="magic magic-inerte">
    <span class="wico">${I('wand',15)}</span>
    <p><strong>Remplissage magique</strong> — collez votre annonce Airbnb ou le mail du propriétaire,
    l'IA remplit tout le livret d'un coup. Demande une clé API :
    <button type="button" class="lien-inline" onclick="go('settings')">ouvrir les Réglages</button>.</p>
  </div>`;
  return `<div class="magic-acc">${accordeon({
    cle:'magic-'+l.id, icon:'wand', titre:'Remplissage magique',
    sousTitre:"Collez votre annonce, l'IA remplit tout le livret",
    corps:`
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 13px;line-height:1.55">Collez tout ce que vous avez en vrac — annonce Airbnb, mail du propriétaire, notes, codes… L'IA lit tout et remplit chaque fiche du livret, sans jamais inventer un code ou un horaire.</p>
      <textarea class="textarea" id="magic-text" rows="5" placeholder="Collez votre texte brut ici — plus il y en a, mieux c'est…"></textarea>
      <div class="inline-row" style="margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-accent" id="magic-btn" onclick="magicImport()">${I('sparkles',14)} Générer le livret avec l'IA</button>
        <span class="ai-note" id="magic-note">Quelques secondes, quelques centimes.</span>
      </div>`
  })}</div>`;
}

/* ---------------- Accordéons de l'éditeur ----------------
   Transposition de CollapsibleSection (Smart Host) : en-tête bouton accessible,
   pastille d'icône, badge compteur, chevron pivotant, panneau animé.
   Deux écarts assumés faute de framer-motion : l'ouverture passe par
   grid-template-rows 0fr→1fr, et l'état vit en mémoire plutôt qu'en localStorage
   — ce qui suffit à lui faire survivre à tous les re-rendus de la session. */
const accOuverts={};
const accEstOuvert=(cle,parDefaut=false)=> accOuverts[cle]===undefined ? parDefaut : !!accOuverts[cle];
const accSet=(cle,ouvert)=>{ accOuverts[cle]=!!ouvert; };
/* Bascule chirurgicale : on ne touche qu'aux attributs du bloc cliqué.
   Aucun nœud n'est reconstruit, donc aucun défilement ne peut bouger. */
function toggleAcc(btn){
  const acc=btn.closest('.acc'); if(!acc) return;
  const ouvert = acc.dataset.open!=='true';
  acc.dataset.open = ouvert?'true':'false';
  btn.setAttribute('aria-expanded', ouvert?'true':'false');
  accSet(acc.dataset.cle, ouvert);
}
function accordeon({cle, icon, titre, badge='', sousTitre='', corps, ouvertParDefaut=false, forceOuvert=false}){
  const ouvert = forceOuvert || accEstOuvert(cle, ouvertParDefaut);
  const pid = 'acc-'+cle.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  return `<div class="acc" data-open="${ouvert}" data-cle="${esc(cle)}">
    <button type="button" class="acc-head" aria-expanded="${ouvert}" aria-controls="${pid}" onclick="toggleAcc(this)">
      <span class="acc-ico">${I(icon,17)}</span>
      <span class="acc-txt"><span class="acc-title">${esc(titre)}</span>${sousTitre?`<span class="acc-sub">${esc(sousTitre)}</span>`:''}</span>
      ${badge?`<span class="acc-badge">${esc(badge)}</span>`:''}
      <span class="acc-chev">${I('chevron',18)}</span>
    </button>
    <div class="acc-panel" id="${pid}" role="region" aria-label="${esc(titre)}">
      <div class="acc-inner"><div class="acc-body">${corps}</div></div>
    </div>
  </div>`;
}

/* ---------- Helpers fiches ---------- */
function card(num,title,sub,body){
  return `<div class="card"><div class="card-head"><span class="card-num">FICHE ${num}</span><div><h3 class="card-title">${title}</h3>${sub?`<p class="card-sub">${sub}</p>`:''}</div></div><div class="card-body">${body}</div></div>`;
}
const F = (path,label,val,ph='',hint='') => `
  <div class="field"><label>${label}${hint?`<span class="hint">${hint}</span>`:''}</label>
  <input class="input" value="${esc(val)}" placeholder="${esc(ph)}" oninput="setPath('${path}',this.value)"></div>`;
const FT = (path,label,val,ph='',rows=3,hint='') => `
  <div class="field"><label>${label}${hint?`<span class="hint">${hint}</span>`:''}</label>
  <textarea class="textarea" rows="${rows}" placeholder="${esc(ph)}" oninput="setPath('${path}',this.value)">${esc(val)}</textarea></div>`;
const aiPolishBtn = (section,label='Améliorer la rédaction') =>
  `<div><button class="btn btn-ghost btn-sm" id="polish-${section}" onclick="polishSection('${section}')">${I('sparkles',13)} ${label}</button></div>`;

function setPath(path,val){
  const l=cur(); if(!l) return;
  const parts=path.split('.'); let o=l;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  o[parts[parts.length-1]]=val; touch(l);
  if(path==='adresse'||path==='ville'||path==='codePostal') l.geo=null;
  if(path!=='templateId'&&path!=='coverStyle'&&path!=='tone') l.translations={};
}
function setArr(arrPath,i,key,val){
  const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l);
  if(key===null) arr[i]=val; else arr[i][key]=val;
  l.translations={}; touch(l);
}
function rmArr(arrPath,i){ const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l); arr.splice(i,1); l.translations={}; touch(l); renderCard(); }
function moveArr(arrPath,i,dir){ const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l); const j=i+dir;
  if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; l.translations={}; touch(l); renderCard(); }

/* ---------- Bibliothèque d'équipements ---------- */
let libState={ q:'', sel:new Set(), mot:'équipement' };
/* Pied de modale : compteur + bouton d'ajout, mis à jour sans reconstruire la liste. */
function syncLibFoot(){
  const n=libState.sel.size, mot=libState.mot;
  const c=document.getElementById('lib-count'), b=document.getElementById('lib-add');
  if(c) c.textContent = n?`${n} ${mot}${n>1?'s':''} sélectionné${n>1?'s':''}`:'Aucune sélection';
  if(b){ b.disabled=!n; b.innerHTML=`${I('plus',14)} Ajouter${n?' ('+n+')':''}`; }
}
/* Sélection d'une puce : on ne touche qu'au bouton cliqué. Aucun nœud n'est détruit,
   donc le conteneur .lib-body garde sa position de défilement au pixel près. */
function toggleChip(btn, key){
  const on = !libState.sel.has(key);
  on ? libState.sel.add(key) : libState.sel.delete(key);
  btn.classList.toggle('on', on);
  const ico=btn.querySelector('.chip-ico'); if(ico) ico.innerHTML=I(on?'check':'plus',12);
  syncLibFoot();
  majBadgeLib(btn.closest('.acc'));
}
function openEquipLib(){
  libState={ q:'', sel:new Set(), mot:'équipement' };
  drawEquipLib();
}
function equipGroupsHTML(l){
  const q=libState.q.trim().toLowerCase();
  const has=nom=>l.equipements.some(e=>(e.nom||'').toLowerCase()===nom.toLowerCase());
  const groups=EQUIP_LIB.map(g=>({...g, items:g.items.filter(([nom])=>!q||nom.toLowerCase().includes(q))})).filter(g=>g.items.length);
  if(!groups.length) return `<p class="ai-note" style="padding:20px 4px">Aucun équipement ne correspond à « ${esc(libState.q)} ». Vous pourrez l'ajouter manuellement.</p>`;
  return groups.map(g=>{
    const retenus=g.items.filter(([n])=>has(n)||libState.sel.has(n)).length;
    return accordeon({
      cle:'lib:'+g.cat, icon:g.icon, titre:g.cat, badge:`${retenus}/${g.items.length}`,
      /* Une recherche en cours déplie les groupes qui ont des résultats, sinon
         le gérant chercherait dans des tiroirs fermés. L'état mémorisé n'est pas écrasé. */
      forceOuvert:!!q,
      corps:`<div class="lib-items">
              ${g.items.map(([nom])=>{
                const already=has(nom), on=libState.sel.has(nom);
                return `<button class="lib-chip ${on?'on':''} ${already?'used':''}" ${already?'disabled title="Déjà dans votre livret"':''} data-nom="${esc(nom)}" onclick="toggleChip(this,this.dataset.nom)">
                  <span class="chip-ico">${already||on?I('check',12):I('plus',12)}</span> ${esc(nom)}
                </button>`;
              }).join('')}
             </div>`
    });
  }).join('');
}
/* Compteur d'un accordéon de bibliothèque, recalculé depuis le DOM : aucune

/* ---------- FAQ générée par l'IA ---------- */
async function genFAQ(){
  const l=cur();
  if(!S.settings.apiKey){ needKey(); return; }
  const done=btnLoading('faq-btn','Rédaction de la FAQ…');
  try{
    const ctx=JSON.stringify({
      logement:{nom:l.nom, ville:l.ville},
      arrivee:{heure:l.arrivee.heure, code:!!l.arrivee.codeAcces, instructions:l.arrivee.instructions, parking:l.arrivee.parking},
      depart:{heure:l.depart.heure, checklist:l.depart.checklist.filter(Boolean)},
      wifi:!!l.wifi.ssid, equipements:l.equipements.map(e=>e.nom).filter(Boolean),
      reglement:l.reglement.filter(Boolean), quartier:l.recos.map(r=>r.nom).filter(Boolean),
    });
    const raw=await callClaude(
`Tu es l'assistant d'une conciergerie de location courte durée. Voici le contenu d'un livret d'accueil :\n${ctx}\n
Rédige 5 à 7 questions que les voyageurs posent réellement le plus souvent, avec leur réponse. ${toneText(l)}
Règles strictes : appuie-toi UNIQUEMENT sur les informations ci-dessus. Si une information manque (ex. animaux, fumeurs, ménage, bagages), formule une réponse générale et prudente qui invite à contacter l'hôte, sans jamais inventer d'horaire, de code, de prix ou de règle.
Réponds UNIQUEMENT en JSON strict : {"faq":[{"q":"...","r":"..."}]}`, 1800);
    const p=parseJSONLoose(raw);
    if(Array.isArray(p.faq)&&p.faq.length){
      l.faq=p.faq.filter(f=>f&&f.q).map(f=>({id:nid(), q:f.q, r:f.r||''}));
      l.translations={}; touch(l); renderCard(); toast(l.faq.length+' questions rédigées — relisez-les');
    } else { done(); toast('Aucune question générée, réessayez.', true); }
  }catch(e){ done(); toast(e.message==='NO_KEY'?'Clé API manquante':'IA : '+e.message, true); }
}
function addFromLib(){
  const l=cur(); let n=0;
  for(const g of EQUIP_LIB) for(const [nom,ins] of g.items){
    if(libState.sel.has(nom) && !l.equipements.some(e=>(e.nom||'').toLowerCase()===nom.toLowerCase())){
      l.equipements.push({id:nid(), nom, cat:g.cat, instructions:ins}); n++;
      accSet('eq:'+g.cat, true);   // le gérant doit voir ce qu'il vient d'ajouter
    }
  }
  l.translations={}; touch(l); closeModal(); renderCard();
  toast(n+' équipement'+(n>1?'s':'')+' ajouté'+(n>1?'s':'')+' — relisez les instructions');
}
const PREFIXE_ACC={ equipements:'eq:', urgences:'urg:', recos:'reco:' };
function pushArr(arrPath,item){
  const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l); arr.push(item);
  // Ajout manuel dans une section groupée : on déplie la catégorie d'arrivée.
  if(item&&item.cat&&PREFIXE_ACC[arrPath]) accSet(PREFIXE_ACC[arrPath]+item.cat, true);
  touch(l); renderCard();
}

/* ---------- Regroupement par catégorie dans l'éditeur ----------
   On groupe sur le champ `cat` persisté, jamais sur le nom : renommer un
   équipement ne le déplace donc pas. Toute catégorie inconnue retombe sur
   « Autres », si bien qu'aucun élément ne peut disparaître de l'écran. */
function grouperParCat(liste, cats, normaliser){
  const par=new Map();
  liste.forEach((item,i)=>{
    const c=normaliser(item.cat);
    if(!par.has(c)) par.set(c,[]);
    par.get(c).push({item,i});
  });
  return cats.filter(c=>par.has(c.id)).map(c=>({...c, entrees:par.get(c.id)}));
}
/* « Monter » doit déplacer l'élément au sein de SA catégorie. Sur le tableau
   global, le bouton paraîtrait sans effet dès que le voisin appartient à un
   autre groupe. */
function moveDansCat(arrPath,i,dir,normaliser){
  const l=cur(); const arr=arrPath.split('.').reduce((o,k)=>o[k],l);
  const cat=normaliser(arr[i].cat);
  const memeCat=arr.map((x,j)=>normaliser(x.cat)===cat?j:-1).filter(j=>j>=0);
  const cible=memeCat[memeCat.indexOf(i)+dir];
  if(cible===undefined) return;
  [arr[i],arr[cible]]=[arr[cible],arr[i]];
  l.translations={}; touch(l); renderCard();
}
/* Changement de catégorie : on déplie la destination pour que le gérant voie
   où son élément est parti. */
function changerCat(arrPath, i, cle, valeur){
  accSet(cle+valeur, true);
  setArr(arrPath, i, 'cat', valeur);
  renderCard();
}
const selectCat = (arrPath, i, valeurCourante, cats, cle) => `
  <select class="input cat-select" title="Catégorie" onchange="changerCat('${arrPath}',${i},'${cle}',this.value)">
    ${cats.map(c=>`<option value="${esc(c.id)}" ${valeurCourante===c.id?'selected':''}>${esc(c.label||c.id)}</option>`).join('')}
  </select>`;

function equipementsParCategorie(l){

            <input class="input" placeholder="Nom de l'équipement" value="${esc(e.nom)}" oninput="setArr('equipements',${i},'nom',this.value)">
            <button class="icon-x" onclick="rmArr('equipements',${i})">${I('x',15)}</button>
          </div>
          <div class="inline-row">

          </div>

  })).join('');

function urgencesParCategorie(l){
  return grouperParCat(l.urgences, URG_CATS, urgCatConnue).map(c=>accordeon({

/* ---------- Ordre des sections du livret ----------
   L'ordre porte sur le LIVRET, pas sur la sidebar : la sidebar suit l'ordre de
   SAISIE (on remplit l'arrivée avant le départ), le livret suit l'ordre de
   LECTURE choisi par le gérant. Les deux n'ont pas à coïncider. */
function sectionsVidesDuLivret(l){
  try{ const frag=livretHTML(l,'complet','fr',{fragments:true});
       return new Set(ordreSections(l).filter(id=>!frag[id])); }
  catch(e){ return new Set(); }
}
function deplacerSection(i,dir){
  const l=cur(); const o=ordreSections(l).slice(); const j=i+dir;
  if(j<0||j>=o.length) return;
  [o[i],o[j]]=[o[j],o[i]];
  l.ordreSections=o; touch(l); renderCard();
}
function retablirOrdreSections(){
  const l=cur(); l.ordreSections=ordreParDefaut(); touch(l); renderCard();
  toast('Ordre par défaut rétabli');
}
/* Opération de masse : elle ne perd jamais rien. Un instantané de chaque
   livret concerné part dans le coffre AVANT modification, comme la
   restauration du lot précédent. Seul l'ordre change, jamais le contenu. */
/* Même geste que la copie d'adresses : on choisit les livrets, on sauvegarde
   avant d'écrire, on dit ce qui change. Seul le libellé et l'action diffèrent. */
function appliquerOrdreATous(){
  const l=cur();
  confirmerSurLivrets({
    titre:'Appliquer cet ordre à d\'autres logements',
    texte:'Seul l\'ordre des sections change — aucun contenu n\'est touché.',
    okLabel:'Appliquer',
    action: async (cibles)=>{
      let sauvegardesOK=true;
      if(sb&&compte){
        try{
          const distants=await cloudLire();
          const parLocal=new Map(distants.map(d=>[d.local_id,d]));
          for(const x of cibles){ const d=parLocal.get(x.id); if(d) await cloudSnapshot(d); }
        }catch(e){ sauvegardesOK=false; }
      }
      const o=ordreSections(l);
      // Chaque livret est réconcilié pour SES propres sections.
      cibles.forEach(x=>{ x.ordreSections=o.slice(); x.updatedAt=Date.now(); x.ordreSections=ordreSections(x); });
      save(); renderCard();
      const n=cibles.length;
      toast(`Ordre appliqué à ${n} logement${n>1?'s':''}`+(sauvegardesOK?'':' (sauvegarde cloud indisponible)'));
    }
  });
}
function ordreSectionsHTML(l){
  const o=ordreSections(l), vides=sectionsVidesDuLivret(l);
  const fixes=SECTIONS_LIVRET.filter(s=>s.fixe);
  return accordeon({
    cle:'ordre-sections', icon:'scroll', titre:'Ordre des sections du livret',
    badge:String(o.length), ouvertParDefaut:true,
    corps:`
      <p class="ai-note" style="margin-bottom:11px"><strong>Utilisez les flèches ↑ ↓ pour déplacer un bloc.</strong>
        C'est l'ordre dans lequel le voyageur lira les sections.
        ${fixes.map(f=>esc(f.label)).join(' et ')} restent en tête.</p>
      <div style="display:flex;flex-direction:column;gap:7px">
      ${o.map((id,i)=>{ const s=SECTIONS_LIVRET.find(x=>x.id===id); if(!s) return '';
        const vide=vides.has(id);
        return `<div class="ligne-ordre">
          <span class="poignee" aria-hidden="true" title="Ce bloc peut être déplacé">${I('poignee',16)}</span>
          <span class="acc-ico" style="width:30px;height:30px;border-radius:9px;flex:none">${I(s.icon,15)}</span>
          <span style="flex:1;min-width:0;font-size:13.5px;font-weight:${vide?'400':'550'};opacity:${vide?'.55':'1'}">${esc(s.label)}</span>
          ${vide?`<span class="acc-badge">vide</span>`:''}
          <button class="btn-ordre" title="Monter ${esc(s.label)}" aria-label="Monter ${esc(s.label)}" ${i===0?'disabled':''} onclick="deplacerSection(${i},-1)">${I('haut',17)}</button>
          <button class="btn-ordre" title="Descendre ${esc(s.label)}" aria-label="Descendre ${esc(s.label)}" ${i===o.length-1?'disabled':''} onclick="deplacerSection(${i},1)">${I('bas',17)}</button>
        </div>`;}).join('')}
      </div>
      <div class="inline-row" style="flex-wrap:wrap;margin-top:12px">
        <button class="btn btn-ghost btn-sm" onclick="appliquerOrdreATous()">${I('duplicate',13)} Appliquer à tous mes logements</button>
        <button class="btn btn-plain btn-sm" onclick="retablirOrdreSections()">${I('back',13)} Ordre par défaut</button>
      </div>`
  });
}

/* Le numero affiche sur la carte vient de la position dans SECTIONS, comme
   celui de la sidebar : coder les deux separement les faisait diverger. */
const numFiche = id => String(SECTIONS.findIndex(s=>s.id===id)+1).padStart(2,'0');
function renderSection(l){
  switch(route.section){
    case 'infos': return card(numFiche('infos'),'Le logement','Ce qui apparaît en couverture du livret',`
      ${FT('bienvenue','Mot de bienvenue',l.bienvenue,'Bienvenue chez nous ! Nous avons préparé ce livret pour que votre séjour soit simple du premier au dernier jour.',3,'Affiché en grand juste sous la couverture — c\'est la première chose que lit le voyageur. Commencez par une formule d\'accueil : le livret n\'affiche aucun titre au-dessus.')}
      <div class="row-2">
        <div style="grid-column:1/-1">${F('nom','Nom du logement',l.nom,"Ex. L'Escale Havraise",'Titre affiché en couverture du livret')}</div>
        <div style="grid-column:1/-1">${F('adresse','Adresse',l.adresse,'92 rue Frédéric Bellanger','Affichée en couverture du livret, cliquable vers les cartes')}</div>
        <div class="field"><label>Code postal<span class="hint">Complète l'adresse en couverture</span></label>
          <input class="input" value="${esc(l.codePostal)}" placeholder="76600" oninput="setPath('codePostal',this.value);hintCP(this.value)">
          <span class="hint" id="cp-hint" style="display:block;margin-top:5px">${cpInhabituel(l.codePostal)?'Format inhabituel — 5 chiffres en France. La saisie est conservée telle quelle.':''}</span>
        </div>
        ${F('ville','Ville',l.ville,'Le Havre','Complète l\'adresse en couverture')}
        <div style="grid-column:1/-1">${F('etage','Étage',l.etage,'Ex. 1er étage, gauche','Affiché en couverture, juste sous l\'adresse — ne le mettez pas dans les instructions d\'accès')}</div>
      </div>
      ${FT('notes','Description / notes',l.notes,'Quelques notes sur le logement, son ambiance, ce qui le distingue…',4,"Notes libres — l'IA peut en tirer une accroche et un mot de bienvenue")}
      <div class="inline-row">
        <button class="btn btn-ghost" id="btn-accroche" onclick="genAccroche()">${I('sparkles',14)} Rédiger accroche &amp; mot de bienvenue</button>
      </div>
      ${F('accroche','Accroche',l.accroche,"Ex. Un balcon lumineux à cinq minutes de la mer",'Une phrase sous le nom, en couverture')}

    case 'arrivee': return card(numFiche('arrivee'),'Arrivée','Horaires et accès au logement',`
      <div class="row-2">
        <div class="field"><label>Arrivée à partir de</label><input type="time" class="input" value="${esc(l.arrivee.heure)}" oninput="setPath('arrivee.heure',this.value)"></div>
        ${F('arrivee.codeAcces',"Code d'accès",l.arrivee.codeAcces,'Ex. 4821','Affiché en couverture du livret, sous l\'étage')}
      </div>
      ${F('arrivee.parking','Stationnement',l.arrivee.parking,'Ex. place gratuite rue Bellanger après 19h','Section à part dans le livret : sa place se règle dans Habillage, avec les autres')}
      ${FT('arrivee.instructions',"Instructions d'accès",l.arrivee.instructions,"Comment trouver l'entrée, où est la boîte à clés…",3,"Pour l'étage, utilisez le champ « Étage » de la fiche 01 : il s'affiche en couverture")}
      ${l.arrivee.instructions?aiPolishBtn('arrivee'):''}
    `);
    case 'depart': return card(numFiche('depart'),'Départ','Une seule check-list, claire et actionnable — c\'est tout ce que le voyageur doit faire',`
      <div class="row-2">
        <div class="field"><label>Départ avant</label><input type="time" class="input" value="${esc(l.depart.heure)}" oninput="setPath('depart.heure',this.value)"></div>
      </div>
      <div class="field"><label>Check-list de départ<span class="hint">Une action par ligne. Le voyageur la coche mentalement, rien à lire en plus.</span></label>
        <div style="display:flex;flex-direction:column;gap:8px">
        ${l.depart.checklist.map((c,i)=>`
          <div class="inline-row">
            <span class="ck-box">${I('check',11)}</span>
            <input class="input" placeholder="Ex. Déposer les clés dans la boîte" value="${esc(c)}" oninput="setArr('depart.checklist',${i},null,this.value)">
            ${i>0?`<button class="icon-x" title="Monter" onclick="moveArr('depart.checklist',${i},-1)">${I('left',14)}</button>`:''}
            <button class="icon-x" onclick="rmArr('depart.checklist',${i})">${I('x',15)}</button>
          </div>`).join('')}
        </div>
      </div>
      <div class="inline-row" style="flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="pushArr('depart.checklist','')">${I('plus',13)} Ajouter un point</button>

      </div>
    `);
    case 'wifi': return card(numFiche('wifi'),'Wifi','Un QR code de connexion sera généré automatiquement dans le livret',`
      <div class="row-2">
        ${F('wifi.ssid','Nom du réseau',l.wifi.ssid,'Ex. ESCALE-Guest')}
        ${F('wifi.mdp','Mot de passe',l.wifi.mdp,'••••••••')}
      </div>
    `);
    case 'equipements': return card(numFiche('equipements'),'Équipements','Choisissez dans la bibliothèque — les instructions sont pré-rédigées, à ajuster librement',`
      <button class="lib-open" onclick="openEquipLib()">
        <span class="lib-ico">${I('sofa',18)}</span>
        <span class="lib-txt"><strong>Ajouter depuis la bibliothèque</strong><span>${EQUIP_LIB.reduce((n,g)=>n+g.items.length,0)} équipements courants, prêts à l'emploi</span></span>
        <span class="lib-arrow">${I('plus',17)}</span>

      ${l.equipements.length?equipementsParCategorie(l):`<p class="ai-note">Aucun équipement pour l'instant. Ouvrez la bibliothèque ci-dessus ou ajoutez-en un manuellement.</p>`}

        <button class="btn btn-ghost btn-sm" onclick="pushArr('equipements',{id:nid(),nom:'',instructions:'',cat:EQUIP_AUTRES})">${I('plus',13)} Ajouter manuellement</button>
        ${l.equipements.some(e=>e.instructions)?`<button class="btn btn-ghost btn-sm" id="polish-equipements" onclick="polishSection('equipements')">${I('sparkles',13)} Personnaliser avec l'IA</button>`:''}

    case 'reglement': return card(numFiche('reglement'),'Règlement intérieur','Les règles affichées dans le livret',`

        <div class="inline-row"><input class="input" value="${esc(r)}" oninput="setArr('reglement',${i},null,this.value)">
        <button class="icon-x" onclick="rmArr('reglement',${i})">${I('x',15)}</button></div>`).join('')}
      </div>
      <div class="inline-row">
        <button class="btn btn-ghost btn-sm" onclick="pushArr('reglement','')">${I('plus',13)} Ajouter une règle</button>
        ${l.reglement.some(Boolean)?`<button class="btn btn-ghost btn-sm" id="polish-reglement" onclick="polishSection('reglement')">${I('sparkles',13)} Adoucir la formulation</button>`:''}
      </div>
    `);
    case 'urgences': return card(numFiche('urgences'),'Urgences & FAQ','Ce qui rassure le voyageur et vous évite les appels à 23h',`
      <div class="field"><label>Numéros et réflexes d'urgence</label>
        ${l.urgences.length?`<div style="margin-bottom:11px">${urgencesParCategorie(l)}</div>`:''}

          <span class="lib-ico">${I('shield',18)}</span>
          <span class="lib-txt"><strong>Ajouter depuis la bibliothèque</strong><span>${URG_LIB.length} numéros et réflexes prêts à l'emploi</span></span>
          <span class="lib-arrow">${I('plus',17)}</span>

        <div class="inline-row" style="margin-top:10px">
          <button class="btn btn-ghost btn-sm" onclick="pushArr('urgences',{id:nid(),label:'',valeur:'',note:'',cat:URG_AUTRES})">${I('plus',13)} Ajouter manuellement</button>
        </div>
      </div>

      <div class="field" style="margin-top:4px"><label>Questions fréquentes<span class="hint">L'IA relit votre livret et rédige les questions que vos voyageurs posent le plus souvent</span></label>
        ${l.faq.length?`<div style="display:flex;flex-direction:column;gap:9px;margin-bottom:11px">
        ${l.faq.map((f,i)=>`
          <div class="subcard">
            <div class="inline-row">
              <input class="input" placeholder="Question" value="${esc(f.q)}" oninput="setArr('faq',${i},'q',this.value)">
              ${i>0?`<button class="icon-x" title="Monter" onclick="moveArr('faq',${i},-1)">${I('left',14)}</button>`:''}
              <button class="icon-x" onclick="rmArr('faq',${i})">${I('x',15)}</button>
            </div>
            <textarea class="textarea" rows="2" placeholder="Réponse" oninput="setArr('faq',${i},'r',this.value)">${esc(f.r)}</textarea>
          </div>`).join('')}

        <div class="inline-row" style="flex-wrap:wrap">
          <button class="btn btn-accent btn-sm" id="faq-btn" onclick="genFAQ()">${I('sparkles',13)} Générer la FAQ avec l'IA</button>
          <button class="btn btn-ghost btn-sm" onclick="pushArr('faq',{id:nid(),q:'',r:''})">${I('plus',13)} Ajouter une question</button>
        </div>

    case 'quartier': return renderQuartier(l);
    case 'contacts': return card(numFiche('contacts'),'Contacts','Comment vous joindre pendant le séjour',`
      <div class="row-2">
        ${F('contacts.hote','Nom de l\'hôte / conciergerie',l.contacts.hote,'')}
        ${F('contacts.tel','Téléphone',l.contacts.tel,'')}
        ${F('contacts.email','Email',l.contacts.email,'')}
        ${F('contacts.urgence','Urgence (hors horaires)',l.contacts.urgence,'')}
      </div>
    `);
    case 'services': return card(numFiche('services'),'Nos services','Vos prestations et partenaires, avec un lien vers votre site',`
      ${(l.services||[]).length?`<div style="display:flex;flex-direction:column;gap:11px">
      ${l.services.map((s,i)=>`
        <div class="subcard">
          <div class="inline-row">
            <span class="poignee" aria-hidden="true">${I('poignee',15)}</span>

        </div>`).join('')}
      </div>`:`<p class="ai-note">Aucun service pour l'instant. Ajoutez vos prestations ou celles de vos partenaires — elles apparaîtront dans le livret avec un lien cliquable.</p>`}
      <div class="inline-row" style="flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="pushArr('services',{id:nid(),titre:'',desc:'',url:'',image:''})">${I('plus',13)} Ajouter un service</button>
      </div>
      <p class="ai-note">Le lien reste cliquable dans le fichier envoyé au voyageur. Sur papier, l'adresse du site est imprimée en clair.</p>
    `);
    case 'photos': return card(numFiche('photos'),'Photos','Couverture et galerie du livret',`
      <div class="drop" id="dropzone" onclick="document.getElementById('photo-input').click()">

        <span style="font-size:11.5px;color:var(--muted-2)">Compressées automatiquement · la première sert de couverture</span>

              <div class="ovl-bottom">
                <div style="display:flex;gap:4px">
                  ${i>0?`<button class="pbtn" onclick="movePhoto(${i},-1)" title="Reculer">${I('left',13)}</button>`:''}

    case 'style': mesurerLogo(renderCard); return card(numFiche('style'),'Habillage','Le style visuel du livret remis au voyageur',`
      <div class="field">${ordreSectionsHTML(l)}</div>

        </div>
      </div>
      ${caseCouleur({
        titre:'Fond du livret', indice:'Ce qu\'on voit derrière et autour des blocs. Conservé dans le PDF envoyé, blanchi à l\'impression papier.',

      <div class="field"><label>Logo de la conciergerie en tête du livret<span class="hint">Le logo est celui de vos réglages, commun à tous vos livrets. Sa taille et sa position se règlent ici, livret par livret.</span></label>
        ${S.settings.logo?(()=>{ const plaf=plafondLogo(), hL=Math.min(hauteurLogo(l), plaf.max), visible=hauteurLogo(l)>0, al=alignLogo(l); return `

            <div class="pill-group">
              ${[['gauche','Gauche'],['centre','Centre'],['droite','Droite']].map(([id,lab])=>
                `<button class="pill ${al===id?'on':''}" onclick="setPath('logoAlign','${id}');renderCard()">${lab}</button>`).join('')}

        <div class="drop" onclick="document.getElementById('logo-input').click()">

/* ---------- Photos ---------- */
function compressImage(file, MAXW, Q, keepAlpha){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=MAXW||1600; let w=img.width,h=img.height;
      if(Math.max(w,h)>MAX){ const r=MAX/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',Q||0.82));
    };
    img.onerror=rej;
    const rd=new FileReader(); rd.onload=()=>img.src=rd.result; rd.onerror=rej; rd.readAsDataURL(file);
  });
}
async function addPhotos(files){
  const l=cur(); if(!l) return;
  let n=0;
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    try{ l.photos.push({id:nid(), dataUrl:await compressImage(f), caption:''}); n++; }
    catch(e){ toast('Photo illisible : '+f.name, true); }
  }
  if(n) toast(n+' photo'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''));
  touch(l); renderCard();
}
async function addWallpaper(file){
  if(!file||!file.type.startsWith('image/')){ toast('Choisissez un fichier image', true); return; }
  const l=cur();
  try{
    l.wallpaper=await compressImage(file, 1800, 0.78);
    if(!l.wallpaperOpacity) l.wallpaperOpacity=18;
    touch(l); renderCard(); toast('Fond appliqué — ajustez l\'intensité puis vérifiez l\'aperçu');
  }catch(e){ toast('Image illisible', true); }
}

/* L'image d'un service s'affiche en 62×62 dans le livret et en 36×36 dans
   l'éditeur. Elle était stockée en 600 px de côté — dix fois la taille utile,
   dans un JSON qui part sur Supabase à chaque synchronisation. 160 px couvre le
   retina (2,5×) et suffit largement. Voir MAX_IMG_SERVICE pour le poids retenu. */
const MAX_IMG_SERVICE=160;
/* Une image de fond est étalée en « cover » : c'est la LARGEUR qui compte, pas
   le plus grand côté. 1200 px couvre un écran d'ordinateur sans excès. */
const MAX_IMG_FOND=1200;
async function importerImageService(i,file){
  if(!file) return;
  try{
    const png=/png|svg/i.test(file.type);
    const img=await compressImage(file, MAX_IMG_SERVICE, 0.82, png);
    setArr('services',i,'image',img); renderCard();
    toast('Image ajoutée');
  }catch(e){ toast('Image illisible, réessayez avec un PNG ou un JPEG', true); }
}

/* Import du logo depuis la fiche Habillage. Redimensionné à 400 px de large :
   il ne dépasse jamais 62 px à l'écran et ~2 cm à l'impression, donc au-delà
   c'est du poids pur — et le livret entier part en JSONB dans Supabase. */
/* Un logo se cadre par sa HAUTEUR dans le livret, pas par son plus grand côté.
   compressImage plafonnait le plus grand côté à 400 px : un bandeau 600×80 était
   stocké en 400×53, et le curseur ne pouvait plus rien au-delà de 53 px, quel que
   soit le nombre affiché. On plafonne donc la hauteur — au double de la taille
   maximale, pour rester net sur écran retina — et la largeur suit le rapport,
   bornée pour les panoramas extrêmes. Jamais d'agrandissement.
   Poids : un PNG 1600×192 pèse au pire ~120 Ko, le double d'avant. */
const LOGO_H_STOCK=LOGO_MAX*2, LOGO_W_STOCK=1600;
function compressLogo(file, keepAlpha){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const r=Math.min(1, LOGO_H_STOCK/img.height, LOGO_W_STOCK/img.width);
      const w=Math.max(1,Math.round(img.width*r)), h=Math.max(1,Math.round(img.height*r));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res({ dataUrl: keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',0.92), w, h });
    };
    img.onerror=rej;
    const rd=new FileReader(); rd.onload=()=>img.src=rd.result; rd.onerror=rej; rd.readAsDataURL(file);
  });
}
async function importerLogo(file){
  if(!file) return;
  try{
    const png=/png|svg/i.test(file.type);
    const {dataUrl,w,h}=await compressLogo(file, png);
    S.settings.logo=dataUrl;
    logoMesure={src:dataUrl, w, h};                        // mesure connue, pas de relecture
    const l=cur();
    if(l && l.logoHaut==='aucun'){ l.logoHaut=LOGO_DEFAUT; }  // importer, c'est vouloir l'afficher
    save(); renderCard();
    toast('Logo importé — ajustez sa taille si besoin');
  }catch(e){ toast('Image illisible, réessayez avec un PNG ou un JPEG', true); }
}

/* Les adresses retenues, regroupées par catégorie en accordéons. Le regroupement

   renommer une adresse ne la déplace pas. Une catégorie sans adresse n'apparaît

function recosListHTML(l){

/* Empreinte d'une adresse, sur DEUX clés et non une : l'identifiant OSM quand
   il existe, et toujours catégorie + nom normalisé. Avec la seule clé OSM,
   une adresse tapée à la main et la même venue de la recherche formaient un
   doublon — testé, corrigé avant d'être écrit ici. Deux homonymes dans des
   catégories différentes restent deux lieux distincts. */
const nomNormalise = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function fusionnerRecos(destination, source){
  const parOsm=new Set(destination.filter(r=>r.osmId).map(r=>String(r.osmId)));
  const parNom=new Set(destination.map(r=>recoCatConnue(r.cat)+'|'+nomNormalise(r.nom)));
  const ajoutees=[];
  for(const r of source){
    if(!String(r.nom||'').trim()) continue;
    const o=r.osmId?String(r.osmId):null, n=recoCatConnue(r.cat)+'|'+nomNormalise(r.nom);
    if((o&&parOsm.has(o))||parNom.has(n)) continue;
    if(o) parOsm.add(o);
    parNom.add(n);
    ajoutees.push({...r, id:nid()});
  }
  return ajoutees;
}
/* Copie d'une catégorie vers d'autres livrets. On AJOUTE toujours : rien n'est
   remplacé, rien n'est effacé. La sauvegarde cloud est une ceinture, pas une
   condition — si elle échoue, la copie se fait quand même et le gérant est
   prévenu, plutôt que de perdre le geste pour une coupure réseau. */
async function copierCategorieVers(catId){
  const l=cur(); if(!l) return;
  const source=l.recos.filter(r=>recoCatConnue(r.cat)===catId && String(r.nom||'').trim());
  if(!source.length){ toast('Aucune adresse à copier dans cette catégorie', true); return; }
  const cat=CATS.find(c=>c.id===catId);
  confirmerSurLivrets({
    titre:`Copier « ${cat?cat.label:catId} » vers d'autres livrets`,
    texte:`${source.length} adresse${source.length>1?'s':''} seront ajoutées aux livrets choisis. Les adresses déjà présentes ne sont pas dupliquées, et aucune adresse existante n'est modifiée.`,
    okLabel:'Copier',
    action: async (cibles)=>{
      let sauvegardesOK=true;
      if(sb&&compte){
        try{
          const distants=await cloudLire();
          const parLocal=new Map(distants.map(d=>[d.local_id,d]));
          for(const x of cibles){ const d=parLocal.get(x.id); if(d) await cloudSnapshot(d); }
        }catch(e){ sauvegardesOK=false; }
      }
      let total=0, touches=0;
      for(const x of cibles){
        const ajoutees=fusionnerRecos(x.recos||[], source);
        if(!ajoutees.length) continue;
        x.recos=(x.recos||[]).concat(ajoutees);
        x.translations={}; x.updatedAt=Date.now();
        total+=ajoutees.length; touches++;
      }
      save(); renderCard();
      const ignorees=source.length*cibles.length-total;
      let msg;
      if(!total) msg=`Rien à ajouter : ces adresses étaient déjà dans ${cibles.length>1?'les '+cibles.length+' livrets':'le livret'}`;
      else{
        msg=`${total} adresse${total>1?'s':''} ajoutée${total>1?'s':''} dans ${touches} livret${touches>1?'s':''}`;
        if(ignorees>0) msg+=` — ${ignorees} déjà présente${ignorees>1?'s':''}, ignorée${ignorees>1?'s':''}`;
      }
      if(!sauvegardesOK) msg+=' (sauvegarde cloud indisponible)';
      toast(msg);
    }
  });
}
/* Une case de couleur : nuancier, sélecteur natif, hexadécimal, image.
   Les deux cases sont le même composant — « Fond » et « Blocs » ne diffèrent que
   par le champ visé et le plafond de l'image. */
const NUANCIER = ['#FFFFFF','#F6F4EF','#F7F0E8','#F4F4F2','#FAF6EE','#F5F1F3',
                  '#E8E4DA','#D9D5CB','#2B2B2B','#101826','#1C2B21','#2E222B'];
function caseCouleur({titre, indice, champ, valeur, defaut, image, champImage, opacite, champOpacite, maxOpacite, inputId}){

        title="${c}" aria-label="Couleur ${c}" onclick="setPath('${champ}','${c}');renderCard()"></button>`).join('')}
    </div>

      <input type="color" class="color-pick" value="${actuelle}" oninput="setPath('${champ}',this.value);renderCard()">
      <input class="input" style="width:120px;font-family:var(--mono)" value="${esc(hexPropre(valeur)||'')}"
        placeholder="${actuelle}" onchange="poserHex('${champ}',this.value,this)">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('${inputId}').click()">${I('upload',13)} ${image?'Changer l\'image':'Importer une image'}</button>
      ${valeur?`<button class="btn btn-plain btn-sm" onclick="setPath('${champ}',null);renderCard()">Couleur d'origine</button>`:''}
    </div>
    ${image?`<div class="wp-panel" style="margin-top:11px">
      <div class="wp-prev" style="background-image:url('${image}')">
        <span class="wp-veil" style="background:${actuelle};opacity:${1-(opacite||18)/100}"></span>
      </div>
      <div class="wp-ctrl">
        <label style="margin-bottom:6px">Intensité de l'image — ${opacite||18} %</label>
        <input type="range" class="wp-range" min="4" max="${maxOpacite}" value="${Math.min(opacite||18,maxOpacite)}"
          oninput="setPath('${champOpacite}',+this.value);liveWallpaper(+this.value)">
        <div class="inline-row" style="margin-top:11px">
          <button class="btn btn-danger btn-sm" onclick="setPath('${champImage}',null);renderCard()">${I('trash',13)} Retirer l'image</button>
        </div>
      </div>
    </div>`:''}
  </div>`;
}
/* Hexadécimal saisi à la main : on pardonne tout ce qui est reconnaissable, et
   on prévient sans rien casser quand ça ne l'est pas. */
function poserHex(champ, brut, input){

async function geocode(l){
  if(l.geo) return l.geo;
  const q=encodeURIComponent([l.adresse,l.codePostal,l.ville,'France'].filter(Boolean).join(', '));
  const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`,{headers:{'Accept':'application/json'}});
  const data=await res.json();
  if(!data.length){
    const res2=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(l.ville+', France')}&format=json&limit=1`);
    const d2=await res2.json();
    if(!d2.length) throw new Error('Adresse introuvable — vérifiez la fiche 01.');
    l.geo={lat:+d2[0].lat, lon:+d2[0].lon, approx:true};
  } else l.geo={lat:+data[0].lat, lon:+data[0].lon, approx:false};
  touch(l); return l.geo;
}
const OSM_FILTERS = {
  restaurant:['["amenity"~"restaurant|fast_food"]'],
  cafe:['["amenity"~"cafe|bar|pub"]'],
  commerce:['["shop"~"supermarket|bakery|convenience|greengrocer|butcher"]'],
  transport:['["highway"="bus_stop"]','["railway"~"station|tram_stop|subway_entrance"]'],
  sante:['["amenity"~"pharmacy|doctors|hospital"]'],
  musee:['["tourism"~"museum|gallery"]','["amenity"~"theatre|arts_centre"]'],
  activite:['["tourism"~"attraction|viewpoint"]','["leisure"~"park|beach_resort"]'],
};
function haversine(a,b,c,d){ const R=6371e3,p=Math.PI/180; const x=(c-a)*p/2,y=(d-b)*p/2;
  const h=Math.sin(x)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y)**2; return Math.round(2*R*Math.asin(Math.sqrt(h))); }
/* Interrogation d'Overpass avec réessais.
   Mesuré sur 10 requêtes communales consécutives : 5 refus — 429 (quota, que
   mes propres rafales provoquaient) et surtout 504 (serveur saturé), 3 sur 10
   celui-là, indépendant de la cadence. Un seul réessai a suffi dans 5 cas sur
   5, jamais le troisième. D'où trois tentatives et des pauses courtes, plus un
   texte qui change à chaque essai : dix secondes d'écran figé, c'est une
   application qui a planté. */
const PAUSES_OVERPASS=[0,2000,5000,10000];
async function overpass(q, surEtape){
  let dernier=null;
  for(let i=0;i<3;i++){
    if(PAUSES_OVERPASS[i]) await new Promise(r=>setTimeout(r,PAUSES_OVERPASS[i]));
    if(surEtape) surEtape(i);
    try{
      const res=await fetch('https://overpass-api.de/api/interpreter',
        {method:'POST',body:'data='+encodeURIComponent(q)});
      if(res.ok) return await res.json();
      dernier=res.status;
    }catch(e){ dernier='reseau'; }
  }
  const err=new Error(dernier==='reseau'
    ? "Pas de connexion — la recherche a besoin d'internet."
    : "Le service cartographique est saturé. Réessayez dans un moment : c'est un service public gratuit, ces ralentissements sont passagers.");
  err.sature=true; throw err;
}
async function searchOSM(){
  const l=cur();
  if(!osmState.cats.length){ toast('Choisissez au moins une catégorie', true); return; }
  osmState.loading=true; osmState.error=''; osmState.results=[]; osmState.resume='';
  osmState.etape='Recherche en cours…'; renderCard();
  try{
    const g=await geocode(l);
    const communal = osmState.radius==='ville';
    const sels=osmState.cats.flatMap(c=>OSM_FILTERS[c]);
    /* La commune est celle qui CONTIENT le point du logement, jamais celle qui
       porte le même nom : « Saint-Denis » désigne cinq communes françaises, dont
       La Réunion. Le nom saisi par le gérant — casse, accents, code postal collé —
       ne sert donc jamais à chercher. Tout tient en une requête : la commune,
       le total réel, et les lieux. */
    const q = communal
      ? `[out:json][timeout:90];is_in(${g.lat},${g.lon})->.z;
         area.z["boundary"="administrative"]["admin_level"="8"]->.c;
         .c out tags;
         ( ${sels.map(s=>`node(area.c)${s};way(area.c)${s};`).join('')} )->.p;
         .p out tags center 60;
         .p out count;`
      : `[out:json][timeout:25];( ${sels.map(s=>`node(around:${osmState.radius},${g.lat},${g.lon})${s};`).join('')} );out tags center 90;`;
    const etapes=['Recherche en cours…',
      'Le service cartographique est chargé — deuxième tentative…',
      'Toujours chargé — dernière tentative…'];
    const data=await overpass(q, i=>{ osmState.etape=etapes[i]||etapes[2]; renderCard(); });
    const els=data.elements||[];
    const zone=els.find(e=>e.type==='area');
    const compte=els.find(e=>e.type==='count');
    const total=compte?+compte.tags.total:null;
    const seen=new Set();
    const rows=els.filter(e=>e.type==='node'||e.type==='way').map(e=>{
      const t=e.tags||{}; const name=t.name; if(!name||seen.has(name)) return null; seen.add(name);
      let cat='activite';
      if(/restaurant|fast_food/.test(t.amenity||'')) cat='restaurant';
      else if(/cafe|bar|pub/.test(t.amenity||'')) cat='cafe';
      else if(t.shop) cat='commerce';
      else if(t.highway==='bus_stop'||t.railway) cat='transport';
      else if(/pharmacy|doctors|hospital/.test(t.amenity||'')) cat='sante';
      else if(/museum|gallery/.test(t.tourism||'')||/theatre|arts_centre/.test(t.amenity||'')) cat='musee';
      const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon;
      if(lat==null||lon==null) return null;
      const dist=haversine(g.lat,g.lon,lat,lon);
      let detail=t.cuisine?t.cuisine.split(';')[0].replace(/_/g,' '):(t.railway?'gare / arrêt':(t.shop||''));
      return { osmId:e.id, nom:name, cat, dist, detail,
        mapsUrl:`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}` };
    }).filter(Boolean).filter(r=>osmState.cats.includes(r.cat));
    rows.sort((a,b)=>a.dist-b.dist);
    osmState.results=rows.slice(0,60);
    osmState.communal=communal;
    if(communal){
      const nomCommune=zone&&zone.tags?zone.tags.name:null;
      if(!nomCommune){
        osmState.error="Commune introuvable pour cette adresse — vérifiez la ville en fiche 01, ou choisissez un rayon.";
      } else if(!rows.length){
        osmState.error=`Aucun lieu de ces catégories trouvé dans ${nomCommune}.`;
      } else {
        /* Dire le total réel, pas seulement les 60 retenus : sans ça le gérant
           croit que sa ville compte soixante restaurants et ne cherche pas plus loin. */
        osmState.resume=`${total} lieu${total>1?'x':''} dans ${nomCommune} — les ${osmState.results.length} plus proches du logement sont listés.`;
      }
    } else if(!rows.length){
      osmState.error="Aucun lieu de ces catégories dans ce rayon. Essayez plus large, ou « Toute la ville ».";
    }
  }catch(e){ osmState.error=e.message; }
  osmState.loading=false; osmState.etape=''; renderCard();
}
function osmReco(r){
  return { id:nid(), osmId:r.osmId, cat:r.cat, nom:r.nom,
    desc:`À ${r.dist<100?'moins de 2 min':'environ '+Math.max(1,Math.round(r.dist/80))+' min'} à pied${r.detail?' — '+r.detail:''}.`,
    dist:r.dist, mapsUrl:r.mapsUrl };
}
/* On met à jour la ligne cliquée et la liste retenue, jamais le conteneur de résultats :
   le gérant peut enchaîner les ajouts sans que la liste ne se replace. */
function addOSM(i, btn){
  const l=cur(); const reco=osmReco(osmState.results[i]);
  l.recos.push(reco);
  accSet('reco:'+recoCatConnue(reco.cat), true);   // le gérant voit où l'adresse est rangée
  l.translations={}; touch(l);
  markOsmAdded(btn); refreshRecos();
}
function addAllOSM(){
  const l=cur();
  const aAjouter=osmState.results.filter(r=>!l.recos.some(x=>x.osmId===r.osmId));
  if(!aAjouter.length){ toast('Toutes ces adresses sont déjà dans le livret'); return; }
  const poser=()=>{
    let n=0;
    aAjouter.forEach(r=>{ const reco=osmReco(r); l.recos.push(reco);
      accSet('reco:'+recoCatConnue(reco.cat), true); n++; });
    l.translations={}; touch(l);
    document.querySelectorAll('.osm-res .add').forEach(markOsmAdded); refreshRecos();
    toast(n+' adresse'+(n>1?'s':'')+' ajoutée'+(n>1?'s':''));
  };
  /* « Tout ajouter » peut poser soixante adresses d'un coup : c'est un geste qui
     se regrette. La confirmation ne dépend PAS du mode mais du nombre — en plein
     centre-ville, un rayon de 900 m rend déjà soixante restaurants, et le
     regret est le même que sur une commune entière. */
  if(aAjouter.length>=15){
    confirmModal(`Ajouter ${aAjouter.length} adresses au livret ?`,
      `Elles seront classées par catégorie et vous pourrez les retirer une par une. Vous pouvez aussi n'ajouter que celles qui vous intéressent, ligne par ligne.`,
      poser, 'Tout ajouter');
  } else poser();
}

/* ---------------- IA — API Anthropic ---------------- */
async function callClaude(prompt, maxTokens=1500){
  if(!S.settings.apiKey) throw new Error('NO_KEY');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':S.settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body:JSON.stringify({ model:S.settings.model||'claude-haiku-4-5', max_tokens:maxTokens,
      messages:[{role:'user',content:prompt}] }),
  });
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    if(res.status===401) throw new Error('Clé API invalide — vérifiez-la dans les réglages.');
    if(res.status===429) throw new Error('Trop de requêtes — patientez quelques secondes.');
    throw new Error(err?.error?.message||('Erreur API ('+res.status+')'));
  }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
}
function parseJSONLoose(raw){
  const cleaned=raw.replace(/```json|```/g,'').trim();
  const m=cleaned.match(/\{[\s\S]*\}/);
  return JSON.parse(m?m[0]:cleaned);
}
function toneText(l){
  return l.tone==='elegant' ? 'Ton élégant et sobre, hôtellerie haut de gamme, vouvoiement, aucune familiarité.'
       : l.tone==='concis'  ? 'Ton direct et concis, phrases courtes, zéro superflu, vouvoiement.'
       : 'Ton chaleureux mais sobre, accueillant sans emphase, vouvoiement.';
}
function needKey(){
  confirmModal('Clé API requise','Pour activer l\'IA, ajoutez votre clé API Anthropic dans les réglages (icône engrenage). La création prend 5 minutes sur console.anthropic.com et chaque livret généré coûte quelques centimes.',()=>go('settings'),'Ouvrir les réglages');
}

  const prev=b.innerHTML; b.disabled=true; b.innerHTML=`<span class="spin">${I('loader',14)}</span> ${html}`;
  return ()=>{ if(document.getElementById(id)){ b.disabled=false; b.innerHTML=prev; } };
}

async function polishSection(sec){

    let payload, instruction;
    if(sec==='arrivee'){ payload={instructions:l.arrivee.instructions}; instruction='Réécris ces instructions d\'accès pour un voyageur : claires, pas à pas, sans rien inventer. Rends {"instructions":"..."}'; }
    if(sec==='equipements'){ payload=l.equipements.map(e=>({nom:e.nom,instructions:e.instructions})); instruction='Réécris les instructions de chaque équipement : claires, 1-2 phrases, sans rien inventer. Rends {"items":[{"nom":"...","instructions":"..."}]} dans le même ordre.'; }
    if(sec==='reglement'){ payload=l.reglement.filter(Boolean); instruction='Reformule ces règles de maison : fermes mais courtoises et accueillantes, une phrase chacune. Rends {"items":["..."]} dans le même ordre.'; }
    if(sec==='recos'){ payload=l.recos.map(r=>({nom:r.nom,cat:r.cat,dist:r.dist,desc:r.desc})); instruction='Rédige pour chaque adresse une description engageante d\'1 phrase (garde la distance à pied si présente, n\'invente aucun fait précis). Rends {"items":[{"nom":"...","desc":"..."}]} dans le même ordre.'; }
    if(sec==='depart'){ payload=l.depart.checklist.filter(Boolean); instruction='Reformule cette check-list de départ : une action courte et concrète par ligne, commençant par un verbe à l\'infinitif, courtoise. Ne fusionne ni ne supprime aucune ligne. Rends {"items":["..."]} dans le même ordre.'; }
    const raw=await callClaude(`${toneText(l)}\n${instruction}\nDonnées : ${JSON.stringify(payload)}\nRéponds UNIQUEMENT en JSON strict.`, 1200);
    const p=parseJSONLoose(raw);
    if(sec==='arrivee'&&p.instructions) l.arrivee.instructions=p.instructions;
    if(sec==='equipements'&&Array.isArray(p.items)) l.equipements.forEach((e,i)=>{ if(p.items[i]?.instructions) e.instructions=p.items[i].instructions; });
    if(sec==='reglement'&&Array.isArray(p.items)){ const clean=l.reglement.filter(Boolean); p.items.forEach((v,i)=>{ if(v&&clean[i]!==undefined) clean[i]=v; }); l.reglement=clean; }
    if(sec==='recos'&&Array.isArray(p.items)) l.recos.forEach((r,i)=>{ if(p.items[i]?.desc) r.desc=p.items[i].desc; });
    if(sec==='depart'&&Array.isArray(p.items)){ const clean=l.depart.checklist.filter(Boolean); p.items.forEach((v,i)=>{ if(v&&clean[i]!==undefined) clean[i]=v; }); l.depart.checklist=clean; }
    l.translations={}; touch(l); renderCard(); toast('Rédaction améliorée');
  }catch(e){ done(); toast(e.message==='NO_KEY'?'Clé API manquante':'IA : '+e.message, true); }

    : `Vous n'êtes pas connecté : aucune sauvegarde ne sera prise. Rien n'est effacé pour autant — la copie ajoute les adresses manquantes et ne remplace jamais celles qui existent.`;
  document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>${esc(titre)}</h3><p class="sub">${esc(texte)}</p>
      <div class="inline-row" style="margin:4px 0 8px">
        <button class="btn btn-plain btn-sm" onclick="cocherLivrets(true)">Tout cocher</button>
        <button class="btn btn-plain btn-sm" onclick="cocherLivrets(false)">Tout décocher</button>
      </div>
      <div class="liste-livrets">
        ${autres.map(x=>`<label class="ligne-livret">
          <input type="checkbox" class="choix-livret" value="${esc(x.id)}" checked onchange="syncChoixLivrets()">
          <span>${esc(x.nom||'Logement sans nom')}</span>
          <span class="ville">${esc(x.ville||'')}</span>
        </label>`).join('')}
      </div>
      <p class="sub" style="margin-top:10px">${note}</p>
      <div class="modal-foot">
        <button class="btn btn-plain" onclick="closeModal()">Annuler</button>

  syncChoixLivrets(okLabel);
  document.getElementById('modal-ok').onclick=()=>{

function cocherLivrets(on){
  document.querySelectorAll('.choix-livret').forEach(c=>{ c.checked=on; });
  syncChoixLivrets();
}
function syncChoixLivrets(okLabel){
  const b=document.getElementById('modal-ok'); if(!b) return;
  if(okLabel) b.dataset.libelle=okLabel;
  const n=document.querySelectorAll('.choix-livret:checked').length;
  b.textContent=`${b.dataset.libelle||'Copier'}${n?' ('+n+')':''}`;
  b.disabled=!n;
